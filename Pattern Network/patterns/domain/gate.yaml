schema_version: 3

gate:
  id: V3-PN-DOMAIN-GATE
  pattern_node_id: domain
  project_name_formula: "{solution_name}.{pattern_node_name}"

checks:
  - id: V3-PN-DOM-GATE-001
    checker: project_identity
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-NAME-001
    parameters:
      solution_folder: Core
      target_framework: net8.0
      use_windows_forms: false
      required_package_references: []

  - id: V3-PN-DOM-GATE-002
    checker: project_references
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-ARCH-001
      - V3-PN-DOM-PRO-001
    parameters:
      required_pattern_nodes: []
      forbidden_pattern_nodes:
        - Application
        - WinForms

  - id: V3-PN-DOM-GATE-003
    checker: csharp_global_rules
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-CS-CLASS-001
      - V3-PN-CS-CLASS-002
      - V3-PN-CS-FILE-001
      - V3-PN-CS-FIELD-001
      - V3-PN-CS-FIELD-002
      - V3-PN-CS-CONST-001
      - V3-PN-CS-NAME-001
      - V3-PN-CS-NAMESPACE-001
      - V3-PN-CS-METHOD-001
      - V3-PN-CS-FLOW-001

  - id: V3-PN-DOM-GATE-004
    checker: forbidden_namespaces
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-DOM-004
      - V3-PN-DOM-PRO-002
    parameters:
      namespaces:
        - Microsoft.Extensions.DependencyInjection
        - System.Windows.Forms
        - System.Drawing
        - System.IO
        - System.Net

  - id: V3-PN-DOM-GATE-005
    checker: domain_state_boundaries
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-DOM-002
      - V3-PN-DOM-003
      - V3-PN-DOM-006
      - V3-PN-DOM-007
      - V3-PN-DOM-008
      - V3-PN-DOM-PRO-003
      - V3-PN-DOM-PRO-004
      - V3-PN-DOM-PRO-006
      - V3-PN-DOM-PRO-007
      - V3-PN-DOM-PRO-008

  - id: V3-PN-DOM-GATE-006
    checker: manual_review
    mode: audit
    severity: warning
    rule_refs:
      - V3-PN-DOM-001
      - V3-PN-DOM-005
      - V3-PN-DOM-PRO-005
