schema_version: 3

doctrine:
  id: V3-PN-USECASES-DOCTRINE
  title: "UseCases 節點準則"
  inherits: ../../doctrine.yaml

pattern_node:
  id: use-cases
  name: UseCases
  role: application_workflow_boundary

project:
  target_framework: net8.0
  use_windows_forms: false
  allowed_project_references:
    - Entities

responsibility:
  owns:
    - command
    - query
    - result
    - external_dependency_port
    - application_workflow
    - cross_aggregate_orchestration
    - final_screen_output
    - runtime_directive
  excludes:
    - domain_invariant_implementation
    - workflow_step_as_public_use_case
    - winforms_control
    - concrete_io_adapter

contract:
  input_grain: command_or_query
  output_grain: complete_result
  owner: UseCases
  workflow_identification:
    source: external_caller_and_complete_use_case_role
    class_naming_required: false
    method_name_required: false
  service_grouping:
    policy: cohesive_application_service
    multiple_workflow_methods_allowed: true
  expected_failure:
    transport: result
    required_fields:
      - IsSuccess
      - FailureCode
      - FailureMessage

rules:
  - id: V3-PN-UC-001
    title: "Command 與 Query 分離"
    statement: "改變狀態的輸入型別以 Command 結尾；唯讀輸入型別以 Query 結尾。"
    enforcement: automated

  - id: V3-PN-UC-002
    title: "公開入口是完整 Workflow Method"
    statement: "公開應用入口從一個外部事件執行到完整且可見的最終結果，接受一個 Command 或 Query 並回傳 Result；方法名稱不限定為 Execute。"
    enforcement: automated

  - id: V3-PN-UC-003
    title: "預期失敗使用 Result"
    statement: "輸入或業務條件不成立等預期失敗，必須以含 FailureCode 與 FailureMessage 的 Result 回傳。"
    enforcement: automated

  - id: V3-PN-UC-004
    title: "Query 不得改變領域狀態"
    statement: "接受 Query 的 Workflow Method 不得呼叫會改變 Entity 或 Aggregate 狀態的行為。"
    enforcement: manual

  - id: V3-PN-UC-005
    title: "公開契約不得洩漏 Entity"
    statement: "UI 可見的 Command、Query 與 Result 不得直接暴露 Entities 型別。"
    enforcement: automated

  - id: V3-PN-UC-006
    title: "外部能力以 Port 表達"
    statement: "時鐘、亂數、儲存與外部服務等能力由 UseCases 擁有介面，具體實作留在外層。"
    enforcement: manual

  - id: V3-PN-UC-007
    title: "Workflow 擁有完整順序"
    statement: "完整流程的決策、順序、互斥分支、停止條件與提交政策只能有一個 Application Workflow owner。"
    enforcement: manual

  - id: V3-PN-UC-008
    title: "Application Service 依內聚性分組"
    statement: "一個 Application Service 可以擁有多個內聚的公開 Workflow Method；不得以一個 method 一個 class 作為強制結構。"
    enforcement: automated
