schema_version: 3

gate:
  id: V3-PN-WINFORMS-GATE
  pattern_node_id: winforms
  project_name_formula: "{solution_name}.{pattern_node_name}"

checks:
  - id: V3-PN-UI-GATE-001
    checker: project_identity
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-NAME-001
    parameters:
      target_framework: net8.0-windows
      use_windows_forms: true

  - id: V3-PN-UI-GATE-002
    checker: project_references
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-ARCH-001
      - V3-PN-UI-003
      - V3-PN-UI-PRO-001
    parameters:
      required_pattern_nodes:
        - UseCases
      forbidden_pattern_nodes:
        - Entities

  - id: V3-PN-UI-GATE-003
    checker: csharp_global_rules
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-CS-CLASS-001
      - V3-PN-CS-CLASS-002
      - V3-PN-CS-FILE-001
      - V3-PN-CS-FIELD-001
      - V3-PN-CS-FIELD-002
      - V3-PN-CS-CONST-001
      - V3-PN-CS-NAME-001
      - V3-PN-CS-DI-001
      - V3-PN-CS-METHOD-001
      - V3-PN-CS-FLOW-001

  - id: V3-PN-UI-GATE-004
    checker: winforms_boundaries
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-UI-002
      - V3-PN-UI-003
      - V3-PN-UI-006
      - V3-PN-UI-008
      - V3-PN-UI-PRO-002
      - V3-PN-UI-PRO-004
      - V3-PN-UI-PRO-007
    parameters:
      direction_dispatch_event: DirectionRequested
      direction_value_type: Direction
      declared_direction_keys:
        - Up
        - Down
        - Left
        - Right

  - id: V3-PN-UI-GATE-005
    checker: top_level_program
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-CS-ENTRY-001
      - V3-PN-UI-005

  - id: V3-PN-UI-GATE-006
    checker: presentation_workflow_boundaries
    mode: audit
    severity: warning
    rule_refs:
      - V3-PN-UI-004
      - V3-PN-UI-007
      - V3-PN-UI-PRO-003
      - V3-PN-UI-PRO-005
      - V3-PN-UI-PRO-006

  - id: V3-PN-UI-GATE-007
    checker: manual_review
    mode: audit
    severity: warning
    rule_refs:
      - V3-PN-UI-001
      - V3-PN-UI-007
      - V3-PN-UI-PRO-006
