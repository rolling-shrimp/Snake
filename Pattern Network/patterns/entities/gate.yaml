schema_version: 3

gate:
  id: V3-PN-ENTITIES-GATE
  pattern_node_id: entities
  project_name_formula: "{solution_name}.{pattern_node_name}"

checks:
  - id: V3-PN-ENT-GATE-001
    checker: project_identity
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-NAME-001
    parameters:
      target_framework: net8.0
      use_windows_forms: false

  - id: V3-PN-ENT-GATE-002
    checker: project_references
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-ARCH-001
      - V3-PN-ENT-PRO-001
    parameters:
      required_pattern_nodes: []
      forbidden_pattern_nodes:
        - UseCases
        - WinForms

  - id: V3-PN-ENT-GATE-003
    checker: csharp_global_rules
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-CS-CLASS-001
      - V3-PN-CS-CLASS-002
      - V3-PN-CS-FILE-001
      - V3-PN-CS-FIELD-001
      - V3-PN-CS-FIELD-002
      - V3-PN-CS-CONST-001
      - V3-PN-CS-NAME-001
      - V3-PN-CS-METHOD-001
      - V3-PN-CS-FLOW-001

  - id: V3-PN-ENT-GATE-004
    checker: forbidden_namespaces
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-ENT-004
      - V3-PN-ENT-PRO-002
    parameters:
      namespaces:
        - System.Windows.Forms
        - System.Drawing
        - System.IO
        - System.Net

  - id: V3-PN-ENT-GATE-005
    checker: entity_boundaries
    mode: blocking
    severity: error
    rule_refs:
      - V3-PN-ENT-002
      - V3-PN-ENT-003
      - V3-PN-ENT-PRO-003
      - V3-PN-ENT-PRO-004

  - id: V3-PN-ENT-GATE-006
    checker: manual_review
    mode: audit
    severity: warning
    rule_refs:
      - V3-PN-ENT-001
      - V3-PN-ENT-005
      - V3-PN-ENT-PRO-005
      - V3-PN-ENT-PRO-006
