<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貪吃蛇第一關待開始畫面</title>
  <link rel="stylesheet" href="ui-preview.css">
</head>
<body>
  <main class="game-preview level-1" aria-label="貪吃蛇第一關待開始畫面">
    <div class="preview-content">
      <div class="board" data-board data-level="1" role="img" aria-label="10 乘 10 棋盤，安全起點有一條向右、長度三格且停止的蛇，棋盤上沒有物件"></div>

      <section class="information-panel" aria-labelledby="level-heading">
        <h1 class="level-heading" id="level-heading">第一關</h1>

        <div class="status-card">
          <div class="status-row">
            <div>
              <span class="status-label">目前蛇長</span>
              <strong class="length-value">3 / 20</strong>
            </div>
          </div>
          <div class="progress-track" role="progressbar" aria-label="過關進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15">
            <div class="progress-fill" style="--progress: 15%"></div>
          </div>
          <div class="progress-copy"><span>過關進度 15%</span><span>目標 20 格</span></div>
        </div>

        <section class="rules-card" aria-labelledby="rules-heading">
          <h2 id="rules-heading">規則提示</h2>
          <ul class="rule-list">
            <li class="rule-item"><span class="rule-icon" aria-hidden="true">🍓</span><span>普通食物：蛇長 +1 格</span></li>
            <li class="rule-item"><span class="rule-icon plain-icon" aria-hidden="true">↔</span><span>棋盤邊界可以穿越</span></li>
            <li class="rule-item"><span class="rule-icon plain-icon" aria-hidden="true">!</span><span>撞到自己的身體會死亡</span></li>
          </ul>
        </section>

        <button class="start-button" type="button">開始</button>
      </section>
    </div>
  </main>
  <script src="ui-preview.js"></script>
</body>
</html>
