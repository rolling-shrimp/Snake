        description: "食物消失且蛇長精確增加 2；增加後才進行通關判定。"
      - scenario_id: SCN-HANDLE-SPECIAL-FOOD-CONTACT-002
        title: "49 格跨越第三關目標"
        description: "實際蛇長成為 51，通關判定使用 51，不截斷為 50。"
      - scenario_id: SCN-HANDLE-SPECIAL-FOOD-CONTACT-003
        title: "第一關或非 active 特殊食物"
        description: "正常忽略，不改變蛇長或物件。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RBF
    use_case: handle-wall-collision
    source: "Domains/Game/rbf/handle-wall-collision/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-HANDLE-WALL-COLLISION-001
        title: "第三關撞牆"
        description: "不移動蛇並產生一次 WallCollision。"
      - scenario_id: SCN-HANDLE-WALL-COLLISION-002
        title: "第一、二關越界"
        description: "本 Use Case 不處理，交由 Wrap 邊界政策移動，不產生 WallCollision。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RBF
    use_case: update-third-level-door-state
    source: "Domains/Game/rbf/update-third-level-door-state/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-001
        title: "關閉前提醒"
        description: "門進入 ClosingWarning，仍可通行。"
      - scenario_id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-002
        title: "正常關閉"
        description: "門切換為 Closed。"
      - scenario_id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-003
        title: "蛇占用門格時延後"
        description: "門進入 CloseDeferred 且保持可通行；整條蛇離開後才關閉。"
      - scenario_id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-004
        title: "不是第三關 Playing"
        description: "停止門週期並保持門狀態不變。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: activate-second-level-play
    source: "Domains/Game/rif/activate-second-level-play/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-ACTIVATE-SECOND-LEVEL-PLAY-001
        title: "成功啟動第二關"
        description: "依指定順序產生四種合法物件，蛇長保持 3、護盾次數 0，最後公開 Playing 並開始 250 毫秒移動。"
      - scenario_id: SCN-ACTIVATE-SECOND-LEVEL-PLAY-002
        title: "錯誤來源事件"
        description: "正常忽略，不隱藏畫面、不產生物件、不啟動移動。"
      - scenario_id: SCN-ACTIVATE-SECOND-LEVEL-PLAY-003
        title: "重複事件"
        description: "正常忽略，不重生物件或重設移動時序。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: activate-third-level-play
    source: "Domains/Game/rif/activate-third-level-play/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-ACTIVATE-THIRD-LEVEL-PLAY-001
        title: "成功啟動第三關"
        description: "五種物件各一個且位置合法；蛇長保持 3，最後公開 Playing 並啟動移動與門週期。"
      - scenario_id: SCN-ACTIVATE-THIRD-LEVEL-PLAY-002
        title: "錯誤來源事件"
        description: "正常忽略，不產生物件、不啟動移動或門週期。"
      - scenario_id: SCN-ACTIVATE-THIRD-LEVEL-PLAY-003
        title: "重複事件"
        description: "正常忽略，不重生物件或重設任何計時。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: end-current-level-play
    source: "Domains/Game/rif/end-current-level-play/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-END-CURRENT-LEVEL-PLAY-001
        title: "第一或第二關通過"
        description: "先停止活動並記錄實際通關蛇長，再交接 prepare-next-level 一次。"
      - scenario_id: SCN-END-CURRENT-LEVEL-PLAY-002
        title: "第三關通過"
        description: "停止活動、保留實際蛇長並記錄 Passed，Game 切換 Completed。"
      - scenario_id: SCN-END-CURRENT-LEVEL-PLAY-003
        title: "死亡且無法保命"
        description: "停止活動、記錄 Failed 與 death_cause；FatalFire 最終長度最低為 0，Game 切換 GameOver。"
      - scenario_id: SCN-END-CURRENT-LEVEL-PLAY-004
        title: "重複終局事件"
        description: "正常忽略，不重複記錄結果或再次轉移階段。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: prepare-next-level
    source: "Domains/Game/rif/prepare-next-level/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-PREPARE-NEXT-LEVEL-001
        title: "第一關後準備第二關"
        description: "保留第一關成績；第二關 Ready、蛇長 3、進度 15%、護盾 0，棋盤尚無遊玩物件。"
      - scenario_id: SCN-PREPARE-NEXT-LEVEL-002
        title: "第二關後準備第三關"
        description: "保留第二關成績；第三關迷宮 Ready、蛇長 3、進度 6%、護盾 0，門已可顯示但週期未啟動。"
      - scenario_id: SCN-PREPARE-NEXT-LEVEL-003
        title: "第三關或非 Passed"
        description: "正常忽略，不建立不存在的下一關。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: replenish-triggered-object
    source: "Domains/Game/rif/replenish-triggered-object/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-REPLENISH-TRIGGERED-OBJECT-001
        title: "補充食物或危險物件"
        description: "建立新的 ItemId，於合法未占用格補同類物件，同類 active 物件仍最多一個。"
      - scenario_id: SCN-REPLENISH-TRIGGERED-OBJECT-002
        title: "依序補第二個護盾"
        description: "在合法空格建立第二個護盾；第二個被吃掉後不再補發。"
      - scenario_id: SCN-REPLENISH-TRIGGERED-OBJECT-003
        title: "暫無合法空格"
        description: "不重疊產生物件，記錄 pending，等待之後出現合法空格。"
      - scenario_id: SCN-REPLENISH-TRIGGERED-OBJECT-004
        title: "關卡已結束"
        description: "正常忽略並清除不應保留的 pending，不補充任何物件。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: rescue-with-shield
    source: "Domains/Game/rif/rescue-with-shield/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-RESCUE-WITH-SHIELD-001
        title: "使用護盾保命"
        description: "remaining_charges 成為 0，蛇以受擊前完整長度回到安全起點，衝突物件移位，Game 保持 Playing。"
      - scenario_id: SCN-RESCUE-WITH-SHIELD-002
        title: "火焰致死時恢復長度"
        description: "不提交長度 0，蛇以長度 2 回到安全起點，護盾消耗一次。"
      - scenario_id: SCN-RESCUE-WITH-SHIELD-003
        title: "沒有可用護盾"
        description: "不執行保命，交接 end-current-level-play 的失敗流程一次。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: RIF
    use_case: reset-game-for-replay
    source: "Domains/Game/rif/reset-game-for-replay/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-RESET-GAME-FOR-REPLAY-001
        title: "失敗後重玩"
        description: "清除舊輪次，第一關蛇長 3、進度 15%、草莓已產生、移動已開始，Game 直接為 Playing。"
      - scenario_id: SCN-RESET-GAME-FOR-REPLAY-002
        title: "完成後重玩"
        description: "清除通關結果並以相同第一關 Playing 狀態開始新輪次。"
      - scenario_id: SCN-RESET-GAME-FOR-REPLAY-003
        title: "重複或非終局事件"
        description: "正常忽略，不清除或重設目前輪次。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: SWF
    use_case: set-snake-direction
    source: "Domains/Game/swf/set-snake-direction/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-SET-SNAKE-DIRECTION-001
        title: "成功：玩家使用方向鍵要求蛇改變下一次前進方向。"
        description: "Snake.next_direction 原子更新為 Up，蛇的位置與長度在本次操作中不變。"
      - scenario_id: SCN-SET-SNAKE-DIRECTION-002
        title: "正常忽略：Game 不在 Playing，或玩家輸入與目前方向直接相反的 Left。"
        description: "正常忽略，方向、位置、長度與其他 Domain 狀態全部不變。"

  - domain: Game
    bounded_context: snake-game
    aggregate: game
    frame_type: TF
    use_case: update-level-status-read-model
    source: "Domains/Game/tf/update-level-status-read-model/acceptance.yaml"
    scenarios:
      - scenario_id: SCN-UPDATE-LEVEL-STATUS-READ-MODEL-001
        title: "第一、二關狀態投影"
        description: "蛇長 3、目標 20 應顯示 3/20 與 15%。"
      - scenario_id: SCN-UPDATE-LEVEL-STATUS-READ-MODEL-002
        title: "第三關狀態投影"
        description: "第三關蛇長 3、目標 50 應顯示 3/50 與 6%。"
      - scenario_id: SCN-UPDATE-LEVEL-STATUS-READ-MODEL-003
        title: "進度上下限與實際蛇長"
        description: "超過目標保留實際蛇長並顯示 100%；FatalFire 結果最低顯示 0%。"
      - scenario_id: SCN-UPDATE-LEVEL-STATUS-READ-MODEL-004
        title: "正常忽略重複或舊事件"
        description: "重複事件不得覆寫 Read Model 或改變 Domain。"

