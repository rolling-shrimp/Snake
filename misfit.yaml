schema_version: 3

custom_checks:
  - check_id: SNAKE-CODE-APPLICATION-USE-CASE-STRUCTURE
    checker: csharp_application_use_case_structure
    mode: blocking
    description: "檢查每個 technical operation 是否各自具有同名 UseCase 目錄、class 與自然方法，是否注入 IGameRepository，以及 DTO/Enum 是否分別位於所屬 Dto/Enums 目錄。"
    scope:
      - Core/Snake.Application
    rule_refs:
      - V3-PN-UC-002
      - V3-PN-UC-007
      - V3-PN-UC-008
      - V3-PN-UC-009
      - V3-PN-UC-010
      - V3-PN-UC-011
    misfit_refs:
      - SNAKE-MISFIT-USECASE-STRUCTURE

  - check_id: SNAKE-CODE-MOVEMENT-TOPOLOGY
    checker: csharp_snake_movement_topology
    mode: audit
    description: "檢查一次移動、尾格碰撞語意、蛇身連續性與 +1／+2 成長政策。"
    scope:
      - Core/Snake.Domain/Snake.cs
      - Core/Snake.Domain/Board.cs
      - Core/Snake.Application/_MoveSnakeUseCase/MoveSnakeUseCase.cs
      - Test/Snake.Test/MoveSnakeUseCaseTests.cs
    contract_refs:
      - V3-DOMAIN-GAME-MOVE-SNAKE
      - V3-ACCEPT-GAME-MOVE-SNAKE
    misfit_refs:
      - SNAKE-MISFIT-MOVEMENT-TOPOLOGY

manual_reviews:
  - review_id: SNAKE-REVIEW-TICK-GRANULARITY
    mode: audit
    status: pass
    reviewer: codex
    description: "確認一個 WinForms Timer Tick 只推進一格，不讀取或累積經過時間，也不以迴圈補跑。"
    contract_refs:
      - V3-JOURNEY-GAME-PLAY
      - V3-DOMAIN-GAME-MOVE-SNAKE
      - V3-ACCEPT-GAME-MOVE-SNAKE
    required_evidence:
      - code_review
      - behavioral
      - temporal
    evidence:
      - "GameForm 唯一 Timer 的 Interval 固定為 250ms；OnGameTimerTick 只呼叫一次 ExecuteGameTick。"
      - "GameForm.ExecuteGameTick 沒有 elapsed、Stopwatch、DateTime 或補跑迴圈，且只呼叫一次 MoveSnakeUseCase.MoveSnake。"
      - "MoveSnakeUseCaseTests.MoveSnake_MovesExactlyOneCell 與 NewArchitectureTests.GameFormTick_MovesSnakeExactlyOneCell 均通過。"
    misfit_refs:
      - SNAKE-MISFIT-TICK-OWNER
      - SNAKE-MISFIT-MOVEMENT-TOPOLOGY

  - review_id: SNAKE-REVIEW-UI-FLICKER
    mode: audit
    status: pending
    reviewer: unassigned
    description: "自動測試已驗證固定控制項與局部棋盤格更新；仍待實機長時間連續遊玩確認肉眼不可見閃爍。"
    contract_refs:
      - V3-PRES-WF-GAME-RENDER-SCREEN
      - V3-ACCEPT-GAME-RENDER-SCREEN
    required_evidence:
      - runtime_ui
      - temporal
    evidence:
      - "GameFormAndRenderTests.RepeatedScreenApplication_PreservesBoardAndRuleControlIdentity 在 STA WinForms 上通過。"
      - "GameForm 建立固定 100 個棋盤格，ApplyScreen 比對 HasCellChanged 後只重畫變動格位。"
      - "GameForm.ApplyScreen 不清空 Controls、不重建版面，也不呼叫 ResumeLayout(true)。"
      - "尚未完成實機長時間連續 Tick 的人工肉眼審查。"
    misfit_refs:
      - SNAKE-MISFIT-UI-REBUILD

  - review_id: SNAKE-REVIEW-DIRECTION-INPUT-DELIVERY
    mode: audit
    status: pass
    reviewer: codex
    description: "確認四個方向鍵在 Form 子控制項具有邏輯焦點時各派送一次，且下一個 Tick 使用已接受方向。"
    contract_refs:
      - V3-PRES-WF-GAME-HANDLE-DIRECTION-INPUT
      - V3-ACCEPT-GAME-HANDLE-DIRECTION-INPUT
      - V3-DOMAIN-GAME-SET-SNAKE-DIRECTION
      - V3-ACCEPT-GAME-SET-SNAKE-DIRECTION
    required_evidence:
      - runtime_ui
      - behavioral
      - temporal
    evidence:
      - "GameFormAndRenderTests 以具有邏輯焦點的開始按鈕呼叫 PreProcessMessage，驗證 Up、Down、Left、Right 各派送一次。"
      - "GameFormBehaviorTests.SetSnakeDirection_IsUsedByTheNextSingleTick 驗證下一個 Tick 使用方向 DTO。"
      - "blocking winforms Gate 與 PatternNetwork.Gates.Tests 均通過。"
    misfit_refs:
      - SNAKE-MISFIT-ARROW-KEY-DELIVERY

residual_misfits:
  - misfit_id: SNAKE-MISFIT-USECASE-STRUCTURE
    status: resolved
    severity: high
    title: "每個領域敘事已由獨立 UseCase 實作"
    observed: "Application 依 21 個 technical operation 建立 21 個獨立 _{Operation}UseCase 目錄與具體 class；DTO/Enums 分開存放；UseCase 皆注入 IGameRepository 取得 Infrastructure singleton 保存的 Domain Game，沒有 GameState 複本。"
    expected: "use_case.md 的一個可執行敘事對應一個同名 UseCase class 與自然方法；不使用集中式 ProcessGameTick、空 Command／Result 包裝或 Application GameState。"
    affected_paths:
      - Core/Snake.Application
      - Core/Snake.Application/DependencyInjection.cs
      - Core/Snake.Application/Repositories/IGameRepository.cs
      - Core/Snake.Infrastructure/Repositories/_Game/GameRepository.cs
      - Core/Snake.Infrastructure/DependencyInjection.cs
    contract_refs:
      - V3-JOURNEY-GAME-PLAY
    check_refs:
      - SNAKE-CODE-APPLICATION-USE-CASE-STRUCTURE

  - misfit_id: SNAKE-MISFIT-TICK-OWNER
    status: resolved
    severity: critical
    title: "Tick 順序由 GameForm 明確編排"
    observed: "GameForm 提供固定 250ms 事件來源，並依 journey 順序直接呼叫透過 DI 取得的 Use Case，每次只移動一格。"
    expected: "GameForm 擁有 Timer 與 Use Case 順序，不累積時間、不補跑多格，Use Case 不互相注入。"
    affected_paths:
      - App/Snake.WinForms/GameForm.cs
    contract_refs:
      - V3-JOURNEY-GAME-PLAY
      - V3-ACCEPT-GAME-MOVE-SNAKE
    check_refs:
      - SNAKE-REVIEW-TICK-GRANULARITY

  - misfit_id: SNAKE-MISFIT-MOVEMENT-TOPOLOGY
    status: resolved
    severity: critical
    title: "蛇移動、尾格碰撞與成長拓樸符合規格"
    observed: "Snake.PlanMovement 依 growth delta 建立完整計畫；MoveSnakeUseCase 每次只提交一個計畫，ReplaceBodyCells 強制唯一且連續。"
    expected: "一般移動排除離開尾格，成長時保留；所有狀態保持有序連續，+2 沒有合法延伸格時不得提交不合法蛇身。"
    affected_paths:
      - Core/Snake.Domain/Snake.cs
      - Core/Snake.Domain/Board.cs
      - Core/Snake.Application/_MoveSnakeUseCase/MoveSnakeUseCase.cs
      - Test/Snake.Test/MoveSnakeUseCaseTests.cs
    contract_refs:
      - V3-DOMAIN-GAME-MOVE-SNAKE
      - V3-ACCEPT-GAME-MOVE-SNAKE
    check_refs:
      - SNAKE-CODE-MOVEMENT-TOPOLOGY
      - SNAKE-REVIEW-TICK-GRANULARITY

  - misfit_id: SNAKE-MISFIT-UI-REBUILD
    status: resolved
    severity: high
    title: "GameForm 使用固定控制項局部更新畫面"
    observed: "GameForm 重用 100 個棋盤格、規則 Label 與其他控制項；ApplyScreen 只更新值有變化的控制項與格位。"
    expected: "相同畫面重複套用時控制項 identity 穩定，每個 Tick 不重建版面且只重畫實際變動格位。"
    affected_paths:
      - App/Snake.WinForms/GameForm.Rendering.cs
      - Test/Snake.Test/GameFormAndRenderTests.cs
    contract_refs:
      - V3-PRES-WF-GAME-RENDER-SCREEN
      - V3-ACCEPT-GAME-RENDER-SCREEN
    check_refs:
      - SNAKE-REVIEW-UI-FLICKER

  - misfit_id: SNAKE-MISFIT-ARROW-KEY-DELIVERY
    status: resolved
    severity: high
    title: "方向鍵在控制項導覽前交付給遊戲"
    observed: "GameForm.ProcessCmdKey 將四個方向鍵直接映射成 SnakeDirectionDTO 並只派送一次；未宣告輸入交回 WinForms。"
    expected: "焦點不得影響方向交付，且下一個固定 Tick 必須消費已接受方向。"
    affected_paths:
      - App/Snake.WinForms/GameForm.cs
      - Core/Snake.Application/_SetSnakeDirectionUseCase
      - Test/Snake.Test/GameFormAndRenderTests.cs
      - Test/Snake.Test/GameFormBehaviorTests.cs
    contract_refs:
      - V3-PRES-WF-GAME-HANDLE-DIRECTION-INPUT
      - V3-ACCEPT-GAME-HANDLE-DIRECTION-INPUT
      - V3-DOMAIN-GAME-SET-SNAKE-DIRECTION
    check_refs:
      - SNAKE-REVIEW-DIRECTION-INPUT-DELIVERY
