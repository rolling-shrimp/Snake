schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-FOOD-FOOD
aggregate: Food
state:
  - name: active_items
    type: List<FoodItem>
    required: true
    initial_value: []
  - name: pending_types
    type: List<FoodType>
    required: true
    uniqueness: true
value_objects:
  - name: FoodItem
    fields:
      - name: type
        type: FoodType
        required: true
      - name: position
        type: GridPosition
        required: true
  - name: FoodContact
    fields:
      - name: growth_delta
        type: integer
        required: true
enums:
  - name: FoodType
    values: [Ordinary, Special]
relations:
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-LEVEL-LEVEL
    ownership: reference_only
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
invariants:
  - id: V3-FOOD-INV-MAX-ONE-PER-TYPE
    rule: "每種 FoodType 同時最多存在一個 active item。"
  - id: V3-FOOD-INV-LEGAL-POSITION
    rule: "FoodItem 必須位於 Board 合法且未占用的位置。"
  - id: V3-FOOD-INV-LEVEL-TYPES
    rule: "第一關只能有 Ordinary；第二、三關可有 Ordinary 與 Special。"
behaviors:
  - id: V3-FOOD-BEHAVIOR-INSPECT-HEAD-CONTACT
    name: InspectHeadContact
    input:
      grain: one_candidate_head_position
    output:
      grain: zero_or_one_food_contact
    rules:
      - "只有蛇頭接觸才回傳 FoodContact；身體其他格經過不觸發。"
      - "Ordinary 回傳 growth_delta 1；Special 回傳 growth_delta 2。"
      - "檢查階段不得移除 FoodItem。"
  - id: V3-FOOD-BEHAVIOR-COMMIT-CONSUMPTION
    name: CommitConsumption
    input:
      grain: one_successfully_applied_food_contact
    output:
      grain: one_removed_food_item_and_pending_type
    rules:
      - "只有 Snake movement plan 與整次 Tick 可提交時才移除對應 FoodItem。"
      - "Special +2 無合法尾端延伸格時不得移除食物或加入待補類型。"
  - id: V3-FOOD-BEHAVIOR-SPAWN
    name: Spawn
    input:
      grain: one_allowed_food_type_and_legal_position
    output:
      grain: one_new_food_item
    rules:
      - "每種 FoodType 同時最多保留一個 FoodItem。"
      - "沒有合法格位時只保留唯一 pending type，不得重疊產生。"
  - id: V3-FOOD-BEHAVIOR-REPLENISH
    name: Replenish
    input:
      grain: one_pending_food_type_after_final_tick_outcome
    output:
      grain: one_spawned_or_still_pending_result
    rules:
      - "只有 Game 最終仍為目前關卡 Playing 且未通關時才補充。"
      - "關卡結束時清除 pending types 並停止補充。"
  - id: V3-FOOD-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_restart_request
    output:
      grain: one_empty_food_state
    rules:
      - "清除所有 active_items 與 pending_types。"
