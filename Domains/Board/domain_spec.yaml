schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-BOARD-BOARD
aggregate: Board
state:
  - name: board_id
    type: BoardId
    required: true
  - name: rows
    type: integer
    required: true
    fixed_value: 10
  - name: columns
    type: integer
    required: true
    fixed_value: 10
value_objects:
  - name: BoardId
    kind: opaque_identity
  - name: GridPosition
    fields:
      - name: x
        type: integer
        required: true
      - name: y
        type: integer
        required: true
  - name: PositionResolution
    fields:
      - name: outcome
        type: PositionResolutionOutcome
        required: true
      - name: position
        type: GridPosition
        required: false
enums:
  - name: PositionResolutionOutcome
    values: [Legal, BoundaryCollision]
relations:
  - target_ref: V3-AGG-LEVEL-LEVEL
    ownership: reference_only
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
  - target_ref: V3-AGG-DOORMAZE-DOORMAZE
    ownership: reference_only
invariants:
  - id: V3-BOARD-INV-DIMENSIONS
    rule: "棋盤固定為 10×10，共 100 個座標格。"
  - id: V3-BOARD-INV-POSITION-RANGE
    rule: "合法 GridPosition 的 x 與 y 必須介於 0 至 9。"
  - id: V3-BOARD-INV-NO-OVERLAP
    rule: "同一提交狀態中，蛇、活動物件、牆與不可通行門不得占用同一格。"
behaviors:
  - id: V3-BOARD-BEHAVIOR-RESOLVE-NEXT-HEAD
    name: ResolveNextHead
    input:
      grain: one_current_head_direction_and_boundary_policy
      fields: [current_head, direction, boundary_policy]
    output:
      grain: one_position_resolution
    rules:
      - "Wrap 政策將越界座標換算至相對邊界。"
      - "Blocked 政策對越界座標回傳 BoundaryCollision，不製造替代位置。"
  - id: V3-BOARD-BEHAVIOR-ARE-ADJACENT
    name: AreAdjacent
    input:
      grain: one_ordered_position_pair_and_boundary_policy
    output:
      grain: one_boolean_adjacency_result
    rules:
      - "相鄰只允許正交距離一格。"
      - "Wrap 政策下相對邊界格視為相鄰；Blocked 政策不得跨邊界相鄰。"
  - id: V3-BOARD-BEHAVIOR-SELECT-SPAWN-CELL
    name: SelectSpawnCell
    input:
      grain: one_set_of_walkable_and_occupied_cells
    output:
      grain: zero_or_one_legal_spawn_position
    rules:
      - "只可從可走且未被蛇、牆、門或其他物件占用的格位選取。"
      - "沒有合法格位時回傳無結果，不得以重疊位置代替。"
  - id: V3-BOARD-BEHAVIOR-FIND-SAFE-BODY
    name: FindSafeBody
    input:
      grain: one_required_length_and_board_policy
    output:
      grain: zero_or_one_head_to_tail_ordered_body
    rules:
      - "結果必須完整容納所需長度、每格唯一且依目前邊界政策連續。"
      - "結果不得與牆、不可通行門或不可搬移物件重疊。"
  - id: V3-BOARD-BEHAVIOR-TAIL-EXTENSION-CANDIDATES
    name: GetTailExtensionCandidates
    input:
      grain: one_ordered_body_and_board_policy
    output:
      grain: one_ordered_candidate_list
    rules:
      - "依尾端前進方向產生直後、左側、右側三個候選，順序固定。"
      - "候選仍須通過邊界、可走、未占用及蛇身連續性檢查。"
