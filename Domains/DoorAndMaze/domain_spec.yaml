schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-DOORMAZE-DOORMAZE
aggregate: DoorAndMaze
state:
  - name: door_and_maze_id
    type: DoorAndMazeId
    required: true
  - name: wall_cells
    type: List<GridPosition>
    required: true
  - name: doors
    type: List<Door>
    required: true
value_objects:
  - name: DoorAndMazeId
    kind: opaque_identity
  - name: DoorId
    kind: opaque_identity
  - name: Door
    fields:
      - name: door_id
        type: DoorId
        required: true
      - name: position
        type: GridPosition
        required: true
      - name: phase
        type: DoorPhase
        required: true
      - name: next_toggle_elapsed_milliseconds
        type: integer
        required: true
  - name: DoorTimedEvent
    fields:
      - name: due_elapsed_milliseconds
        type: integer
        required: true
      - name: kind
        type: DoorTimedEventKind
        required: true
      - name: door_id
        type: DoorId
        required: true
enums:
  - name: DoorPhase
    values: [Open, ClosingWarning, CloseDeferred, Closed]
  - name: DoorTimedEventKind
    values: [ClosingWarningDue, ToggleDue]
relations:
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
  - target_ref: V3-AGG-SHIELD-SHIELD
    ownership: reference_only
invariants:
  - id: V3-DOORMAZE-INV-LEVEL
    rule: "牆與門只存在於第三關，並占用 10×10 Board 中的格位。"
  - id: V3-DOORMAZE-INV-CAPACITY
    rule: "迷宮必須保留可容納 50 格連續蛇身的路線與至少一個可供活動物件使用的合法空格。"
  - id: V3-DOORMAZE-INV-DOOR-PASSABILITY
    rule: "Open、ClosingWarning、CloseDeferred 可通行；只有 Closed 不可通行。"
behaviors:
  - id: V3-DOORMAZE-BEHAVIOR-GET-DUE-EVENTS
    name: GetDueEvents
    input:
      grain: one_accumulated_elapsed_milliseconds_value
    output:
      grain: one_time_ordered_door_event_list
    rules:
      - "第三關 Playing 時每 6000ms 產生 ToggleDue。"
      - "預定由開啟轉為關閉前 2000ms 產生 ClosingWarningDue，因此第一輪分別於 4000ms 與 6000ms 到期。"
      - "此行為只列出事件，不改變門狀態。"
  - id: V3-DOORMAZE-BEHAVIOR-APPLY-WARNING
    name: ApplyClosingWarning
    input:
      grain: one_closing_warning_due_event
    output:
      grain: one_closing_warning_door_state
  - id: V3-DOORMAZE-BEHAVIOR-APPLY-TOGGLE
    name: ApplyToggle
    input:
      grain: one_toggle_due_event_and_current_snake_body
    output:
      grain: one_toggled_or_deferred_door_state
    rules:
      - "開門事件直接設為 Open。"
      - "關門時蛇頭或任一蛇身仍占用門格，設為 CloseDeferred 並保持可通行。"
      - "沒有蛇身占用時才設為 Closed。"
  - id: V3-DOORMAZE-BEHAVIOR-CLOSE-DEFERRED
    name: CloseDeferredDoor
    input:
      grain: one_close_deferred_door_and_current_snake_body
    output:
      grain: one_unchanged_or_closed_door_state
    rules:
      - "只有整條蛇離開門格後才可關閉。"
  - id: V3-DOORMAZE-BEHAVIOR-INSPECT-COLLISION
    name: InspectCollision
    input:
      grain: one_candidate_head_position
    output:
      grain: zero_or_one_wall_or_closed_door_collision
    rules:
      - "牆格回傳 WallCollision，Closed 門格回傳 ClosedDoorCollision。"
      - "碰撞檢查不得提交 Snake 移動。"
  - id: V3-DOORMAZE-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_restart_to_first_level_request
    output:
      grain: one_empty_maze_and_door_state
    rules:
      - "清除 wall_cells 與 doors，但保留 DoorAndMaze identity。"
      - "重玩後第一關不得保留第三關門事件或計時基準。"
