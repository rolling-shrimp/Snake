schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-GAMERESULT-GAMERESULT
aggregate: GameResult
state:
  - name: game_result_id
    type: GameResultId
    required: true
  - name: level_results
    type: List<LevelResult>
    required: true
    initial_value: []
value_objects:
  - name: GameResultId
    kind: opaque_identity
  - name: LevelResultId
    kind: opaque_identity
  - name: LevelResult
    fields:
      - name: level_result_id
        type: LevelResultId
        required: true
      - name: level
        type: LevelNumber
        required: true
      - name: outcome
        type: LevelOutcome
        required: true
      - name: final_length
        type: integer
        required: true
      - name: death_cause
        type: DeathCause
        required: false
enums:
  - name: LevelOutcome
    values: [Passed, Failed]
  - name: DeathCause
    values: [SelfCollision, BoundaryCollision, WallCollision, ClosedDoorCollision, Bomb, FatalFire]
relations:
  - target_ref: V3-AGG-GAME-GAME
    ownership: reference_only
  - target_ref: V3-AGG-LEVEL-LEVEL
    ownership: reference_only
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
invariants:
  - id: V3-GAMERESULT-INV-NONNEGATIVE-LENGTH
    rule: "final_length 不得小於 0。"
  - id: V3-GAMERESULT-INV-DEATH-CAUSE
    rule: "Failed 必須有 death_cause；Passed 不得有 death_cause。"
  - id: V3-GAMERESULT-INV-IDENTITY
    rule: "每筆 LevelResult 必須具有唯一 LevelResultId，既有結果不得覆寫。"
behaviors:
  - id: V3-GAMERESULT-BEHAVIOR-RECORD-PASSED
    name: RecordPassed
    input:
      grain: one_passed_level_and_actual_length
    output:
      grain: one_appended_level_result
    rules:
      - "保留實際通關蛇長，包括超過目標的長度。"
  - id: V3-GAMERESULT-BEHAVIOR-RECORD-FAILED
    name: RecordFailed
    input:
      grain: one_unrescued_death_event
    output:
      grain: one_appended_level_result
    rules:
      - "記錄失敗關卡、死亡原因與非負 final_length。"
      - "FatalFire 的顯示結果最低為 0。"
  - id: V3-GAMERESULT-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_restart_request
    output:
      grain: one_empty_result_history
    rules:
      - "清空 level_results 但保留 GameResult identity。"
