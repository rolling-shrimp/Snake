use_case: activate-second-level-play
bounded_context: snake-game
aggregate: game
frame_type: RIF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-ACTIVATE-SECOND-LEVEL-PLAY-001
    title: "成功啟動第二關"
    description: "依指定順序產生四種合法物件，蛇長保持 3、護盾次數 0，最後公開 Playing 並開始 250 毫秒移動。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-001
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-002
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-003
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-004
      domain_rules:
        - DOM-ACTIVATE-SECOND-LEVEL-PLAY-PRE-001
        - DOM-ACTIVATE-SECOND-LEVEL-PLAY-POST-001
      technical_contracts:
        - ActivateSecondLevelPlayResult.IsSuccess
        - TECH-ACTIVATE-SECOND-LEVEL-PLAY-STATE-001
    given:
      - fact: "第二關 Ready，開始命令已接受，棋盤尚無物件。"
    when:
      action: activate_second_level_play
      input:
        type: ActivateSecondLevelPlayCommand
        fields: {}
    then:
      output:
        type: ActivateSecondLevelPlayResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      reaction_effect: "依指定順序產生四種合法物件，蛇長保持 3、護盾次數 0，最後公開 Playing 並開始 250 毫秒移動。"

  - id: SCN-ACTIVATE-SECOND-LEVEL-PLAY-002
    title: "錯誤來源事件"
    description: "正常忽略，不隱藏畫面、不產生物件、不啟動移動。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-001
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-004
      domain_rules:
        - DOM-ACTIVATE-SECOND-LEVEL-PLAY-NOOP-001
        - DOM-ACTIVATE-SECOND-LEVEL-PLAY-INV-001
      technical_contracts:
        - ActivateSecondLevelPlayResult.IsSuccess
        - TECH-ACTIVATE-SECOND-LEVEL-PLAY-NOOP-001
    given:
      - fact: "事件不是由 start-second-level 成功接受所產生。"
    when:
      action: activate_second_level_play
      input:
        type: ActivateSecondLevelPlayCommand
        fields: {}
    then:
      output:
        type: ActivateSecondLevelPlayResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

  - id: SCN-ACTIVATE-SECOND-LEVEL-PLAY-003
    title: "重複事件"
    description: "正常忽略，不重生物件或重設移動時序。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-001
        - RIF-ACTIVATE-SECOND-LEVEL-PLAY-004
      domain_rules:
        - DOM-ACTIVATE-SECOND-LEVEL-PLAY-NOOP-001
        - DOM-ACTIVATE-SECOND-LEVEL-PLAY-INV-001
      technical_contracts:
        - ActivateSecondLevelPlayResult.IsSuccess
        - TECH-ACTIVATE-SECOND-LEVEL-PLAY-NOOP-001
    given:
      - fact: "相同 StartSecondLevelAccepted 已處理。"
    when:
      action: activate_second_level_play
      input:
        type: ActivateSecondLevelPlayCommand
        fields: {}
    then:
      output:
        type: ActivateSecondLevelPlayResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

