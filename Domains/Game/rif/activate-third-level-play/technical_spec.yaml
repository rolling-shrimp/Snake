use_case: activate-third-level-play
bounded_context: snake-game
aggregate: game
frame_type: RIF

spec_refs:
  domain: domain_spec.yaml

input:
  type: ActivateThirdLevelPlayCommand
  source: "StartThirdLevelAccepted domain event"
  fields:
    []

output:
  type: ActivateThirdLevelPlayResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "依序隱藏開始畫面結果、產生普通食物／特殊食物／第一個護盾／火焰／炸彈、切換 Playing，啟動 250 毫秒移動與門週期"

types:
  - name: ActivateThirdLevelPlayCommand
    fields:
      []
  - name: ActivateThirdLevelPlayResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-ACTIVATE-THIRD-LEVEL-PLAY-IN-001, DOM-ACTIVATE-THIRD-LEVEL-PLAY-PRE-001]
    target: ActivateThirdLevelPlayCommand
    description: "Domain Event 經 Reactor 去重後轉成一次內部 Command。"
  - domain_rules: [DOM-ACTIVATE-THIRD-LEVEL-PLAY-INV-001, DOM-ACTIVATE-THIRD-LEVEL-PLAY-POST-001]
    target: ActivateThirdLevelPlayResult
    description: "依序隱藏開始畫面結果、產生普通食物／特殊食物／第一個護盾／火焰／炸彈、切換 Playing，啟動 250 毫秒移動與門週期"

state_mappings:
  - mapping_id: TECH-ACTIVATE-THIRD-LEVEL-PLAY-STATE-001
    description: "依序隱藏開始畫面結果、產生普通食物／特殊食物／第一個護盾／火焰／炸彈、切換 Playing，啟動 250 毫秒移動與門週期"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-ACTIVATE-THIRD-LEVEL-PLAY-NOOP-001
    condition: "事件不是由 start-third-level 成功接受所產生。"
    behavior: "正常忽略，不產生物件、不啟動移動或門週期。"

