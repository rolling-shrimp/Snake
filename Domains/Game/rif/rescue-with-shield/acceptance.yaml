use_case: rescue-with-shield
bounded_context: snake-game
aggregate: game
frame_type: RIF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-RESCUE-WITH-SHIELD-001
    title: "使用護盾保命"
    description: "remaining_charges 成為 0，蛇以受擊前完整長度回到安全起點，衝突物件移位，Game 保持 Playing。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RIF-RESCUE-WITH-SHIELD-001
        - RIF-RESCUE-WITH-SHIELD-002
        - RIF-RESCUE-WITH-SHIELD-003
        - RIF-RESCUE-WITH-SHIELD-004
      domain_rules:
        - DOM-RESCUE-WITH-SHIELD-PRE-001
        - DOM-RESCUE-WITH-SHIELD-POST-001
      technical_contracts:
        - RescueWithShieldResult.IsSuccess
        - TECH-RESCUE-WITH-SHIELD-STATE-001
    given:
      - fact: "可保護死亡事件發生，remaining_charges 為 1，安全起點可放置完整蛇身。"
    when:
      action: rescue_with_shield
      input:
        type: RescueWithShieldCommand
        fields: {}
    then:
      output:
        type: RescueWithShieldResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      reaction_effect: "remaining_charges 成為 0，蛇以受擊前完整長度回到安全起點，衝突物件移位，Game 保持 Playing。"

  - id: SCN-RESCUE-WITH-SHIELD-002
    title: "火焰致死時恢復長度"
    description: "不提交長度 0，蛇以長度 2 回到安全起點，護盾消耗一次。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RIF-RESCUE-WITH-SHIELD-001
        - RIF-RESCUE-WITH-SHIELD-002
        - RIF-RESCUE-WITH-SHIELD-003
        - RIF-RESCUE-WITH-SHIELD-004
      domain_rules:
        - DOM-RESCUE-WITH-SHIELD-PRE-001
        - DOM-RESCUE-WITH-SHIELD-POST-001
      technical_contracts:
        - RescueWithShieldResult.IsSuccess
        - TECH-RESCUE-WITH-SHIELD-STATE-001
    given:
      - fact: "FatalFire 發生且有護盾，PreHitLength 為 2。"
    when:
      action: rescue_with_shield
      input:
        type: RescueWithShieldCommand
        fields: {}
    then:
      output:
        type: RescueWithShieldResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      reaction_effect: "不提交長度 0，蛇以長度 2 回到安全起點，護盾消耗一次。"

  - id: SCN-RESCUE-WITH-SHIELD-003
    title: "沒有可用護盾"
    description: "不執行保命，交接 end-current-level-play 的失敗流程一次。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RIF-RESCUE-WITH-SHIELD-001
        - RIF-RESCUE-WITH-SHIELD-004
      domain_rules:
        - DOM-RESCUE-WITH-SHIELD-NOOP-001
        - DOM-RESCUE-WITH-SHIELD-INV-001
      technical_contracts:
        - RescueWithShieldResult.IsSuccess
        - TECH-RESCUE-WITH-SHIELD-NOOP-001
    given:
      - fact: "死亡事件發生但 remaining_charges 為 0。"
    when:
      action: rescue_with_shield
      input:
        type: RescueWithShieldCommand
        fields: {}
    then:
      output:
        type: RescueWithShieldResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

