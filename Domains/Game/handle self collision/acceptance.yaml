schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-HANDLE-SELF-COLLISION
contract_ref: V3-DOMAIN-GAME-HANDLE-SELF-COLLISION
scenarios:
  - id: V3-SCN-HANDLE-SELF-COLLISION
    title: "蛇下一格撞到自身時形成致命事件，且不提交重疊蛇身。"
    given:
      precondition: "目前關卡為 Playing，且下一個蛇頭格與碰撞集合重疊。"
    when:
      operation: HandleSelfCollision
      call_count: 1
    then:
      postcondition: "蛇身沒有重疊，且目前 Tick 存在自身碰撞致命事件。"
    evidence: [behavioral, invariant]
