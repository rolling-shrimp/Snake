use_case: start-second-level
bounded_context: snake-game
aggregate: game
frame_type: CBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: StartSecondLevelCommand
  source: "第二關待開始畫面的「開始」按鈕。"
  fields:
    []

output:
  type: StartSecondLevelResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "只交接一次 activate-second-level-play，不建立部分 Playing 狀態"

types:
  - name: StartSecondLevelCommand
    fields:
      []
  - name: StartSecondLevelResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-START-SECOND-LEVEL-IN-001, DOM-START-SECOND-LEVEL-PRE-001]
    target: StartSecondLevelCommand
    description: "將外部觸發映射為 StartSecondLevelCommand，並在執行效果前驗證前置條件。"
  - domain_rules: [DOM-START-SECOND-LEVEL-INV-001, DOM-START-SECOND-LEVEL-POST-001]
    target: StartSecondLevelResult
    description: "只交接一次 activate-second-level-play，不建立部分 Playing 狀態"

state_mappings:
  - mapping_id: TECH-START-SECOND-LEVEL-STATE-001
    description: "命令被接受一次並交接 activate-second-level-play 一次；CBF 不直接建立 Playing 狀態。"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-START-SECOND-LEVEL-NOOP-001
    condition: "目前不是第二關 Ready，或同一 Ready 狀態的開始命令已接受。"
    behavior: "正常忽略，不交接 RIF，所有 Domain 狀態保持不變。"

