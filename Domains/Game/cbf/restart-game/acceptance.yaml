use_case: restart-game
bounded_context: snake-game
aggregate: game
frame_type: CBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-RESTART-GAME-001
    title: "成功：玩家在遊戲失敗或第三關完成後點擊「重玩」按鈕。"
    description: "命令被接受一次並交接 reset-game-for-replay 一次；原輪次資料由後續 RIF 完整重設。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - CBF-RESTART-GAME-001
        - CBF-RESTART-GAME-002
        - CBF-RESTART-GAME-003
        - CBF-RESTART-GAME-004
      domain_rules:
        - DOM-RESTART-GAME-IN-001
        - DOM-RESTART-GAME-PRE-001
        - DOM-RESTART-GAME-INV-001
        - DOM-RESTART-GAME-POST-001
      technical_contracts:
        - RestartGameResult.IsSuccess
        - TECH-RESTART-GAME-STATE-001
    given:
      - fact: "Game 處於 GameOver 或 Completed，且本次重玩命令尚未接受。"
    when:
      action: restart_game
      input:
        type: RestartGameCommand
        fields:
          {}
    then:
      output:
        type: RestartGameResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "命令被接受一次並交接 reset-game-for-replay 一次；原輪次資料由後續 RIF 完整重設。"

  - id: SCN-RESTART-GAME-002
    title: "正常忽略：Game 尚未進入 GameOver 或 Completed，或同一終局狀態的重玩命令已接受。"
    description: "正常忽略，不重設任何 Domain，也不交接重玩 RIF。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - CBF-RESTART-GAME-002
        - CBF-RESTART-GAME-004
      domain_rules:
        - DOM-RESTART-GAME-PRE-001
        - DOM-RESTART-GAME-NOOP-001
      technical_contracts:
        - RestartGameResult.IsSuccess
        - TECH-RESTART-GAME-NOOP-001
    given:
      - fact: "Game 尚未進入 GameOver 或 Completed，或同一終局狀態的重玩命令已接受。"
    when:
      action: restart_game
      input:
        type: RestartGameCommand
        fields: {}
    then:
      output:
        type: RestartGameResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

