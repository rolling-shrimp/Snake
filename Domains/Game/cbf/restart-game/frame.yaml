bounded_context: snake-game
aggregate: game

use_case:
  name: restart-game
  requirement: "玩家在遊戲失敗或第三關完成後點擊「重玩」按鈕。"
frame_type: CBF

world_facts:
  actor: player
  trigger: "重玩按鈕 click"
  required_state: "game.phase == GameOver 或 game.phase == Completed"
  successful_outcome: "只交接一次 reset-game-for-replay，不在 CBF 中重設部分輪次資料"
  execution_policy: serialized_once_per_state

frame_concerns:
  - concern_ref: CBF-CONCERN-001
    check_id: CBF-RESTART-GAME-001
    description: "確保 重玩按鈕 click 被辨識為 restart-game，且輸入目標與欄位完整。"

  - concern_ref: CBF-CONCERN-002
    check_id: CBF-RESTART-GAME-002
    description: "確保只有在 game.phase == GameOver 或 game.phase == Completed 時才接受處理。"

  - concern_ref: CBF-CONCERN-003
    check_id: CBF-RESTART-GAME-003
    description: "確保同一有效觸發最多接受一次，不重複交接後續流程。"

  - concern_ref: CBF-CONCERN-004
    check_id: CBF-RESTART-GAME-004
    description: "確保 只交接一次 reset-game-for-replay，不在 CBF 中重設部分輪次資料；不符合條件時不得留下任何部分效果。"

