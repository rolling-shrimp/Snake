use_case: restart-game
bounded_context: snake-game
aggregate: game
frame_type: CBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: RestartGameCommand
  source: "終局畫面的「重玩」按鈕。"
  fields:
    []

output:
  type: RestartGameResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "只交接一次 reset-game-for-replay，不在 CBF 中重設部分輪次資料"

types:
  - name: RestartGameCommand
    fields:
      []
  - name: RestartGameResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-RESTART-GAME-IN-001, DOM-RESTART-GAME-PRE-001]
    target: RestartGameCommand
    description: "將外部觸發映射為 RestartGameCommand，並在執行效果前驗證前置條件。"
  - domain_rules: [DOM-RESTART-GAME-INV-001, DOM-RESTART-GAME-POST-001]
    target: RestartGameResult
    description: "只交接一次 reset-game-for-replay，不在 CBF 中重設部分輪次資料"

state_mappings:
  - mapping_id: TECH-RESTART-GAME-STATE-001
    description: "命令被接受一次並交接 reset-game-for-replay 一次；原輪次資料由後續 RIF 完整重設。"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-RESTART-GAME-NOOP-001
    condition: "Game 尚未進入 GameOver 或 Completed，或同一終局狀態的重玩命令已接受。"
    behavior: "正常忽略，不重設任何 Domain，也不交接重玩 RIF。"

