schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-HANDLE-SPECIAL-FOOD-CONTACT
contract_ref: V3-DOMAIN-GAME-HANDLE-SPECIAL-FOOD-CONTACT
scenarios:
  - id: V3-SCN-HANDLE-SPECIAL-FOOD-CONTACT
    title: "蛇頭接觸特殊食物時，特殊食物消失且蛇長增加 2 格。"
    given:
      precondition: "目前為第二或第三關 Playing，且蛇頭接觸特殊食物。"
    when:
      operation: HandleSpecialFoodContact
      call_count: 1
    then:
      postcondition: "蛇長增加 2，食物已移除，進度依新蛇長更新。"
    evidence: [behavioral, invariant]
