use_case: handle-shield-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: HandleShieldContactCommand
  source: "系統條件監測：snake head contacts active ShieldItem"
  fields:
    - name: ShieldItemId
      csharp_type: string
      required: true

output:
  type: HandleShieldContactResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "移除護盾、remaining_charges 增加 1，並保留本關已產生護盾數量"

types:
  - name: HandleShieldContactCommand
    fields:
      - name: ShieldItemId
        csharp_type: string
        required: true
  - name: HandleShieldContactResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-HANDLE-SHIELD-CONTACT-IN-001, DOM-HANDLE-SHIELD-CONTACT-PRE-001]
    target: HandleShieldContactCommand
    description: "條件事實映射為一次可去重的自動命令。"
  - domain_rules: [DOM-HANDLE-SHIELD-CONTACT-INV-001, DOM-HANDLE-SHIELD-CONTACT-POST-001]
    target: HandleShieldContactResult
    description: "移除護盾、remaining_charges 增加 1，並保留本關已產生護盾數量"

state_mappings:
  - mapping_id: TECH-HANDLE-SHIELD-CONTACT-STATE-001
    description: "移除護盾、remaining_charges 增加 1，並保留本關已產生護盾數量"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-HANDLE-SHIELD-CONTACT-NOOP-001
    condition: "ShieldItem 已被消耗或不屬於目前關卡。"
    behavior: "正常忽略，不重複增加保命次數。"

