use_case: handle-shield-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

domain_refs:
  - domain: Game
    path: ../../domain_spec.yaml
    aggregate: Game
  - domain: Shield
    path: ../../../Shield/domain_spec.yaml
    aggregate: Shield
  - domain: Level
    path: ../../../Level/domain_spec.yaml
    aggregate: Level

traceability:
  requirement: "frame.yaml#use_case.requirement"
  frame_checks:
    - RBF-HANDLE-SHIELD-CONTACT-001
    - RBF-HANDLE-SHIELD-CONTACT-002
    - RBF-HANDLE-SHIELD-CONTACT-003
    - RBF-HANDLE-SHIELD-CONTACT-004

contract:
  input:
    data: HandleShieldContactCommand
    fields:
      - name: ShieldItemId
        type: string
        required: true
    rules:
      - rule_id: DOM-HANDLE-SHIELD-CONTACT-IN-001
        description: "Input 表示一次已觀察到的條件事實：snake head contacts active ShieldItem。"
        domain_rule_refs:
          - SHIELD-COLLECT-001
          - SHIELD-SPAWN-002
          - SHIELD-INV-001
          - SHIELD-INV-003

  output:
    data: HandleShieldContactResult
    rules:
      - rule_id: DOM-HANDLE-SHIELD-CONTACT-OUT-001
        description: "Output 表示必要行為是否完成；不適用條件以成功 no-op 表示。"
        domain_rule_refs: []

  preconditions:
    - rule_id: DOM-HANDLE-SHIELD-CONTACT-PRE-001
      description: "game.phase == Playing、level.number 為 2 或 3，且接觸 active ShieldItem"
      domain_rule_refs:
        - SHIELD-COLLECT-001
        - SHIELD-SPAWN-002
        - SHIELD-INV-001
        - SHIELD-INV-003

  invariants:
    - rule_id: DOM-HANDLE-SHIELD-CONTACT-INV-001
      description: "同一條件事實最多處理一次；移除護盾、remaining_charges 增加 1，並保留本關已產生護盾數量。"
      domain_rule_refs:
        - SHIELD-COLLECT-001
        - SHIELD-SPAWN-002
        - SHIELD-INV-001
        - SHIELD-INV-003

  process:
    - order: 1
      action: "確認觸發事實與 game.phase == Playing、level.number 為 2 或 3，且接觸 active ShieldItem。"
    - order: 2
      action: "移除護盾、remaining_charges 增加 1，並保留本關已產生護盾數量"
    - order: 3
      action: "發布後續流程需要的結果事實，但不越權執行其他 Use Case。"

  postconditions:
    - rule_id: DOM-HANDLE-SHIELD-CONTACT-POST-001
      description: "移除護盾、remaining_charges 增加 1，並保留本關已產生護盾數量"
      domain_rule_refs:
        - SHIELD-COLLECT-001
        - SHIELD-SPAWN-002
        - SHIELD-INV-001
        - SHIELD-INV-003

  contract_violations: []

  not_applicable:
    - rule_id: DOM-HANDLE-SHIELD-CONTACT-NOOP-001
      condition: "ShieldItem 已被消耗或不屬於目前關卡。"
      behavior: ignore
      error: none
      state_guarantee: "正常忽略，不重複增加保命次數。"
      domain_rule_refs:
        - SHIELD-COLLECT-001
        - SHIELD-SPAWN-002
        - SHIELD-INV-001
        - SHIELD-INV-003

