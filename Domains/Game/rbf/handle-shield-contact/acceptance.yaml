use_case: handle-shield-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-HANDLE-SHIELD-CONTACT-001
    title: "取得護盾"
    description: "ShieldItem 消失，remaining_charges 增加 1，spawned_count 不被重設。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-SHIELD-CONTACT-001
        - RBF-HANDLE-SHIELD-CONTACT-002
        - RBF-HANDLE-SHIELD-CONTACT-003
        - RBF-HANDLE-SHIELD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-SHIELD-CONTACT-PRE-001
        - DOM-HANDLE-SHIELD-CONTACT-POST-001
      technical_contracts:
        - HandleShieldContactResult.IsSuccess
        - TECH-HANDLE-SHIELD-CONTACT-STATE-001
    given:
      - fact: "第二或第三關 Playing，蛇頭接觸 active ShieldItem。"
    when:
      action: handle_shield_contact
      input:
        type: HandleShieldContactCommand
        fields: {}
    then:
      output:
        type: HandleShieldContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "ShieldItem 消失，remaining_charges 增加 1，spawned_count 不被重設。"

  - id: SCN-HANDLE-SHIELD-CONTACT-002
    title: "接觸已失效護盾"
    description: "正常忽略，不重複增加保命次數。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-SHIELD-CONTACT-001
        - RBF-HANDLE-SHIELD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-SHIELD-CONTACT-NOOP-001
        - DOM-HANDLE-SHIELD-CONTACT-INV-001
      technical_contracts:
        - HandleShieldContactResult.IsSuccess
        - TECH-HANDLE-SHIELD-CONTACT-NOOP-001
    given:
      - fact: "ShieldItem 已被消耗或不屬於目前關卡。"
    when:
      action: handle_shield_contact
      input:
        type: HandleShieldContactCommand
        fields: {}
    then:
      output:
        type: HandleShieldContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

