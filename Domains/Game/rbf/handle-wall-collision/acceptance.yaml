use_case: handle-wall-collision
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-HANDLE-WALL-COLLISION-001
    title: "第三關撞牆"
    description: "不移動蛇並產生一次 WallCollision。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-WALL-COLLISION-001
        - RBF-HANDLE-WALL-COLLISION-002
        - RBF-HANDLE-WALL-COLLISION-003
        - RBF-HANDLE-WALL-COLLISION-004
      domain_rules:
        - DOM-HANDLE-WALL-COLLISION-PRE-001
        - DOM-HANDLE-WALL-COLLISION-POST-001
      technical_contracts:
        - HandleWallCollisionResult.IsSuccess
        - TECH-HANDLE-WALL-COLLISION-STATE-001
    given:
      - fact: "第三關 Playing，蛇頭下一格是外牆或迷宮內牆。"
    when:
      action: handle_wall_collision
      input:
        type: HandleWallCollisionCommand
        fields: {}
    then:
      output:
        type: HandleWallCollisionResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "不移動蛇並產生一次 WallCollision。"

  - id: SCN-HANDLE-WALL-COLLISION-002
    title: "第一、二關越界"
    description: "本 Use Case 不處理，交由 Wrap 邊界政策移動，不產生 WallCollision。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-WALL-COLLISION-001
        - RBF-HANDLE-WALL-COLLISION-004
      domain_rules:
        - DOM-HANDLE-WALL-COLLISION-NOOP-001
        - DOM-HANDLE-WALL-COLLISION-INV-001
      technical_contracts:
        - HandleWallCollisionResult.IsSuccess
        - TECH-HANDLE-WALL-COLLISION-NOOP-001
    given:
      - fact: "第一或第二關蛇頭跨越棋盤邊界。"
    when:
      action: handle_wall_collision
      input:
        type: HandleWallCollisionCommand
        fields: {}
    then:
      output:
        type: HandleWallCollisionResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

