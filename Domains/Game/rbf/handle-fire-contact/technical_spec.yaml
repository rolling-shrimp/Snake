use_case: handle-fire-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: HandleFireContactCommand
  source: "系統條件監測：snake head contacts active FireItem"
  fields:
    - name: FireItemId
      csharp_type: string
      required: true

output:
  type: HandleFireContactResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "移除火焰；非致死時提交減長，致死時產生 FatalFire 並等待 Shield 決策"

types:
  - name: HandleFireContactCommand
    fields:
      - name: FireItemId
        csharp_type: string
        required: true
  - name: HandleFireContactResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-HANDLE-FIRE-CONTACT-IN-001, DOM-HANDLE-FIRE-CONTACT-PRE-001]
    target: HandleFireContactCommand
    description: "條件事實映射為一次可去重的自動命令。"
  - domain_rules: [DOM-HANDLE-FIRE-CONTACT-INV-001, DOM-HANDLE-FIRE-CONTACT-POST-001]
    target: HandleFireContactResult
    description: "移除火焰；非致死時提交減長，致死時產生 FatalFire 並等待 Shield 決策"

state_mappings:
  - mapping_id: TECH-HANDLE-FIRE-CONTACT-STATE-001
    description: "移除火焰；非致死時提交減長，致死時產生 FatalFire 並等待 Shield 決策"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-HANDLE-FIRE-CONTACT-NOOP-001
    condition: "第一關，或接觸的 FireItem 已失效。"
    behavior: "正常忽略，不改變蛇長、護盾或物件。"

