use_case: update-third-level-door-state
bounded_context: snake-game
aggregate: game
frame_type: RBF

domain_refs:
  - domain: Game
    path: ../../domain_spec.yaml
    aggregate: Game
  - domain: DoorAndMaze
    path: ../../../DoorAndMaze/domain_spec.yaml
    aggregate: DoorAndMaze
  - domain: Snake
    path: ../../../Snake/domain_spec.yaml
    aggregate: Snake

traceability:
  requirement: "frame.yaml#use_case.requirement"
  frame_checks:
    - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-001
    - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-002
    - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-003
    - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-004

contract:
  input:
    data: UpdateThirdLevelDoorStateCommand
    fields:
      - name: ElapsedMilliseconds
        type: int
        required: true
    rules:
      - rule_id: DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-IN-001
        description: "Input 表示一次已觀察到的條件事實：third-level door clock advances。"
        domain_rule_refs:
          - DOOR-MAZE-CYCLE-001
          - DOOR-MAZE-CYCLE-002
          - DOOR-MAZE-CYCLE-003
          - DOOR-MAZE-CYCLE-004
          - DOOR-MAZE-CYCLE-005

  output:
    data: UpdateThirdLevelDoorStateResult
    rules:
      - rule_id: DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-OUT-001
        description: "Output 表示必要行為是否完成；不適用條件以成功 no-op 表示。"
        domain_rule_refs: []

  preconditions:
    - rule_id: DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-PRE-001
      description: "game.phase == Playing 且 level.number == 3"
      domain_rule_refs:
        - DOOR-MAZE-CYCLE-001
        - DOOR-MAZE-CYCLE-002
        - DOOR-MAZE-CYCLE-003
        - DOOR-MAZE-CYCLE-004
        - DOOR-MAZE-CYCLE-005

  invariants:
    - rule_id: DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-INV-001
      description: "同一條件事實最多處理一次；依時間進入 ClosingWarning 或切換開關；蛇占用門格時延後關閉直到完全離開。"
      domain_rule_refs:
        - DOOR-MAZE-CYCLE-001
        - DOOR-MAZE-CYCLE-002
        - DOOR-MAZE-CYCLE-003
        - DOOR-MAZE-CYCLE-004
        - DOOR-MAZE-CYCLE-005

  process:
    - order: 1
      action: "確認觸發事實與 game.phase == Playing 且 level.number == 3。"
    - order: 2
      action: "依時間進入 ClosingWarning 或切換開關；蛇占用門格時延後關閉直到完全離開"
    - order: 3
      action: "發布後續流程需要的結果事實，但不越權執行其他 Use Case。"

  postconditions:
    - rule_id: DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-POST-001
      description: "依時間進入 ClosingWarning 或切換開關；蛇占用門格時延後關閉直到完全離開"
      domain_rule_refs:
        - DOOR-MAZE-CYCLE-001
        - DOOR-MAZE-CYCLE-002
        - DOOR-MAZE-CYCLE-003
        - DOOR-MAZE-CYCLE-004
        - DOOR-MAZE-CYCLE-005

  contract_violations: []

  not_applicable:
    - rule_id: DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-NOOP-001
      condition: "Game 不在 Playing 或 Level 不是 3。"
      behavior: ignore
      error: none
      state_guarantee: "停止門週期並保持門狀態不變。"
      domain_rule_refs:
        - DOOR-MAZE-CYCLE-001
        - DOOR-MAZE-CYCLE-002
        - DOOR-MAZE-CYCLE-003
        - DOOR-MAZE-CYCLE-004
        - DOOR-MAZE-CYCLE-005

