use_case: update-third-level-door-state
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-001
    title: "關閉前提醒"
    description: "門進入 ClosingWarning，仍可通行。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-001
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-002
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-003
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-004
      domain_rules:
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-PRE-001
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-POST-001
      technical_contracts:
        - UpdateThirdLevelDoorStateResult.IsSuccess
        - TECH-UPDATE-THIRD-LEVEL-DOOR-STATE-STATE-001
    given:
      - fact: "第三關 Playing，距預定關閉剩餘 2 秒。"
    when:
      action: update_third_level_door_state
      input:
        type: UpdateThirdLevelDoorStateCommand
        fields: {}
    then:
      output:
        type: UpdateThirdLevelDoorStateResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "門進入 ClosingWarning，仍可通行。"

  - id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-002
    title: "正常關閉"
    description: "門切換為 Closed。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-001
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-002
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-003
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-004
      domain_rules:
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-PRE-001
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-POST-001
      technical_contracts:
        - UpdateThirdLevelDoorStateResult.IsSuccess
        - TECH-UPDATE-THIRD-LEVEL-DOOR-STATE-STATE-001
    given:
      - fact: "第三關 Playing，6 秒切換時刻到達，蛇未占用門格。"
    when:
      action: update_third_level_door_state
      input:
        type: UpdateThirdLevelDoorStateCommand
        fields: {}
    then:
      output:
        type: UpdateThirdLevelDoorStateResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "門切換為 Closed。"

  - id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-003
    title: "蛇占用門格時延後"
    description: "門進入 CloseDeferred 且保持可通行；整條蛇離開後才關閉。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-001
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-002
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-003
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-004
      domain_rules:
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-PRE-001
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-POST-001
      technical_contracts:
        - UpdateThirdLevelDoorStateResult.IsSuccess
        - TECH-UPDATE-THIRD-LEVEL-DOOR-STATE-STATE-001
    given:
      - fact: "切換時刻到達，但蛇頭或蛇身仍占用門格。"
    when:
      action: update_third_level_door_state
      input:
        type: UpdateThirdLevelDoorStateCommand
        fields: {}
    then:
      output:
        type: UpdateThirdLevelDoorStateResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "門進入 CloseDeferred 且保持可通行；整條蛇離開後才關閉。"

  - id: SCN-UPDATE-THIRD-LEVEL-DOOR-STATE-004
    title: "不是第三關 Playing"
    description: "停止門週期並保持門狀態不變。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-001
        - RBF-UPDATE-THIRD-LEVEL-DOOR-STATE-004
      domain_rules:
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-NOOP-001
        - DOM-UPDATE-THIRD-LEVEL-DOOR-STATE-INV-001
      technical_contracts:
        - UpdateThirdLevelDoorStateResult.IsSuccess
        - TECH-UPDATE-THIRD-LEVEL-DOOR-STATE-NOOP-001
    given:
      - fact: "Game 不在 Playing 或 Level 不是 3。"
    when:
      action: update_third_level_door_state
      input:
        type: UpdateThirdLevelDoorStateCommand
        fields: {}
    then:
      output:
        type: UpdateThirdLevelDoorStateResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

