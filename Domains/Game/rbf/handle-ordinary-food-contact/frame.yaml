bounded_context: snake-game
aggregate: game

use_case:
  name: handle-ordinary-food-contact
  requirement: "蛇頭接觸普通食物時，普通食物消失且蛇長增加 1 格。"
frame_type: RBF

world_facts:
  actor: system
  trigger: "snake head contacts active Ordinary FoodItem"
  required_condition: "game.phase == Playing 且接觸的是目前 active Ordinary FoodItem"
  required_behavior: "移除普通食物、蛇長增加 1，並發出食物已消耗與狀態需更新事實"
  execution_policy: once_per_condition_fact

frame_concerns:
  - concern_ref: RBF-CONCERN-001
    check_id: RBF-HANDLE-ORDINARY-FOOD-CONTACT-001
    description: "確保只有 snake head contacts active Ordinary FoodItem 的完整條件成立時才發動 handle-ordinary-food-contact。"

  - concern_ref: RBF-CONCERN-002
    check_id: RBF-HANDLE-ORDINARY-FOOD-CONTACT-002
    description: "確保同一條件事實最多執行一次，不因重複通知重複套用效果。"

  - concern_ref: RBF-CONCERN-003
    check_id: RBF-HANDLE-ORDINARY-FOOD-CONTACT-003
    description: "確保 移除普通食物、蛇長增加 1，並發出食物已消耗與狀態需更新事實 的所有必要動作完整完成。"

  - concern_ref: RBF-CONCERN-004
    check_id: RBF-HANDLE-ORDINARY-FOOD-CONTACT-004
    description: "確保完成或忽略後，Game、Food、Snake、Level 的不變式仍成立。"

