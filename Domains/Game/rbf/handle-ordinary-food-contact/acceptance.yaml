use_case: handle-ordinary-food-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-HANDLE-ORDINARY-FOOD-CONTACT-001
    title: "成功吃到普通食物"
    description: "該食物消失，蛇長精確增加 1，後續通關判定與補充流程各觸發一次。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-ORDINARY-FOOD-CONTACT-001
        - RBF-HANDLE-ORDINARY-FOOD-CONTACT-002
        - RBF-HANDLE-ORDINARY-FOOD-CONTACT-003
        - RBF-HANDLE-ORDINARY-FOOD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-ORDINARY-FOOD-CONTACT-PRE-001
        - DOM-HANDLE-ORDINARY-FOOD-CONTACT-POST-001
      technical_contracts:
        - HandleOrdinaryFoodContactResult.IsSuccess
        - TECH-HANDLE-ORDINARY-FOOD-CONTACT-STATE-001
    given:
      - fact: "Game 正在 Playing，蛇頭進入 active Ordinary FoodItem 格位。"
    when:
      action: handle_ordinary_food_contact
      input:
        type: HandleOrdinaryFoodContactCommand
        fields: {}
    then:
      output:
        type: HandleOrdinaryFoodContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "該食物消失，蛇長精確增加 1，後續通關判定與補充流程各觸發一次。"

  - id: SCN-HANDLE-ORDINARY-FOOD-CONTACT-002
    title: "不是蛇頭接觸或食物已失效"
    description: "正常忽略，不改變蛇長且不重複消耗食物。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-ORDINARY-FOOD-CONTACT-001
        - RBF-HANDLE-ORDINARY-FOOD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-ORDINARY-FOOD-CONTACT-NOOP-001
        - DOM-HANDLE-ORDINARY-FOOD-CONTACT-INV-001
      technical_contracts:
        - HandleOrdinaryFoodContactResult.IsSuccess
        - TECH-HANDLE-ORDINARY-FOOD-CONTACT-NOOP-001
    given:
      - fact: "接觸者不是蛇頭，或 FoodItem 已被消耗。"
    when:
      action: handle_ordinary_food_contact
      input:
        type: HandleOrdinaryFoodContactCommand
        fields: {}
    then:
      output:
        type: HandleOrdinaryFoodContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

