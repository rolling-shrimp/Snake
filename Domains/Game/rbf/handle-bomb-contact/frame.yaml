bounded_context: snake-game
aggregate: game

use_case:
  name: handle-bomb-contact
  requirement: "第三關蛇頭接觸炸彈時產生直接死亡事件。"
frame_type: RBF

world_facts:
  actor: system
  trigger: "snake head contacts active BombItem"
  required_condition: "game.phase == Playing、level.number == 3，且接觸 active BombItem"
  required_behavior: "移除炸彈並產生 BombCollision 死亡事實，等待 Shield 決定保命或 GameOver"
  execution_policy: once_per_condition_fact

frame_concerns:
  - concern_ref: RBF-CONCERN-001
    check_id: RBF-HANDLE-BOMB-CONTACT-001
    description: "確保只有 snake head contacts active BombItem 的完整條件成立時才發動 handle-bomb-contact。"

  - concern_ref: RBF-CONCERN-002
    check_id: RBF-HANDLE-BOMB-CONTACT-002
    description: "確保同一條件事實最多執行一次，不因重複通知重複套用效果。"

  - concern_ref: RBF-CONCERN-003
    check_id: RBF-HANDLE-BOMB-CONTACT-003
    description: "確保 移除炸彈並產生 BombCollision 死亡事實，等待 Shield 決定保命或 GameOver 的所有必要動作完整完成。"

  - concern_ref: RBF-CONCERN-004
    check_id: RBF-HANDLE-BOMB-CONTACT-004
    description: "確保完成或忽略後，Game、Bomb、Shield、GameResult 的不變式仍成立。"

