use_case: handle-self-collision
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: HandleSelfCollisionCommand
  source: "系統條件監測：next snake head cell overlaps existing body"
  fields:
    - name: CollisionPosition
      csharp_type: GridPositionDTO
      required: true

output:
  type: HandleSelfCollisionResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "產生一次 SelfCollision，等待 Shield 決定保命或 GameOver"

types:
  - name: HandleSelfCollisionCommand
    fields:
      - name: CollisionPosition
        csharp_type: GridPositionDTO
        required: true
  - name: HandleSelfCollisionResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-HANDLE-SELF-COLLISION-IN-001, DOM-HANDLE-SELF-COLLISION-PRE-001]
    target: HandleSelfCollisionCommand
    description: "條件事實映射為一次可去重的自動命令。"
  - domain_rules: [DOM-HANDLE-SELF-COLLISION-INV-001, DOM-HANDLE-SELF-COLLISION-POST-001]
    target: HandleSelfCollisionResult
    description: "產生一次 SelfCollision，等待 Shield 決定保命或 GameOver"

state_mappings:
  - mapping_id: TECH-HANDLE-SELF-COLLISION-STATE-001
    description: "產生一次 SelfCollision，等待 Shield 決定保命或 GameOver"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-HANDLE-SELF-COLLISION-NOOP-001
    condition: "蛇頭下一格不是既有蛇身格位。"
    behavior: "正常忽略，不產生死亡事件。"

