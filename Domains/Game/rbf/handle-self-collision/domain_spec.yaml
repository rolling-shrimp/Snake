use_case: handle-self-collision
bounded_context: snake-game
aggregate: game
frame_type: RBF

domain_refs:
  - domain: Game
    path: ../../domain_spec.yaml
    aggregate: Game
  - domain: Snake
    path: ../../../Snake/domain_spec.yaml
    aggregate: Snake
  - domain: Shield
    path: ../../../Shield/domain_spec.yaml
    aggregate: Shield
  - domain: GameResult
    path: ../../../GameResult/domain_spec.yaml
    aggregate: GameResult

traceability:
  requirement: "frame.yaml#use_case.requirement"
  frame_checks:
    - RBF-HANDLE-SELF-COLLISION-001
    - RBF-HANDLE-SELF-COLLISION-002
    - RBF-HANDLE-SELF-COLLISION-003
    - RBF-HANDLE-SELF-COLLISION-004

contract:
  input:
    data: HandleSelfCollisionCommand
    fields:
      - name: CollisionPosition
        type: GridPositionDTO
        required: true
    rules:
      - rule_id: DOM-HANDLE-SELF-COLLISION-IN-001
        description: "Input 表示一次已觀察到的條件事實：next snake head cell overlaps existing body。"
        domain_rule_refs:
          - SNAKE-MOVE-004
          - GAME-REL-005
          - SHIELD-RESCUE-001
          - RESULT-RECORD-003

  output:
    data: HandleSelfCollisionResult
    rules:
      - rule_id: DOM-HANDLE-SELF-COLLISION-OUT-001
        description: "Output 表示必要行為是否完成；不適用條件以成功 no-op 表示。"
        domain_rule_refs: []

  preconditions:
    - rule_id: DOM-HANDLE-SELF-COLLISION-PRE-001
      description: "game.phase == Playing 且碰撞事實來自本次有效移動"
      domain_rule_refs:
        - SNAKE-MOVE-004
        - GAME-REL-005
        - SHIELD-RESCUE-001
        - RESULT-RECORD-003

  invariants:
    - rule_id: DOM-HANDLE-SELF-COLLISION-INV-001
      description: "同一條件事實最多處理一次；產生一次 SelfCollision，等待 Shield 決定保命或 GameOver。"
      domain_rule_refs:
        - SNAKE-MOVE-004
        - GAME-REL-005
        - SHIELD-RESCUE-001
        - RESULT-RECORD-003

  process:
    - order: 1
      action: "確認觸發事實與 game.phase == Playing 且碰撞事實來自本次有效移動。"
    - order: 2
      action: "產生一次 SelfCollision，等待 Shield 決定保命或 GameOver"
    - order: 3
      action: "發布後續流程需要的結果事實，但不越權執行其他 Use Case。"

  postconditions:
    - rule_id: DOM-HANDLE-SELF-COLLISION-POST-001
      description: "產生一次 SelfCollision，等待 Shield 決定保命或 GameOver"
      domain_rule_refs:
        - SNAKE-MOVE-004
        - GAME-REL-005
        - SHIELD-RESCUE-001
        - RESULT-RECORD-003

  contract_violations: []

  not_applicable:
    - rule_id: DOM-HANDLE-SELF-COLLISION-NOOP-001
      condition: "蛇頭下一格不是既有蛇身格位。"
      behavior: ignore
      error: none
      state_guarantee: "正常忽略，不產生死亡事件。"
      domain_rule_refs:
        - SNAKE-MOVE-004
        - GAME-REL-005
        - SHIELD-RESCUE-001
        - RESULT-RECORD-003

