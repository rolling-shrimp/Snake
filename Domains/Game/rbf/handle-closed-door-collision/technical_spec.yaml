use_case: handle-closed-door-collision
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: HandleClosedDoorCollisionCommand
  source: "系統條件監測：next snake head cell is a Closed door cell"
  fields:
    - name: DoorId
      csharp_type: string
      required: true

output:
  type: HandleClosedDoorCollisionResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "不提交蛇身位置並產生一次 ClosedDoorCollision，等待 Shield 決策"

types:
  - name: HandleClosedDoorCollisionCommand
    fields:
      - name: DoorId
        csharp_type: string
        required: true
  - name: HandleClosedDoorCollisionResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-HANDLE-CLOSED-DOOR-COLLISION-IN-001, DOM-HANDLE-CLOSED-DOOR-COLLISION-PRE-001]
    target: HandleClosedDoorCollisionCommand
    description: "條件事實映射為一次可去重的自動命令。"
  - domain_rules: [DOM-HANDLE-CLOSED-DOOR-COLLISION-INV-001, DOM-HANDLE-CLOSED-DOOR-COLLISION-POST-001]
    target: HandleClosedDoorCollisionResult
    description: "不提交蛇身位置並產生一次 ClosedDoorCollision，等待 Shield 決策"

state_mappings:
  - mapping_id: TECH-HANDLE-CLOSED-DOOR-COLLISION-STATE-001
    description: "不提交蛇身位置並產生一次 ClosedDoorCollision，等待 Shield 決策"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-HANDLE-CLOSED-DOOR-COLLISION-NOOP-001
    condition: "門為 Open、ClosingWarning 或 CloseDeferred。"
    behavior: "允許移動通過，不產生 ClosedDoorCollision。"

