use_case: evaluate-level-completion
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-EVALUATE-LEVEL-COMPLETION-001
    title: "第一或第二關達到 20"
    description: "立即產生一次 LevelPassed，保留實際通關蛇長 20。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-EVALUATE-LEVEL-COMPLETION-001
        - RBF-EVALUATE-LEVEL-COMPLETION-002
        - RBF-EVALUATE-LEVEL-COMPLETION-003
        - RBF-EVALUATE-LEVEL-COMPLETION-004
      domain_rules:
        - DOM-EVALUATE-LEVEL-COMPLETION-PRE-001
        - DOM-EVALUATE-LEVEL-COMPLETION-POST-001
      technical_contracts:
        - EvaluateLevelCompletionResult.IsSuccess
        - TECH-EVALUATE-LEVEL-COMPLETION-STATE-001
    given:
      - fact: "第一或第二關 Playing，蛇長由 19 增加為 20。"
    when:
      action: evaluate_level_completion
      input:
        type: EvaluateLevelCompletionCommand
        fields: {}
    then:
      output:
        type: EvaluateLevelCompletionResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "立即產生一次 LevelPassed，保留實際通關蛇長 20。"

  - id: SCN-EVALUATE-LEVEL-COMPLETION-002
    title: "第三關超過 50"
    description: "立即產生一次 LevelPassed，實際蛇長保持 51。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-EVALUATE-LEVEL-COMPLETION-001
        - RBF-EVALUATE-LEVEL-COMPLETION-002
        - RBF-EVALUATE-LEVEL-COMPLETION-003
        - RBF-EVALUATE-LEVEL-COMPLETION-004
      domain_rules:
        - DOM-EVALUATE-LEVEL-COMPLETION-PRE-001
        - DOM-EVALUATE-LEVEL-COMPLETION-POST-001
      technical_contracts:
        - EvaluateLevelCompletionResult.IsSuccess
        - TECH-EVALUATE-LEVEL-COMPLETION-STATE-001
    given:
      - fact: "第三關 Playing，蛇長由 49 增加為 51。"
    when:
      action: evaluate_level_completion
      input:
        type: EvaluateLevelCompletionCommand
        fields: {}
    then:
      output:
        type: EvaluateLevelCompletionResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "立即產生一次 LevelPassed，實際蛇長保持 51。"

  - id: SCN-EVALUATE-LEVEL-COMPLETION-003
    title: "尚未達標"
    description: "正常完成判定並保持 Playing，不產生 LevelPassed。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-EVALUATE-LEVEL-COMPLETION-001
        - RBF-EVALUATE-LEVEL-COMPLETION-004
      domain_rules:
        - DOM-EVALUATE-LEVEL-COMPLETION-NOOP-001
        - DOM-EVALUATE-LEVEL-COMPLETION-INV-001
      technical_contracts:
        - EvaluateLevelCompletionResult.IsSuccess
        - TECH-EVALUATE-LEVEL-COMPLETION-NOOP-001
    given:
      - fact: "第一或第二關蛇長小於 20，或第三關蛇長小於 50。"
    when:
      action: evaluate_level_completion
      input:
        type: EvaluateLevelCompletionCommand
        fields: {}
    then:
      output:
        type: EvaluateLevelCompletionResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

