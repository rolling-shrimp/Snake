bounded_context: snake-game
aggregate: game

use_case:
  name: advance-snake-step
  requirement: "遊戲每滿 250 毫秒要求蛇依目前方向前進一格。"
frame_type: RBF

world_facts:
  actor: system
  trigger: "movement interval reaches 250 milliseconds"
  required_condition: "game.phase == Playing 且 movement_active == true"
  required_behavior: "每個有效 interval 只前進一格，套用目前關卡邊界政策並產生接觸或碰撞事實"
  execution_policy: once_per_condition_fact

frame_concerns:
  - concern_ref: RBF-CONCERN-001
    check_id: RBF-ADVANCE-SNAKE-STEP-001
    description: "確保只有 movement interval reaches 250 milliseconds 的完整條件成立時才發動 advance-snake-step。"

  - concern_ref: RBF-CONCERN-002
    check_id: RBF-ADVANCE-SNAKE-STEP-002
    description: "確保同一條件事實最多執行一次，不因重複通知重複套用效果。"

  - concern_ref: RBF-CONCERN-003
    check_id: RBF-ADVANCE-SNAKE-STEP-003
    description: "確保 每個有效 interval 只前進一格，套用目前關卡邊界政策並產生接觸或碰撞事實 的所有必要動作完整完成。"

  - concern_ref: RBF-CONCERN-004
    check_id: RBF-ADVANCE-SNAKE-STEP-004
    description: "確保完成或忽略後，Game、Level、Snake、Board 的不變式仍成立。"

