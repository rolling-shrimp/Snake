use_case: handle-special-food-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-HANDLE-SPECIAL-FOOD-CONTACT-001
    title: "成功吃到特殊食物"
    description: "食物消失且蛇長精確增加 2；增加後才進行通關判定。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-001
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-002
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-003
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-SPECIAL-FOOD-CONTACT-PRE-001
        - DOM-HANDLE-SPECIAL-FOOD-CONTACT-POST-001
      technical_contracts:
        - HandleSpecialFoodContactResult.IsSuccess
        - TECH-HANDLE-SPECIAL-FOOD-CONTACT-STATE-001
    given:
      - fact: "第二或第三關 Playing，蛇頭進入 active Special FoodItem 格位。"
    when:
      action: handle_special_food_contact
      input:
        type: HandleSpecialFoodContactCommand
        fields: {}
    then:
      output:
        type: HandleSpecialFoodContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "食物消失且蛇長精確增加 2；增加後才進行通關判定。"

  - id: SCN-HANDLE-SPECIAL-FOOD-CONTACT-002
    title: "49 格跨越第三關目標"
    description: "實際蛇長成為 51，通關判定使用 51，不截斷為 50。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-001
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-002
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-003
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-SPECIAL-FOOD-CONTACT-PRE-001
        - DOM-HANDLE-SPECIAL-FOOD-CONTACT-POST-001
      technical_contracts:
        - HandleSpecialFoodContactResult.IsSuccess
        - TECH-HANDLE-SPECIAL-FOOD-CONTACT-STATE-001
    given:
      - fact: "第三關蛇長為 49，蛇頭吃到特殊食物。"
    when:
      action: handle_special_food_contact
      input:
        type: HandleSpecialFoodContactCommand
        fields: {}
    then:
      output:
        type: HandleSpecialFoodContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_effect: "實際蛇長成為 51，通關判定使用 51，不截斷為 50。"

  - id: SCN-HANDLE-SPECIAL-FOOD-CONTACT-003
    title: "第一關或非 active 特殊食物"
    description: "正常忽略，不改變蛇長或物件。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-001
        - RBF-HANDLE-SPECIAL-FOOD-CONTACT-004
      domain_rules:
        - DOM-HANDLE-SPECIAL-FOOD-CONTACT-NOOP-001
        - DOM-HANDLE-SPECIAL-FOOD-CONTACT-INV-001
      technical_contracts:
        - HandleSpecialFoodContactResult.IsSuccess
        - TECH-HANDLE-SPECIAL-FOOD-CONTACT-NOOP-001
    given:
      - fact: "第一關，或接觸的 Special FoodItem 已失效。"
    when:
      action: handle_special_food_contact
      input:
        type: HandleSpecialFoodContactCommand
        fields: {}
    then:
      output:
        type: HandleSpecialFoodContactResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
      domain_state:
        unchanged: true

