use_case: handle-special-food-contact
bounded_context: snake-game
aggregate: game
frame_type: RBF

spec_refs:
  domain: domain_spec.yaml

input:
  type: HandleSpecialFoodContactCommand
  source: "系統條件監測：snake head contacts active Special FoodItem"
  fields:
    - name: FoodItemId
      csharp_type: string
      required: true

output:
  type: HandleSpecialFoodContactResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
  domain_output: "移除特殊食物、蛇長增加 2，並保留超過目標的實際蛇長"

types:
  - name: HandleSpecialFoodContactCommand
    fields:
      - name: FoodItemId
        csharp_type: string
        required: true
  - name: HandleSpecialFoodContactResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"

domain_to_technical_mapping:
  - domain_rules: [DOM-HANDLE-SPECIAL-FOOD-CONTACT-IN-001, DOM-HANDLE-SPECIAL-FOOD-CONTACT-PRE-001]
    target: HandleSpecialFoodContactCommand
    description: "條件事實映射為一次可去重的自動命令。"
  - domain_rules: [DOM-HANDLE-SPECIAL-FOOD-CONTACT-INV-001, DOM-HANDLE-SPECIAL-FOOD-CONTACT-POST-001]
    target: HandleSpecialFoodContactResult
    description: "移除特殊食物、蛇長增加 2，並保留超過目標的實際蛇長"

state_mappings:
  - mapping_id: TECH-HANDLE-SPECIAL-FOOD-CONTACT-STATE-001
    description: "移除特殊食物、蛇長增加 2，並保留超過目標的實際蛇長"

error_mappings: []

no_op_mappings:
  - mapping_id: TECH-HANDLE-SPECIAL-FOOD-CONTACT-NOOP-001
    condition: "第一關，或接觸的 Special FoodItem 已失效。"
    behavior: "正常忽略，不改變蛇長或物件。"

