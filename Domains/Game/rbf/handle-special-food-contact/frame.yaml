bounded_context: snake-game
aggregate: game

use_case:
  name: handle-special-food-contact
  requirement: "第二、三關蛇頭接觸特殊食物時，特殊食物消失且蛇長增加 2 格。"
frame_type: RBF

world_facts:
  actor: system
  trigger: "snake head contacts active Special FoodItem"
  required_condition: "game.phase == Playing、level.number 為 2 或 3，且接觸 active Special FoodItem"
  required_behavior: "移除特殊食物、蛇長增加 2，並保留超過目標的實際蛇長"
  execution_policy: once_per_condition_fact

frame_concerns:
  - concern_ref: RBF-CONCERN-001
    check_id: RBF-HANDLE-SPECIAL-FOOD-CONTACT-001
    description: "確保只有 snake head contacts active Special FoodItem 的完整條件成立時才發動 handle-special-food-contact。"

  - concern_ref: RBF-CONCERN-002
    check_id: RBF-HANDLE-SPECIAL-FOOD-CONTACT-002
    description: "確保同一條件事實最多執行一次，不因重複通知重複套用效果。"

  - concern_ref: RBF-CONCERN-003
    check_id: RBF-HANDLE-SPECIAL-FOOD-CONTACT-003
    description: "確保 移除特殊食物、蛇長增加 2，並保留超過目標的實際蛇長 的所有必要動作完整完成。"

  - concern_ref: RBF-CONCERN-004
    check_id: RBF-HANDLE-SPECIAL-FOOD-CONTACT-004
    description: "確保完成或忽略後，Game、Food、Snake、Level 的不變式仍成立。"

