schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-RESTART
contract_ref: V3-WF-GAME-RESTART
scenarios:
  - id: V3-SCN-RESTART-FROM-GAME-OVER
    title: "失敗後重玩直接進入第一關 Playing"
    given:
      phase: GameOver
      prior_round_contains_results_objects_and_shield_state: true
    when:
      operation: RestartGame
    then:
      is_success: true
      outcome: Restarted
      level: 1
      phase: Playing
      snake_length: 3
      progress_percentage: 15
      object_counts: {OrdinaryFood: 1}
      other_object_count: 0
      result_history_count: 0
      remaining_shield_charges: 0
      screen_kind: FirstLevelPlaying
      runtime_directive: StartOrReset
    evidence: [behavioral, invariant]
  - id: V3-SCN-RESTART-FROM-COMPLETED
    title: "完成整輪後重玩得到相同的新第一關"
    given:
      phase: Completed
      three_level_results_exist: true
      third_level_maze_and_door_exist: true
    when:
      operation: RestartGame
    then:
      outcome: Restarted
      screen_kind: FirstLevelPlaying
      wall_count: 0
      door_count: 0
      result_history_count: 0
      runtime_directive: StartOrReset
    evidence: [behavioral, invariant]
  - id: V3-SCN-RESTART-NOT-TERMINAL
    title: "非終局重玩成功忽略"
    given:
      phase: Playing
      current_round_in_progress: true
    when:
      operation: RestartGame
    then:
      is_success: true
      outcome: NotTerminal
      domain_state_unchanged: true
      runtime_directive: Unchanged
      screen_matches_current_state: true
    evidence: [behavioral]
  - id: V3-SCN-RESTART-NO-SAFE-BODY
    title: "沒有安全蛇身時保留原終局快照"
    given:
      phase: GameOver
      safe_length_three_body_available: false
    when:
      operation: RestartGame
    then:
      is_success: false
      failure_code: SafeBodyUnavailable
      original_terminal_snapshot_unchanged: true
      runtime_directive: Unchanged
    evidence: [behavioral, invariant]
  - id: V3-SCN-RESTART-ATOMIC-ROLLBACK
    title: "任一重設或提交錯誤整批回滾"
    given:
      phase: Completed
      atomic_commit_succeeds: false
    when:
      operation: RestartGame
    then:
      is_success: false
      failure_code: AtomicCommitFailed
      no_partial_reset_visible: true
      original_terminal_snapshot_unchanged: true
    evidence: [behavioral]
  - id: V3-SCN-RESTART-ONE-SCREEN
    title: "重玩只輸出一次最終第一關畫面"
    given:
      valid_terminal_snapshot: true
    when:
      operation: RestartGame
    then:
      visible_commit_count: 1
      screen_output_count: 1
      ready_screen_visible: false
      screen_kind: FirstLevelPlaying
    evidence: [static, runtime_ui]
evidence_requirements:
  - type: behavioral
    required: true
    provider: checker_or_test_suite
    rule: "必須覆蓋兩種終局、非終局 no-op 與回滾。"
  - type: invariant
    required: true
    provider: aggregate_checker_or_test_suite
    rule: "必須證明新蛇身、物件位置與所有重設後 Aggregate invariant。"
  - type: static
    required: true
    provider: architecture_checker
    rule: "必須證明 UI 不自行串接 Reset、Spawn 或 Start 操作。"
  - type: runtime_ui
    required: true
    provider: ui_runtime_checker_or_manual_reviewer
    rule: "必須證明重玩不顯示 Ready 或部分重設畫面；產品尚未重構前可為 Audit pending。"
