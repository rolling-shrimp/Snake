schema_version: 3
spec_kind: problem_frame
id: V3-FRAME-GAME-RESTART
frame:
  bounded_context: snake-game
  frame_type: CBF
  requirement: "玩家在 GameOver 或完成整輪後按下重玩，遊戲直接重新開始第一關。"
problem_domains:
  - name: player
    role: command_source
  - name: terminal_game
    role: controlled_domain
  - name: new_game_round
    role: resulting_domain
  - name: game_runtime
    role: causal_domain
shared_phenomena:
  - name: press_restart
    direction: player_to_system
  - name: begin_new_round
    direction: system_to_game_runtime
  - name: observe_first_level_playing
    direction: system_to_player
world_facts:
  - id: V3-FRAME-RESTART-FACT-TERMINAL
    fact: "重玩只存在於 GameOver 與 GameCompleted 畫面。"
  - id: V3-FRAME-RESTART-FACT-FIRST-LEVEL
    fact: "新一輪從第一關、長度 3 的安全蛇身與 15% 進度開始。"
  - id: V3-FRAME-RESTART-FACT-CLEAR
    fact: "新一輪不保留前一輪的關卡結果、物件、護盾次數、護盾生成紀錄、牆、門或門事件。"
  - id: V3-FRAME-RESTART-FACT-DIRECT-PLAYING
    fact: "玩家按下重玩後不再顯示第一關 Ready；普通食物立即出現且蛇直接恢復自動移動。"
frame_concerns:
  - id: V3-FRAME-RESTART-CONCERN-ATOMIC
    concern: "清除舊輪次與建立新第一關必須形成一個完整結果，不得公開半重設狀態。"
  - id: V3-FRAME-RESTART-CONCERN-ONCE
    concern: "同一終局狀態只接受一次重玩效果，重複輸入不得再次清除或重設。"
  - id: V3-FRAME-RESTART-CONCERN-SAFE-BODY
    concern: "新蛇身必須位於安全起點且滿足順序、唯一與連續性。"
