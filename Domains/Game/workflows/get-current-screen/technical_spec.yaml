schema_version: 3
spec_kind: technical_contract
id: V3-TECH-GAME-GET-CURRENT-SCREEN
operation: GetCurrentScreen
workflow_ref: V3-WF-GAME-GET-CURRENT-SCREEN
input:
  model: GetCurrentScreenQuery
  fields: []
  grain: one_query_for_one_game_session
output:
  model: GetCurrentScreenResult
  fields:
    - name: IsSuccess
      type: bool
      required: true
    - name: Outcome
      type: GetCurrentScreenOutcome
      required: true
    - name: FailureCode
      type: string
      required: false
    - name: FailureMessage
      type: string
      required: false
    - name: Screen
      type: GameScreenOutput
      required: false
      rules:
        - "IsSuccess 為 true 時必須存在；失敗時不得回傳部分畫面。"
    - name: RuntimeDirective
      type: RuntimeDirective
      required: true
      fixed_value: Unchanged
  grain: one_complete_current_screen_result
types:
  - name: GetCurrentScreenOutcome
    kind: enum
    values: [ScreenReturned, Failed]
  - name: RuntimeDirective
    kind: enum
    values: [Unchanged, StartOrReset, Stop]
  - name: GridPositionDTO
    fields:
      - name: X
        type: int
        required: true
      - name: Y
        type: int
        required: true
  - name: BoardCellOutput
    fields:
      - name: Position
        type: GridPositionDTO
        required: true
      - name: Kind
        type: BoardCellKind
        required: true
  - name: BoardCellKind
    kind: enum
    values: [Empty, SnakeHead, SnakeBody, OrdinaryFood, SpecialFood, Shield, Fire, Bomb, Wall, Door]
  - name: BoardObjectOutput
    fields:
      - name: ObjectId
        type: string
        required: true
      - name: Kind
        type: BoardObjectKind
        required: true
      - name: Position
        type: GridPositionDTO
        required: true
  - name: BoardObjectKind
    kind: enum
    values: [OrdinaryFood, SpecialFood, Shield, Fire, Bomb]
  - name: DoorOutput
    fields:
      - name: DoorId
        type: string
        required: true
      - name: Position
        type: GridPositionDTO
        required: true
      - name: State
        type: DoorVisualState
        required: true
  - name: DoorVisualState
    kind: enum
    values: [Open, ClosingWarning, CloseDeferred, Closed]
  - name: LevelStatusOutput
    fields:
      - name: LevelNumber
        type: int
        required: true
      - name: CurrentLength
        type: int
        required: true
      - name: TargetLength
        type: int
        required: true
      - name: ProgressPercentage
        type: int
        required: true
      - name: RemainingShieldCharges
        type: int
        required: true
  - name: ResultCardOutput
    fields:
      - name: Outcome
        type: string
        required: true
      - name: LevelNumber
        type: int
        required: true
      - name: FinalLength
        type: int
        required: true
      - name: DeathCause
        type: string
        required: false
  - name: GameScreenOutput
    fields:
      - name: ScreenKind
        type: GameScreenKind
        required: true
      - name: BoardCells
        type: List<BoardCellOutput>
        required: true
      - name: SnakeBody
        type: List<GridPositionDTO>
        required: true
        ordering: head_to_tail
      - name: Objects
        type: List<BoardObjectOutput>
        required: true
      - name: WallCells
        type: List<GridPositionDTO>
        required: true
      - name: Doors
        type: List<DoorOutput>
        required: true
      - name: LevelStatus
        type: LevelStatusOutput
        required: true
      - name: RuleHints
        type: List<string>
        required: true
      - name: ResultCard
        type: ResultCardOutput
        required: false
      - name: AvailableActions
        type: List<GameAction>
        required: true
  - name: GameScreenKind
    kind: enum
    values:
      - FirstLevelReady
      - FirstLevelPlaying
      - SecondLevelReady
      - SecondLevelPlaying
      - ThirdLevelReady
      - ThirdLevelPlaying
      - GameOver
      - GameCompleted
  - name: GameAction
    kind: enum
    values: [Start, ChangeDirection, Restart]
ports:
  - role: game_snapshot_reader
    responsibility: "唯讀載入同一版本的完整已提交遊戲快照；不得回傳跨版本 Aggregate。"
    operations: [load_current_snapshot]
  - role: game_screen_output_factory
    responsibility: "從一份已提交快照建立完整且不可變的 GameScreenOutput，不回傳 Entity。"
    operations: [create_complete_screen]
error_mappings:
  - failure_code: InconsistentSnapshot
    is_success: false
    outcome: Failed
    runtime_directive: Unchanged
  - failure_code: UnsupportedScreenState
    is_success: false
    outcome: Failed
    runtime_directive: Unchanged
domain_mappings:
  - domain_refs: [V3-GAME-INV-PHASE, V3-LEVEL-INV-NUMBER]
    target: GameScreenOutput.ScreenKind
  - domain_refs: [V3-SNAKE-INV-BODY-ORDER, V3-SNAKE-INV-BODY-UNIQUE, V3-SNAKE-INV-BODY-CONTIGUOUS]
    target: GameScreenOutput.SnakeBody
  - domain_refs: [V3-BOARD-INV-NO-OVERLAP]
    target: GameScreenOutput.BoardCells
  - domain_refs: [V3-LEVEL-BEHAVIOR-CALCULATE-PROGRESS]
    target: GameScreenOutput.LevelStatus
implementation_binding:
  owner_role: application_workflow
  logical_operation: GetCurrentScreen
  class_count_constraint: none
  method_name_constraint: none
  ui_boundary: "UI 取得 Result 後只套用 RuntimeDirective.Unchanged，並將 Screen 交給 RenderGameScreen。"
