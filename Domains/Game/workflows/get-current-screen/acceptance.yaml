schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-GET-CURRENT-SCREEN
contract_ref: V3-WF-GAME-GET-CURRENT-SCREEN
scenarios:
  - id: V3-SCN-SCREEN-FIRST-READY
    title: "第一關 Ready 回傳完整待開始畫面"
    given:
      phase: Ready
      level: 1
      snake_length: 3
    when:
      operation: GetCurrentScreen
    then:
      is_success: true
      screen_kind: FirstLevelReady
      available_actions: [Start]
      runtime_directive: Unchanged
    evidence: [behavioral]
  - id: V3-SCN-SCREEN-SECOND-READY
    title: "第二關 Ready 保留第一關成績卡"
    given:
      phase: Ready
      level: 2
      first_level_result_exists: true
    when:
      operation: GetCurrentScreen
    then:
      screen_kind: SecondLevelReady
      result_card_level: 1
      available_actions: [Start]
    evidence: [behavioral]
  - id: V3-SCN-SCREEN-THIRD-READY
    title: "第三關 Ready 包含迷宮與門狀態"
    given:
      phase: Ready
      level: 3
      second_level_result_exists: true
    when:
      operation: GetCurrentScreen
    then:
      screen_kind: ThirdLevelReady
      wall_cells_included: true
      door_states_included: true
      available_actions: [Start]
    evidence: [behavioral]
  - id: V3-SCN-SCREEN-PLAYING-BY-LEVEL
    title: "Playing 依目前關卡選擇唯一畫面"
    given:
      phase: Playing
      levels: [1, 2, 3]
    when:
      operation: GetCurrentScreen
    then:
      screen_kinds: [FirstLevelPlaying, SecondLevelPlaying, ThirdLevelPlaying]
      complete_board_for_each_level: true
      available_actions: [ChangeDirection]
    evidence: [behavioral]
  - id: V3-SCN-SCREEN-GAME-OVER
    title: "GameOver 回傳失敗結果畫面"
    given:
      phase: GameOver
      failed_level_result_exists: true
    when:
      operation: GetCurrentScreen
    then:
      screen_kind: GameOver
      result_card_included: true
      available_actions: [Restart]
    evidence: [behavioral]
  - id: V3-SCN-SCREEN-COMPLETED
    title: "Completed 回傳整輪完成畫面"
    given:
      phase: Completed
      third_level_result_exists: true
    when:
      operation: GetCurrentScreen
    then:
      screen_kind: GameCompleted
      final_board_included: true
      result_card_included: true
      available_actions: [Restart]
    evidence: [behavioral]
  - id: V3-SCN-SCREEN-READ-ONLY
    title: "重複查詢不改變任何 Domain 狀態"
    given:
      any_valid_committed_snapshot: true
    when:
      operation_called_twice: GetCurrentScreen
    then:
      domain_state_unchanged: true
      snapshot_version_unchanged: true
      screens_equal: true
      runtime_directive: Unchanged
    evidence: [behavioral, invariant]
  - id: V3-SCN-SCREEN-INCONSISTENT-SNAPSHOT
    title: "跨版本快照不得產生部分畫面"
    given:
      consistent_snapshot_available: false
    when:
      operation: GetCurrentScreen
    then:
      is_success: false
      failure_code: InconsistentSnapshot
      screen_returned: false
      domain_state_unchanged: true
    evidence: [behavioral, static]
evidence_requirements:
  - type: behavioral
    required: true
    provider: checker_or_test_suite
    rule: "同一 checker 可以用參數化輸入覆蓋多種 GameScreenKind。"
  - type: invariant
    required: true
    provider: snapshot_or_aggregate_checker
    rule: "必須證明查詢前後 Aggregate 狀態與版本不變。"
  - type: static
    required: true
    provider: architecture_checker
    rule: "必須證明 GetCurrentScreen 不依賴狀態寫入 Port。"
