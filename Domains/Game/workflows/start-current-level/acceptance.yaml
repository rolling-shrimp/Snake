schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-START-CURRENT-LEVEL
contract_ref: V3-WF-GAME-START-CURRENT-LEVEL
scenarios:
  - id: V3-SCN-START-FIRST-LEVEL
    title: "第一關一次開始即產生普通食物並進入 Playing"
    given:
      phase: Ready
      level: 1
      snake_length: 3
      active_objects: []
      legal_spawn_cells_available: true
    when:
      operation: StartCurrentLevel
    then:
      is_success: true
      outcome: Started
      phase: Playing
      screen_kind: FirstLevelPlaying
      object_counts: {OrdinaryFood: 1}
      snake_length: 3
      runtime_directive: StartOrReset
    evidence: [behavioral, invariant]
  - id: V3-SCN-START-SECOND-LEVEL
    title: "第二關一次開始即產生四種首批物件"
    given:
      phase: Ready
      level: 2
      snake_length: 3
      remaining_shield_charges: 0
      active_objects: []
    when:
      operation: StartCurrentLevel
    then:
      phase: Playing
      screen_kind: SecondLevelPlaying
      object_counts: {OrdinaryFood: 1, SpecialFood: 1, Shield: 1, Fire: 1}
      all_object_positions_legal_unique_and_unoccupied: true
      prior_result_card_visible: false
      runtime_directive: StartOrReset
    evidence: [behavioral, invariant]
  - id: V3-SCN-START-THIRD-LEVEL
    title: "第三關一次開始即產生五種物件並啟動門時間基準"
    given:
      phase: Ready
      level: 3
      snake_length: 3
      maze_and_doors_prepared: true
      active_objects: []
    when:
      operation: StartCurrentLevel
    then:
      phase: Playing
      screen_kind: ThirdLevelPlaying
      object_counts: {OrdinaryFood: 1, SpecialFood: 1, Shield: 1, Fire: 1, Bomb: 1}
      door_warning_due_milliseconds: 4000
      door_toggle_due_milliseconds: 6000
      runtime_directive: StartOrReset
    evidence: [behavioral, temporal, invariant]
  - id: V3-SCN-START-NOT-READY-NOOP
    title: "非 Ready 或重複開始成功忽略"
    given:
      phase: Playing
      existing_objects_and_elapsed_time: true
    when:
      operation: StartCurrentLevel
    then:
      is_success: true
      outcome: NotReady
      domain_state_unchanged: true
      objects_respawned: false
      elapsed_time_reset: false
      runtime_directive: Unchanged
      screen_matches_current_state: true
    evidence: [behavioral, temporal]
  - id: V3-SCN-START-SPAWN-ROLLBACK
    title: "任一首批物件無合法位置時整次開始回滾"
    given:
      phase: Ready
      level: 3
      one_required_object_has_no_legal_position: true
    when:
      operation: StartCurrentLevel
    then:
      is_success: false
      failure_code: InitialSpawnUnavailable
      phase: Ready
      active_objects: []
      elapsed_time_unchanged: true
      runtime_directive: Unchanged
    evidence: [behavioral, invariant]
  - id: V3-SCN-START-ATOMIC-COMMIT
    title: "提交失敗不得留下部分 Playing 狀態"
    given:
      phase: Ready
      all_initial_objects_planned: true
      atomic_commit_succeeds: false
    when:
      operation: StartCurrentLevel
    then:
      is_success: false
      failure_code: AtomicCommitFailed
      entire_operation_rolled_back: true
      runtime_directive: Unchanged
    evidence: [behavioral]
  - id: V3-SCN-START-ONE-FINAL-SCREEN
    title: "開始操作只輸出一次最終 Playing 畫面"
    given:
      any_valid_ready_level: true
    when:
      operation: StartCurrentLevel
    then:
      visible_commit_count: 1
      screen_output_count: 1
      intermediate_ready_or_partial_playing_visible: false
    evidence: [static, runtime_ui]
evidence_requirements:
  - type: behavioral
    required: true
    provider: checker_or_test_suite
    rule: "一個 checker 可覆蓋三關開始與失敗分支，不要求 scenario 對應單一測試。"
  - type: invariant
    required: true
    provider: aggregate_checker_or_test_suite
    rule: "必須證明首批物件位置與 Snake、Board、DoorAndMaze invariant 同時成立。"
  - type: temporal
    required: true
    provider: deterministic_clock_checker_or_test_suite
    rule: "必須證明 Runtime 與第三關門事件都以本次成功開始的 0 毫秒為基準。"
  - type: static
    required: true
    provider: architecture_checker
    rule: "必須證明 UI 只呼叫一個完整 StartCurrentLevel operation。"
  - type: runtime_ui
    required: true
    provider: ui_runtime_checker_or_manual_reviewer
    rule: "必須證明開始過程沒有呈現部分物件或半完成布局；產品尚未重構前可為 Audit pending。"
