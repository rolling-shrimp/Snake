schema_version: 3
spec_kind: workflow_contract
id: V3-WF-GAME-SET-SNAKE-DIRECTION
workflow: SetSnakeDirection
frame_ref: V3-FRAME-GAME-SET-SNAKE-DIRECTION
input:
  grain: one_direction_command
  owner: presentation_direction_input_workflow
  rules:
    - "Command.Direction 必須是 Up、Down、Left、Right 之一。"
    - "原始 KeyData、焦點與 WinForms 訊息路由不進入 Application Workflow。"
output:
  grain: one_complete_direction_result_with_current_screen
  owner: application_workflow
  guarantees:
    - "每次回傳唯一完整 Screen 與 RuntimeDirective.Unchanged。"
    - "本操作不執行 Snake movement。"
domain_refs:
  - V3-AGG-GAME-GAME
  - V3-AGG-SNAKE-SNAKE
preconditions:
  - id: V3-WF-DIRECTION-PRE-CONSISTENT-SNAPSHOT
    rule: "Game 與 Snake 必須來自同一個已提交版本。"
decisions:
  - id: V3-WF-DIRECTION-DECISION-NOT-PLAYING
    rule: "Game 非 Playing 時成功忽略且不改變 Snake。"
  - id: V3-WF-DIRECTION-DECISION-OPPOSITE
    rule: "要求方向與 Snake 目前有效移動方向直接相反時成功忽略。"
  - id: V3-WF-DIRECTION-DECISION-ACCEPT
    rule: "其他有效 Direction 由 Snake.QueueDirection 接受或依其 invariant 忽略。"
steps:
  - order: 1
    id: V3-WF-DIRECTION-STEP-LOAD
    action: "載入同一版本的 Game 與 Snake。"
  - order: 2
    id: V3-WF-DIRECTION-STEP-CHECK-PHASE
    action: "確認 Game 是否為 Playing；非 Playing 直接回傳成功 no-op。"
  - order: 3
    id: V3-WF-DIRECTION-STEP-QUEUE
    action: "將一個 Direction 交由 Snake.QueueDirection 驗證並取得 Accepted 或 OppositeDirectionIgnored。"
  - order: 4
    id: V3-WF-DIRECTION-STEP-COMMIT
    action: "只有 Accepted 才原子提交 queued_direction；不得修改 body_cells、長度或時間。"
  - order: 5
    id: V3-WF-DIRECTION-STEP-PRESENT
    action: "從最終已提交或未變更快照建立一個完整 GameScreenOutput。"
branches:
  - id: V3-WF-DIRECTION-BRANCH-ACCEPTED
    when: "Playing 且方向未違反 Snake invariant。"
    result: "queued_direction 更新，Outcome 為 Accepted。"
  - id: V3-WF-DIRECTION-BRANCH-IGNORED
    when: "非 Playing 或直接反向。"
    result: "Domain 狀態不變，Outcome 分別為 NotPlaying 或 OppositeDirection。"
commit_policy:
  unit: one_queued_direction_update
  atomicity: compare_and_swap_snake_version
  visibility: one_result_then_one_screen
postconditions:
  - id: V3-WF-DIRECTION-POST-BODY
    rule: "Snake.body_cells、蛇長、Game 時間與所有其他 Aggregate 狀態不變。"
  - id: V3-WF-DIRECTION-POST-RUNTIME
    rule: "RuntimeDirective 永遠為 Unchanged。"
failures:
  - code: InconsistentSnapshot
    condition: "Game 與 Snake 無法載入同一版本。"
    state_guarantee: no_state_changed
  - code: DirectionCommitConflict
    condition: "Snake 版本在提交 queued_direction 前已改變。"
    state_guarantee: no_direction_change_committed
no_op:
  - outcome: NotPlaying
    state_guarantee: "方向、蛇身與所有 Domain 狀態不變。"
  - outcome: OppositeDirection
    state_guarantee: "queued_direction 與目前有效移動方向保持原值。"
