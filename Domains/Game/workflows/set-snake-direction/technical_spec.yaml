schema_version: 3
spec_kind: technical_contract
id: V3-TECH-GAME-SET-SNAKE-DIRECTION
operation: SetSnakeDirection
workflow_ref: V3-WF-GAME-SET-SNAKE-DIRECTION
technical_ref: V3-TECH-GAME-GET-CURRENT-SCREEN
input:
  model: SetSnakeDirectionCommand
  fields:
    - name: Direction
      type: Direction
      required: true
      constraints: [Up, Down, Left, Right]
  grain: one_direction_command
output:
  model: SetSnakeDirectionResult
  fields:
    - name: IsSuccess
      type: bool
      required: true
    - name: Outcome
      type: SetSnakeDirectionOutcome
      required: true
    - name: FailureCode
      type: string
      required: false
    - name: FailureMessage
      type: string
      required: false
    - name: Screen
      type: GameScreenOutput
      required: false
      type_contract: V3-TECH-GAME-GET-CURRENT-SCREEN
    - name: RuntimeDirective
      type: RuntimeDirective
      required: true
      type_contract: V3-TECH-GAME-GET-CURRENT-SCREEN
      fixed_value: Unchanged
  grain: one_complete_direction_result
types:
  - name: Direction
    kind: enum
    values: [Up, Down, Left, Right]
  - name: SetSnakeDirectionOutcome
    kind: enum
    values: [Accepted, NotPlaying, OppositeDirection, Failed]
ports:
  - role: game_snapshot_store
    responsibility: "載入一致的 Game／Snake，並只在接受時以版本檢查提交 queued direction。"
    operations: [load_current_snapshot, commit_queued_direction]
  - role: game_screen_output_factory
    responsibility: "從最終快照建立共用契約定義的完整 GameScreenOutput。"
error_mappings:
  - failure_code: InconsistentSnapshot
    is_success: false
    outcome: Failed
    runtime_directive: Unchanged
  - failure_code: DirectionCommitConflict
    is_success: false
    outcome: Failed
    runtime_directive: Unchanged
domain_mappings:
  - domain_refs: [V3-SNAKE-BEHAVIOR-QUEUE-DIRECTION, V3-SNAKE-INV-DIRECTION]
    target: SetSnakeDirectionCommand.Direction
implementation_binding:
  owner_role: application_workflow
  logical_operation: SetSnakeDirection
  class_count_constraint: none
  method_name_constraint: none
  ui_boundary: "Presentation Direction Input Workflow 提供已驗證的 Direction Command；原始 KeyData 不得進入此 operation。"
