schema_version: 3
spec_kind: problem_frame
id: V3-FRAME-GAME-SET-SNAKE-DIRECTION
frame:
  bounded_context: snake-game
  frame_type: SWF
  requirement: "玩家在遊玩中使用方向鍵要求蛇改變下一次移動方向。"
problem_domains:
  - name: player
    role: input_source
  - name: winforms_message_router
    role: lexical_input_domain
  - name: direction_input_adapter
    role: designed_domain
  - name: snake
    role: controlled_domain
shared_phenomena:
  - name: press_declared_direction_key
    direction: player_to_system
  - name: deliver_command_key_message
    direction: system_to_adapter
  - name: request_direction_change
    direction: adapter_to_application
  - name: queue_next_direction
    direction: application_to_snake
world_facts:
  - id: V3-FRAME-DIRECTION-FACT-KEYS
    fact: "鍵盤的 Up、Down、Left、Right 方向鍵分別表示四個正交方向。"
  - id: V3-FRAME-DIRECTION-FACT-ROUTING
    fact: "WinForms 會在一般 KeyDown 前處理命令鍵與控制項導覽鍵；方向鍵可能在該階段被消耗。"
  - id: V3-FRAME-DIRECTION-FACT-TIMING
    fact: "方向輸入只影響下一個蛇移動事件；按鍵本身不移動蛇。"
  - id: V3-FRAME-DIRECTION-FACT-REVERSAL
    fact: "蛇不能在下一次移動中直接反轉到相反方向。"
frame_concerns:
  - id: V3-FRAME-DIRECTION-CONCERN-MAPPING
    concern: "只有四個方向鍵能被映射成 Direction Command。"
  - id: V3-FRAME-DIRECTION-CONCERN-DELIVERY
    concern: "四個方向鍵必須在控制項導覽前交給 input adapter，且不受焦點控制項影響。"
  - id: V3-FRAME-DIRECTION-CONCERN-EXACTLY-ONCE
    concern: "一個方向鍵訊息只能建立一個 DirectionRequested。"
  - id: V3-FRAME-DIRECTION-CONCERN-NO-MOVEMENT
    concern: "方向輸入不得改變目前蛇身位置、長度或遊戲時間。"
  - id: V3-FRAME-DIRECTION-CONCERN-PLAYING
    concern: "非 Playing 或直接反向的要求不得改變下一方向。"
