schema_version: 3
spec_kind: workflow_contract
id: V3-WF-GAME-PROCESS-TICK
workflow: ProcessGameTick
frame_ref: V3-FRAME-GAME-PROCESS-TICK
input:
  grain: one_accumulated_elapsed_milliseconds_observation
  owner: runtime_event_adapter
  rules:
    - "輸入代表目前關卡開始後的累積毫秒。"
    - "一次輸入只對應一次完整 ProcessGameTick Workflow。"
output:
  grain: one_complete_tick_result_with_one_final_screen
  owner: application_workflow
  guarantees:
    - "包含所有實際處理的事件及其確定順序。"
    - "包含處理完成後的單一 GameScreenOutput 與 RuntimeDirective。"
domain_refs:
  - V3-AGG-BOARD-BOARD
  - V3-AGG-BOMB-BOMB
  - V3-AGG-DOORMAZE-DOORMAZE
  - V3-AGG-FIRE-FIRE
  - V3-AGG-FOOD-FOOD
  - V3-AGG-GAME-GAME
  - V3-AGG-GAMERESULT-GAMERESULT
  - V3-AGG-LEVEL-LEVEL
  - V3-AGG-SHIELD-SHIELD
  - V3-AGG-SNAKE-SNAKE
preconditions:
  - id: V3-WF-TICK-PRE-TIME
    rule: "累積毫秒必須非負且不得小於 Game.last_processed_elapsed_milliseconds。"
  - id: V3-WF-TICK-PRE-CONSISTENT-SNAPSHOT
    rule: "所有 Aggregate 必須能載入同一個已提交版本的遊戲快照。"
decisions:
  - id: V3-WF-TICK-DECISION-NOOP
    rule: "Game 非 Playing，或沒有任何事件在輸入時間前到期時，回傳成功 no-op 與目前完整畫面。"
  - id: V3-WF-TICK-DECISION-EVENT-ORDER
    rule: "事件先依 due_elapsed_milliseconds 遞增；同時刻依 DoorClosingWarning、DoorToggleOrDeferredClose、SnakeMovement 排序。"
  - id: V3-WF-TICK-DECISION-EFFECTIVE-DIRECTION
    rule: "每個到期移動使用 queued_direction ?? current_direction；成功提交移動後更新 current_direction 並清空 queued_direction。"
  - id: V3-WF-TICK-DECISION-TAIL-COLLISION
    rule: "growth_delta 為 0 時，自撞集合排除本次會離開的舊尾格；growth_delta 大於 0 時使用完整既有蛇身。"
  - id: V3-WF-TICK-DECISION-DEATH
    rule: "一個死亡事件只能進入 ShieldRescued 或 GameOver 其中一個互斥分支。"
  - id: V3-WF-TICK-DECISION-COMPLETION
    rule: "只有沒有死亡事件且套用物件效果後仍存活，才評估關卡完成。"
steps:
  - order: 1
    id: V3-WF-TICK-STEP-VALIDATE
    action: "驗證 Game phase、累積時間與同一版本快照；建立不對外可見的工作快照。"
  - order: 2
    id: V3-WF-TICK-STEP-COLLECT-DUE
    action: "列出大於上次已提交時間且小於等於輸入時間的所有移動與門事件。"
  - order: 3
    id: V3-WF-TICK-STEP-SORT-DUE
    action: "依時間及固定同時刻優先序穩定排序；ProcessedEvents 必須保留此順序。"
  - order: 4
    id: V3-WF-TICK-STEP-DOOR
    action: "門提醒先套用；門切換或延後關閉其次套用。關門時任一蛇身仍占門格即維持可通行的 CloseDeferred。"
  - order: 5
    id: V3-WF-TICK-STEP-SELECT-DIRECTION
    action: "每個到期移動先選擇 queued_direction ?? current_direction 作為 effective_direction；尚未成功提交前不得清除 queued_direction。"
  - order: 6
    id: V3-WF-TICK-STEP-PREPARE-MOVEMENT
    action: "每個移動事件先解析下一個蛇頭格、檢查該格物件，取得 growth_delta，再建立 SnakeMovementPlan。"
  - order: 7
    id: V3-WF-TICK-STEP-COLLISION
    action: "以工作快照檢查邊界、牆、Closed 門與 SnakeMovementPlan.self_collision_cells；碰撞時不提交 planned body。"
  - order: 8
    id: V3-WF-TICK-STEP-APPLY-MOVEMENT-AND-EFFECT
    action: "合法移動先在工作快照套用 planned body，再依接觸結果套用食物、Shield、Fire 或 Bomb；所有消耗仍受整次 Tick 原子提交約束。"
  - order: 9
    id: V3-WF-TICK-STEP-RESOLVE-DEATH-OR-COMPLETION
    action: "死亡事件先由 Shield 決策；保命則安全重設並維持 Playing，未保命則記錄 GameOver。沒有死亡時才依效果後長度判定通關。"
  - order: 10
    id: V3-WF-TICK-STEP-POST-MOVEMENT-DOOR
    action: "移動後重新檢查 CloseDeferred 門；只有整條蛇已離開門格才在工作快照關閉。"
  - order: 11
    id: V3-WF-TICK-STEP-REPLENISH
    action: "只有最終仍是目前關卡 Playing 且未通關時，才補充已觸發或等待中的物件。"
  - order: 12
    id: V3-WF-TICK-STEP-CONTINUE-OR-STOP
    action: "保命後仍為 Playing 時可繼續處理後續到期事件；進入 Ready、GameOver 或 Completed 時立即停止剩餘事件。"
  - order: 13
    id: V3-WF-TICK-STEP-COMMIT-AND-PRESENT
    action: "完成所有允許事件後一次原子提交所有 Aggregate 與 last_processed_elapsed_milliseconds，再產生一個最終 GameScreenOutput。"
branches:
  - id: V3-WF-TICK-BRANCH-NORMAL-MOVE
    when: "沒有碰撞且沒有物件接觸。"
    result: "提交一般移動，舊尾格離開。"
  - id: V3-WF-TICK-BRANCH-FOOD
    when: "下一個蛇頭格為 FoodItem。"
    result: "以 +1 或 +2 規劃身體；只有有效計畫可消耗食物。"
  - id: V3-WF-TICK-BRANCH-NONFATAL-FIRE
    when: "Fire 減長後至少保留一格。"
    result: "提交縮短，不消耗 Shield。"
  - id: V3-WF-TICK-BRANCH-SHIELD-RESCUE
    when: "死亡事件且 Shield 有剩餘次數。"
    result: "消耗一次 Shield，以受擊前完整長度安全重設並繼續 Playing。"
  - id: V3-WF-TICK-BRANCH-GAME-OVER
    when: "死亡事件且 Shield 無法保命。"
    result: "記錄 Failed，切換 GameOver，不補物件。"
  - id: V3-WF-TICK-BRANCH-LEVEL-PASSED
    when: "無死亡且效果後長度達標。"
    result: "記錄 Passed；第一、二關輸出下一關 Ready，第三關輸出 Completed。"
stop_conditions:
  - "任何 Aggregate invariant 或外部 Port 契約失敗時整次 Tick 失敗且不得提交。"
  - "Special Food +2 沒有合法尾端延伸格時整次 Tick 失敗，Special Food 保留。"
  - "進入 Ready、GameOver 或 Completed 時不再處理後續到期事件。"
commit_policy:
  unit: complete_process_game_tick
  atomicity: all_or_nothing
  visibility: one_commit_then_one_screen
  rules:
    - "工作快照中的中間狀態不得被 UI、Timer 或其他 Workflow 觀察。"
    - "任一契約錯誤回滾 Snake、物件、門、Level、GameResult、Game 時間與所有其他變更。"
postconditions:
  - id: V3-WF-TICK-POST-TIME
    rule: "成功處理後 last_processed_elapsed_milliseconds 等於輸入值；成功 no-op 依是否有新觀察更新時間基準，但不製造遊戲事件。"
  - id: V3-WF-TICK-POST-SNAKE
    rule: "若 Game 仍有有效蛇身，Snake 的順序、唯一與連續不變式成立。"
  - id: V3-WF-TICK-POST-ONE-SCREEN
    rule: "每次 Workflow 恰好輸出一個對應最終已提交狀態的 GameScreenOutput。"
failures:
  - code: InvalidElapsedTime
    condition: "輸入為負數或時間倒退。"
    state_guarantee: no_state_committed
  - code: InconsistentSnapshot
    condition: "無法載入同一版本的 Aggregate 快照。"
    state_guarantee: no_state_committed
  - code: SnakeTopologyUnavailable
    condition: "Special Food +2 沒有合法尾端延伸格，或任何 planned body 違反拓樸不變式。"
    state_guarantee: no_state_committed_and_triggering_item_retained
  - code: AtomicCommitFailed
    condition: "狀態儲存無法原子提交完整 Tick。"
    state_guarantee: no_partial_commit
no_op:
  - outcome: NotPlaying
    state_guarantee: "不處理事件、不改變 Domain 狀態，回傳目前完整畫面。"
  - outcome: NoDueEvents
    state_guarantee: "不移動蛇、不觸發物件，回傳目前完整畫面。"
