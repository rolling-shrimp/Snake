schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-PROCESS-TICK
contract_ref: V3-WF-GAME-PROCESS-TICK
scenarios:
  - id: V3-SCN-TICK-NOT-PLAYING-NOOP
    title: "非 Playing 時成功忽略"
    given:
      phase: Ready
      committed_elapsed_milliseconds: 0
    when:
      accumulated_elapsed_milliseconds: 1000
    then:
      is_success: true
      outcome: NotPlaying
      domain_state_unchanged: true
      processed_events: []
      screen_matches_current_state: true
    evidence: [behavioral, static]
  - id: V3-SCN-TICK-CATCH-UP-FOUR-MOVES
    title: "1000ms 輸入補完四次移動"
    given:
      phase: Playing
      committed_elapsed_milliseconds: 0
      movement_interval_milliseconds: 250
      path_has_no_collision_or_object: true
    when:
      accumulated_elapsed_milliseconds: 1000
    then:
      movement_due_times: [250, 500, 750, 1000]
      movement_count: 4
      processed_in_due_time_order: true
      final_snake_position_after_four_moves: true
    evidence: [behavioral, temporal]
  - id: V3-SCN-TICK-CONSUME-QUEUED-DIRECTION
    title: "下一個到期移動消費已排隊方向"
    given:
      phase: Playing
      current_direction: Right
      queued_direction: Down
      path_has_no_collision_or_object: true
    when:
      accumulated_elapsed_milliseconds: 250
    then:
      effective_direction: Down
      movement_direction: Down
      current_direction: Down
      queued_direction: null
      movement_count: 1
    evidence: [behavioral, invariant, temporal]
  - id: V3-SCN-TICK-DOOR-WARNING-PRIORITY
    title: "4000ms 門提醒先於同時刻移動"
    given:
      level: 3
      phase: Playing
      door_is_open_and_due_to_close_at: 6000
    when:
      accumulated_elapsed_milliseconds: 4000
    then:
      same_time_event_order: [DoorClosingWarning, SnakeMovement]
      door_visual_state_seen_by_movement: ClosingWarning
    evidence: [behavioral, temporal]
  - id: V3-SCN-TICK-DOOR-TOGGLE-PRIORITY
    title: "6000ms 門切換或延後關閉先於同時刻移動"
    given:
      level: 3
      phase: Playing
      door_toggle_due_at: 6000
    when:
      accumulated_elapsed_milliseconds: 6000
    then:
      same_time_event_order: [DoorToggle, SnakeMovement]
      occupied_door_stays_passable_as_close_deferred: true
      deferred_door_closes_only_after_entire_snake_leaves: true
    evidence: [behavioral, temporal, invariant]
  - id: V3-SCN-TICK-MOVE-INTO-LEAVING-TAIL
    title: "一般移動進入即將離開的尾格不算自撞"
    given:
      growth_delta: 0
      next_head_equals_old_tail: true
      body_is_otherwise_valid: true
    when:
      event: SnakeMovement
    then:
      tail_will_leave: true
      self_collision: false
      movement_committed: true
      resulting_body_is_ordered_unique_and_contiguous: true
    evidence: [behavioral, invariant]
  - id: V3-SCN-TICK-HIT-RETAINED-BODY
    title: "撞到仍保留的身體才是自撞"
    given:
      next_head_overlaps_non_leaving_body: true
    when:
      event: SnakeMovement
    then:
      self_collision: true
      planned_body_not_committed: true
    evidence: [behavioral, invariant]
  - id: V3-SCN-TICK-ORDINARY-FOOD-GROWTH
    title: "普通食物增加一格且保留連續蛇身"
    given:
      candidate_head_contains: OrdinaryFood
    when:
      event: SnakeMovement
    then:
      growth_delta: 1
      old_tail_retained: true
      length_increase: 1
      food_consumed_only_on_commit: true
      resulting_body_is_ordered_unique_and_contiguous: true
    evidence: [behavioral, invariant]
  - id: V3-SCN-TICK-SPECIAL-FOOD-CANDIDATE-ORDER
    title: "特殊食物依固定尾端候選順序增加兩格"
    given:
      candidate_head_contains: SpecialFood
      tail_extension_legality:
        straight_behind: false
        left_side: true
        right_side: true
    when:
      event: SnakeMovement
    then:
      selected_tail_extension: left_side
      candidate_order: [straight_behind, left_side, right_side]
      length_increase: 2
      resulting_body_is_ordered_unique_and_contiguous: true
    evidence: [behavioral, invariant]
  - id: V3-SCN-TICK-SPECIAL-FOOD-ATOMIC-ROLLBACK
    title: "特殊食物沒有合法尾端格時整次 Tick 回滾"
    given:
      candidate_head_contains: SpecialFood
      legal_tail_extension_candidates: []
    when:
      event: SnakeMovement
    then:
      is_success: false
      failure_code: SnakeTopologyUnavailable
      entire_tick_rolled_back: true
      special_food_retained: true
      elapsed_time_not_committed: true
    evidence: [behavioral, invariant, temporal]
  - id: V3-SCN-TICK-SHIELD-RESCUE
    title: "死亡事件有護盾時只走保命分支"
    given:
      phase: Playing
      remaining_shield_charges: 1
      death_cause: SelfCollision
      length_before_hit: 12
    when:
      event: SnakeMovement
    then:
      shield_rescued: true
      game_over: false
      remaining_shield_charges: 0
      reset_length: 12
      phase: Playing
      resulting_body_is_ordered_unique_and_contiguous: true
    evidence: [behavioral, invariant]
  - id: V3-SCN-TICK-UNRESCUED-DEATH
    title: "死亡事件沒有護盾時只走 GameOver 分支"
    given:
      phase: Playing
      remaining_shield_charges: 0
      death_cause: Bomb
    when:
      event: SnakeMovement
    then:
      shield_rescued: false
      phase: GameOver
      result_recorded: Failed
      object_replenished: false
      runtime_directive: Stop
    evidence: [behavioral]
  - id: V3-SCN-TICK-LEVEL-PASSED-STOPS-REPLENISHMENT
    title: "食物效果達標後先通關且不得補物件"
    given:
      level: 2
      snake_length: 19
      candidate_head_contains: OrdinaryFood
    when:
      event: SnakeMovement
    then:
      final_length: 20
      result_recorded: Passed
      target_screen: ThirdLevelReady
      object_replenished: false
      remaining_due_events_stopped: true
    evidence: [behavioral, temporal]
  - id: V3-SCN-TICK-THIRD-LEVEL-OVER-TARGET
    title: "第三關 49 吃特殊食物後以 51 完成整輪"
    given:
      level: 3
      snake_length: 49
      candidate_head_contains: SpecialFood
      tail_extension_available: true
    when:
      event: SnakeMovement
    then:
      final_length: 51
      progress_percentage: 100
      phase: Completed
      object_replenished: false
      runtime_directive: Stop
    evidence: [behavioral, invariant]
  - id: V3-SCN-TICK-INVALID-TIME-ROLLBACK
    title: "負時間或時間倒退不得提交"
    given:
      committed_elapsed_milliseconds: 1000
    when:
      accumulated_elapsed_milliseconds: 999
    then:
      is_success: false
      failure_code: InvalidElapsedTime
      entire_tick_rolled_back: true
      processed_events: []
    evidence: [behavioral, temporal]
  - id: V3-SCN-TICK-ONE-FINAL-SCREEN
    title: "一次 Tick 只輸出一個最終畫面"
    given:
      one_input_contains_multiple_due_events: true
    when:
      operation: ProcessGameTick
    then:
      visible_commit_count: 1
      screen_output_count: 1
      screen_matches_final_committed_snapshot: true
      intermediate_states_visible: false
    evidence: [static, runtime_ui]
evidence_requirements:
  - type: behavioral
    required: true
    provider: checker_or_test_suite
    rule: "一個 behavioral checker 可以同時覆蓋多個 scenario。"
  - type: invariant
    required: true
    provider: aggregate_checker_or_test_suite
    rule: "必須證明所有成功 Snake 變更後的順序、唯一與連續不變式。"
  - type: temporal
    required: true
    provider: deterministic_clock_checker_or_test_suite
    rule: "必須證明補事件與同時刻優先序，不要求每個 scenario 對應一個測試方法。"
  - type: static
    required: true
    provider: specification_or_code_checker
    rule: "必須證明 UI 邊界只取得完整 Result，而非逐步編排葉節點操作。"
  - type: runtime_ui
    required: true
    provider: ui_runtime_checker_or_manual_reviewer
    rule: "必須證明一次 Workflow 只有一次可見提交；在產品尚未重構前可為 Audit pending。"
