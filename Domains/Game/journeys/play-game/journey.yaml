schema_version: 3
spec_kind: journey_contract
id: V3-JOURNEY-GAME-PLAY
journey: PlayGame
states:
  - { id: FirstLevelReady, round_state: active }
  - { id: FirstLevelPlaying, round_state: active }
  - { id: SecondLevelReady, round_state: active }
  - { id: SecondLevelPlaying, round_state: active }
  - { id: ThirdLevelReady, round_state: active }
  - { id: ThirdLevelPlaying, round_state: active }
  - { id: GameOver, round_state: terminal }
  - { id: GameCompleted, round_state: terminal }
state_refs:
  - V3-PRES-STATE-GAME-FIRST-LEVEL-READY
  - V3-PRES-STATE-GAME-FIRST-LEVEL-PLAYING
  - V3-PRES-STATE-GAME-SECOND-LEVEL-READY
  - V3-PRES-STATE-GAME-SECOND-LEVEL-PLAYING
  - V3-PRES-STATE-GAME-THIRD-LEVEL-READY
  - V3-PRES-STATE-GAME-THIRD-LEVEL-PLAYING
  - V3-PRES-STATE-GAME-GAME-OVER
  - V3-PRES-STATE-GAME-GAME-COMPLETED
transitions:
  - id: V3-JOURNEY-TRANSITION-START-FIRST
    from: FirstLevelReady
    domain_ref: V3-DOMAIN-GAME-START-FIRST-LEVEL
    to: FirstLevelPlaying
  - id: V3-JOURNEY-TRANSITION-START-SECOND
    from: SecondLevelReady
    domain_ref: V3-DOMAIN-GAME-START-SECOND-LEVEL
    to: SecondLevelPlaying
  - id: V3-JOURNEY-TRANSITION-START-THIRD
    from: ThirdLevelReady
    domain_ref: V3-DOMAIN-GAME-START-THIRD-LEVEL
    to: ThirdLevelPlaying
  - id: V3-JOURNEY-TRANSITION-DIRECTION
    from: [FirstLevelPlaying, SecondLevelPlaying, ThirdLevelPlaying]
    domain_ref: V3-DOMAIN-GAME-SET-SNAKE-DIRECTION
    to: same_playing_state
  - id: V3-JOURNEY-TRANSITION-TICK
    from: [FirstLevelPlaying, SecondLevelPlaying, ThirdLevelPlaying]
    owner: GameForm
    use_case_order:
      - UpdateThirdLevelDoorState
      - HandleSelfCollision
      - HandleWallCollision
      - HandleClosedDoorCollision
      - MoveSnake
      - HandleOrdinaryFoodContact
      - HandleSpecialFoodContact
      - HandleShieldContact
      - HandleFireContact
      - HandleBombContact
      - RescueWithShield
      - EvaluateLevelCompletion
      - EndCurrentLevelPlay
      - PrepareNextLevel
      - ReplenishTriggeredObject
      - GetGameScreen
    to: [same_playing_state, next_level_ready, GameOver, GameCompleted]
  - id: V3-JOURNEY-TRANSITION-RESTART
    from: [GameOver, GameCompleted]
    domain_ref: V3-DOMAIN-GAME-RESTART-GAME
    to: FirstLevelPlaying
domain_contract_refs:
  - V3-DOMAIN-GAME-START-FIRST-LEVEL
  - V3-DOMAIN-GAME-START-SECOND-LEVEL
  - V3-DOMAIN-GAME-START-THIRD-LEVEL
  - V3-DOMAIN-GAME-SET-SNAKE-DIRECTION
  - V3-DOMAIN-GAME-UPDATE-THIRD-LEVEL-DOOR-STATE
  - V3-DOMAIN-GAME-MOVE-SNAKE
  - V3-DOMAIN-GAME-HANDLE-ORDINARY-FOOD-CONTACT
  - V3-DOMAIN-GAME-HANDLE-SPECIAL-FOOD-CONTACT
  - V3-DOMAIN-GAME-HANDLE-SHIELD-CONTACT
  - V3-DOMAIN-GAME-HANDLE-FIRE-CONTACT
  - V3-DOMAIN-GAME-HANDLE-BOMB-CONTACT
  - V3-DOMAIN-GAME-HANDLE-SELF-COLLISION
  - V3-DOMAIN-GAME-HANDLE-WALL-COLLISION
  - V3-DOMAIN-GAME-HANDLE-CLOSED-DOOR-COLLISION
  - V3-DOMAIN-GAME-RESCUE-WITH-SHIELD
  - V3-DOMAIN-GAME-EVALUATE-LEVEL-COMPLETION
  - V3-DOMAIN-GAME-END-CURRENT-LEVEL-PLAY
  - V3-DOMAIN-GAME-PREPARE-NEXT-LEVEL
  - V3-DOMAIN-GAME-REPLENISH-TRIGGERED-OBJECT
  - V3-DOMAIN-GAME-RESTART-GAME
  - V3-DOMAIN-GAME-GET-GAME-SCREEN
terminal_states:
  - GameOver
  - GameCompleted
