schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-PLAY-JOURNEY
contract_ref: V3-JOURNEY-GAME-PLAY
scenarios:
  - id: V3-SCN-JOURNEY-COMPLETE-THREE-LEVELS
    title: "玩家依序完成三關"
    given:
      state: FirstLevelReady
    when:
      use_case_sequence:
        - StartFirstLevel
        - Tick_until_first_level_passed
        - PrepareNextLevel
        - StartSecondLevel
        - Tick_until_second_level_passed
        - PrepareNextLevel
        - StartThirdLevel
        - Tick_until_third_level_passed
    then:
      state: GameCompleted
      replay_available: true
    evidence: [behavioral, journey]
  - id: V3-SCN-JOURNEY-DEATH-AND-RESTART
    title: "沒有護盾的死亡事件結束遊戲並可重玩"
    given:
      state: any_playing_level
      shield_count: 0
    when:
      use_case_sequence: [EndCurrentLevelPlay, GetGameScreen, RestartGame]
    then:
      state: FirstLevelPlaying
      snake_length: 3
    evidence: [behavioral, journey]
  - id: V3-SCN-JOURNEY-TICK-ONE-MOVE
    title: "一個 UI Timer Tick 只移動一次"
    given:
      state: any_playing_level
      timer_interval_ms: 250
    when:
      owner: GameForm
      method: OnGameTimerTick
      call_count: 1
    then:
      MoveSnake_call_count: 1
      catch_up_loop_used: false
    evidence: [behavioral, temporal]
