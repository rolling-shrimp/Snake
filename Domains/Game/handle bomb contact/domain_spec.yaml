schema_version: 3
spec_kind: domain_contract
id: V3-DOMAIN-GAME-HANDLE-BOMB-CONTACT
domain: HandleBombContact
frame_ref: V3-FRAME-GAME-HANDLE-BOMB-CONTACT
aggregate_refs:
  - V3-AGG-GAME-GAME
  - V3-AGG-SNAKE-SNAKE
  - V3-AGG-BOMB-BOMB
  - V3-AGG-SHIELD-SHIELD
use_case: HandleBombContact
input:
  grain: current_snake_head_contact
  owner: GameForm
  type: none
output:
  grain: no_return_value
  owner: HandleBombContactUseCase
  type: none
preconditions:
  - id: V3-DOMAIN-HANDLE-BOMB-CONTACT-PRE
    rule: "目前為第三關 Playing，且蛇頭接觸炸彈。"
rules:
  - id: V3-DOMAIN-HANDLE-BOMB-CONTACT-RULE
    rule: "炸彈接觸不直接決定 Game Over，而是記錄致命事件供護盾保命與結束流程處理。"
postconditions:
  - id: V3-DOMAIN-HANDLE-BOMB-CONTACT-POST
    rule: "炸彈已移除且目前 Tick 存在炸彈致命事件。"
invariants:
  - id: V3-DOMAIN-HANDLE-BOMB-CONTACT-INV
    rule: "同一物件接觸在同一 Tick 最多套用一次效果。"
no_op:
  - "蛇頭未接觸此類物件時不修改狀態。"
