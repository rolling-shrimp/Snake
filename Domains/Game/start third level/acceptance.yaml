schema_version: 3
spec_kind: acceptance_contract
id: V3-ACCEPT-GAME-START-THIRD-LEVEL
contract_ref: V3-DOMAIN-GAME-START-THIRD-LEVEL
scenarios:
  - id: V3-SCN-START-THIRD-LEVEL
    title: "玩家在第三關待開始畫面按下開始後，第三關迷宮立即進入遊玩狀態。"
    given:
      precondition: "目前畫面為第三關 Ready。"
    when:
      operation: StartThirdLevel
      call_count: 1
    then:
      postcondition: "第三關為 Playing，蛇長為 3、進度為 6% 且門狀態可見。"
    evidence: [behavioral, invariant]
