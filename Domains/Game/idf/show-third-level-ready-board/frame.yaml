bounded_context: snake-game
aggregate: game

use_case:
  name: show-third-level-ready-board
  requirement: "第三關待開始時，顯示 10×10 迷宮、牆壁、門與安全起點上的 3 格蛇。"
frame_type: IDF

world_facts:
  actor: display
  required_state: "game.phase == Ready 且 level.number == 3"
  visibility_scope: "只顯示第三關靜態棋盤與門目前狀態；尚不顯示遊玩物件"
  side_effect_policy: none

frame_concerns:
  - concern_ref: IDF-CONCERN-001
    check_id: IDF-SHOW-THIRD-LEVEL-READY-BOARD-001
    description: "確保完整輸出 BoardRows、BoardColumns、SnakeCells、WallCells、Doors、IsStartButtonVisible。"

  - concern_ref: IDF-CONCERN-002
    check_id: IDF-SHOW-THIRD-LEVEL-READY-BOARD-002
    description: "確保 棋盤 10×10，牆與門格合法，保留可容納 50 格蛇的連續路線，三格蛇安全，開始按鈕可見，且所有值來自目前 Domain 事實。"

  - concern_ref: IDF-CONCERN-003
    check_id: IDF-SHOW-THIRD-LEVEL-READY-BOARD-003
    description: "確保 只顯示第三關靜態棋盤與門目前狀態；尚不顯示遊玩物件；排除 普通食物、特殊食物、護盾、火焰、炸彈、尚未發生的門提醒。"

  - concern_ref: IDF-CONCERN-004
    check_id: IDF-SHOW-THIRD-LEVEL-READY-BOARD-004
    description: "確保查詢不改變任何 Domain、Read Model 版本或遊戲時間。"

