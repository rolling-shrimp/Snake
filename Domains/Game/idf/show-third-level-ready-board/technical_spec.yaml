use_case: show-third-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  domain: domain_spec.yaml

input:
  type: ShowThirdLevelReadyBoardQuery
  source: display_refresh
  fields: []

output:
  type: ShowThirdLevelReadyBoardResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
    - name: Data
      csharp_type: "ThirdLevelReadyBoardRspDTO?"
      required: true

data_contract:
  type: ThirdLevelReadyBoardRspDTO
  fields:
    - name: BoardRows
      csharp_type: "int"
      required: true
      description: "固定為 10"
    - name: BoardColumns
      csharp_type: "int"
      required: true
      description: "固定為 10"
    - name: SnakeCells
      csharp_type: "List<GridPositionDTO>"
      required: true
      description: "安全起點三格蛇"
    - name: WallCells
      csharp_type: "List<GridPositionDTO>"
      required: true
      description: "外牆與固定內牆"
    - name: Doors
      csharp_type: "List<DoorStatusDTO>"
      required: true
      description: "門格與目前狀態"
    - name: IsStartButtonVisible
      csharp_type: "bool"
      required: true
      description: "固定為 true"

read_port:
  name: IThirdLevelReadyBoardReadPort
  returns: ThirdLevelReadyBoardRspDTO
  side_effect_free: true

domain_to_technical_mapping:
  - domain_rules: [DOM-SHOW-THIRD-LEVEL-READY-BOARD-IN-001, DOM-SHOW-THIRD-LEVEL-READY-BOARD-PRE-001]
    target: ShowThirdLevelReadyBoardQuery
    description: "無欄位 Query 只辨識本次顯示要求並驗證可見條件。"
  - domain_rules: [DOM-SHOW-THIRD-LEVEL-READY-BOARD-POST-001]
    target: ThirdLevelReadyBoardRspDTO
    description: "棋盤 10×10，牆與門格合法，保留可容納 50 格蛇的連續路線，三格蛇安全，開始按鈕可見"

state_mappings:
  - mapping_id: TECH-SHOW-THIRD-LEVEL-READY-BOARD-STATE-001
    description: "Projection 與 Query 都不得呼叫改變 Domain 狀態的方法。"

error_mappings:
  - mapping_id: TECH-SHOW-THIRD-LEVEL-READY-BOARD-ERR-001
    condition: "不符合 game.phase == Ready 且 level.number == 3"
    result: ShowThirdLevelReadyBoardResult
    failure_code: INVALID_GAME_PHASE
    failure_message: "目前不是第三關待開始階段。"
    data: null

no_op_mappings: []

