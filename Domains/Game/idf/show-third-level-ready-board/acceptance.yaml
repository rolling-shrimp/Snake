use_case: show-third-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-SHOW-THIRD-LEVEL-READY-BOARD-001
    title: "成功顯示：第三關待開始時，顯示 10×10 迷宮、牆壁、門與安全起點上的 3 格蛇。"
    description: "棋盤 10×10，牆與門格合法，保留可容納 50 格蛇的連續路線，三格蛇安全，開始按鈕可見"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-THIRD-LEVEL-READY-BOARD-001
        - IDF-SHOW-THIRD-LEVEL-READY-BOARD-002
        - IDF-SHOW-THIRD-LEVEL-READY-BOARD-003
        - IDF-SHOW-THIRD-LEVEL-READY-BOARD-004
      domain_rules:
        - DOM-SHOW-THIRD-LEVEL-READY-BOARD-PRE-001
        - DOM-SHOW-THIRD-LEVEL-READY-BOARD-INV-001
        - DOM-SHOW-THIRD-LEVEL-READY-BOARD-POST-001
      technical_contracts:
        - ShowThirdLevelReadyBoardResult.Data
        - TECH-SHOW-THIRD-LEVEL-READY-BOARD-STATE-001
    given:
      - fact: "game.phase == Ready 且 level.number == 3"
    when:
      action: execute_query
      input:
        type: ShowThirdLevelReadyBoardQuery
        fields: {}
    then:
      output:
        type: ShowThirdLevelReadyBoardResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
          data_expectation: "棋盤 10×10，牆與門格合法，保留可容納 50 格蛇的連續路線，三格蛇安全，開始按鈕可見"
      excludes:
        - "普通食物"
        - "特殊食物"
        - "護盾"
        - "火焰"
        - "炸彈"
        - "尚未發生的門提醒"
      domain_state:
        unchanged: true

  - id: SCN-SHOW-THIRD-LEVEL-READY-BOARD-002
    title: "失敗：目前不是第三關待開始階段。"
    description: "不符合可見條件時拒絕查詢，不得洩漏部分資料。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-THIRD-LEVEL-READY-BOARD-003
        - IDF-SHOW-THIRD-LEVEL-READY-BOARD-004
      domain_rules:
        - DOM-SHOW-THIRD-LEVEL-READY-BOARD-ERR-001
      technical_contracts:
        - TECH-SHOW-THIRD-LEVEL-READY-BOARD-ERR-001
    given:
      - fact: "不符合 game.phase == Ready 且 level.number == 3"
    when:
      action: execute_query
      input:
        type: ShowThirdLevelReadyBoardQuery
        fields: {}
    then:
      output:
        type: ShowThirdLevelReadyBoardResult
        fields:
          is_success: false
          failure_code: INVALID_GAME_PHASE
          failure_message: "目前不是第三關待開始階段。"
          data: null
      domain_state:
        unchanged: true

