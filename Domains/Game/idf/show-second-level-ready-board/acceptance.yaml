use_case: show-second-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-SHOW-SECOND-LEVEL-READY-BOARD-001
    title: "成功顯示：第二關待開始時，顯示 10×10 棋盤、安全起點上的 3 格蛇與「開始」按鈕。"
    description: "棋盤為 10×10，三個蛇身格合法且唯一，開始按鈕可見，棋盤物件數為 0"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-SECOND-LEVEL-READY-BOARD-001
        - IDF-SHOW-SECOND-LEVEL-READY-BOARD-002
        - IDF-SHOW-SECOND-LEVEL-READY-BOARD-003
        - IDF-SHOW-SECOND-LEVEL-READY-BOARD-004
      domain_rules:
        - DOM-SHOW-SECOND-LEVEL-READY-BOARD-PRE-001
        - DOM-SHOW-SECOND-LEVEL-READY-BOARD-INV-001
        - DOM-SHOW-SECOND-LEVEL-READY-BOARD-POST-001
      technical_contracts:
        - ShowSecondLevelReadyBoardResult.Data
        - TECH-SHOW-SECOND-LEVEL-READY-BOARD-STATE-001
    given:
      - fact: "game.phase == Ready 且 level.number == 2"
    when:
      action: execute_query
      input:
        type: ShowSecondLevelReadyBoardQuery
        fields: {}
    then:
      output:
        type: ShowSecondLevelReadyBoardResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
          data_expectation: "棋盤為 10×10，三個蛇身格合法且唯一，開始按鈕可見，棋盤物件數為 0"
      excludes:
        - "普通食物"
        - "特殊食物"
        - "護盾"
        - "火焰"
        - "炸彈"
        - "第三關牆壁與門"
      domain_state:
        unchanged: true

  - id: SCN-SHOW-SECOND-LEVEL-READY-BOARD-002
    title: "失敗：目前不是第二關待開始階段。"
    description: "不符合可見條件時拒絕查詢，不得洩漏部分資料。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-SECOND-LEVEL-READY-BOARD-003
        - IDF-SHOW-SECOND-LEVEL-READY-BOARD-004
      domain_rules:
        - DOM-SHOW-SECOND-LEVEL-READY-BOARD-ERR-001
      technical_contracts:
        - TECH-SHOW-SECOND-LEVEL-READY-BOARD-ERR-001
    given:
      - fact: "不符合 game.phase == Ready 且 level.number == 2"
    when:
      action: execute_query
      input:
        type: ShowSecondLevelReadyBoardQuery
        fields: {}
    then:
      output:
        type: ShowSecondLevelReadyBoardResult
        fields:
          is_success: false
          failure_code: INVALID_GAME_PHASE
          failure_message: "目前不是第二關待開始階段。"
          data: null
      domain_state:
        unchanged: true

