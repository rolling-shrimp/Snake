use_case: show-second-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  domain: domain_spec.yaml

input:
  type: ShowSecondLevelReadyBoardQuery
  source: display_refresh
  fields: []

output:
  type: ShowSecondLevelReadyBoardResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
    - name: Data
      csharp_type: "SecondLevelReadyBoardRspDTO?"
      required: true

data_contract:
  type: SecondLevelReadyBoardRspDTO
  fields:
    - name: BoardRows
      csharp_type: "int"
      required: true
      description: "固定為 10"
    - name: BoardColumns
      csharp_type: "int"
      required: true
      description: "固定為 10"
    - name: SnakeCells
      csharp_type: "List<GridPositionDTO>"
      required: true
      description: "安全起點的三個唯一合法格位"
    - name: IsStartButtonVisible
      csharp_type: "bool"
      required: true
      description: "固定為 true"

read_port:
  name: ISecondLevelReadyBoardReadPort
  returns: SecondLevelReadyBoardRspDTO
  side_effect_free: true

domain_to_technical_mapping:
  - domain_rules: [DOM-SHOW-SECOND-LEVEL-READY-BOARD-IN-001, DOM-SHOW-SECOND-LEVEL-READY-BOARD-PRE-001]
    target: ShowSecondLevelReadyBoardQuery
    description: "無欄位 Query 只辨識本次顯示要求並驗證可見條件。"
  - domain_rules: [DOM-SHOW-SECOND-LEVEL-READY-BOARD-POST-001]
    target: SecondLevelReadyBoardRspDTO
    description: "棋盤為 10×10，三個蛇身格合法且唯一，開始按鈕可見，棋盤物件數為 0"

state_mappings:
  - mapping_id: TECH-SHOW-SECOND-LEVEL-READY-BOARD-STATE-001
    description: "Projection 與 Query 都不得呼叫改變 Domain 狀態的方法。"

error_mappings:
  - mapping_id: TECH-SHOW-SECOND-LEVEL-READY-BOARD-ERR-001
    condition: "不符合 game.phase == Ready 且 level.number == 2"
    result: ShowSecondLevelReadyBoardResult
    failure_code: INVALID_GAME_PHASE
    failure_message: "目前不是第二關待開始階段。"
    data: null

no_op_mappings: []

