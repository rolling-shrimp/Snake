use_case: show-first-level-rules
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  domain: domain_spec.yaml

read_port:
  name: IFirstLevelReadPort
  operation: Read
  returns: FirstLevelReadModel
  implementation: SnakeGameSession
  entity_exposure: false

input:
  type: ShowFirstLevelRulesQuery
  source: "Game Domain 的第一關規則。"
  fields: []

output:
  type: ShowFirstLevelRulesResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
    - name: Data
      csharp_type: "FirstLevelRulesRspDTO?"
      required: true

data:
  type: FirstLevelRulesRspDTO
  fields:
    - name: RuleHints
      csharp_type: "List<RuleHintDTO>"
      required: true
      constraints:
        - "恰好三項。"
        - "順序固定為普通食物、邊界穿越、撞身死亡。"
      domain_rules:
        - DOM-FIRST-LEVEL-RULES-OUT-001
        - DOM-FIRST-LEVEL-RULES-OUT-002
        - DOM-FIRST-LEVEL-RULES-OUT-003
        - DOM-FIRST-LEVEL-RULES-OUT-004

types:
  - name: ShowFirstLevelRulesQuery
    fields: []
  - name: ShowFirstLevelRulesResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"
      - name: Data
        csharp_type: "FirstLevelRulesRspDTO?"
  - name: FirstLevelRulesRspDTO
    fields:
      - name: RuleHints
        csharp_type: "List<RuleHintDTO>"
  - name: RuleHintDTO
    fields:
      - name: Code
        csharp_type: string
      - name: Text
        csharp_type: string

fixed_values:
  - order: 1
    code: ORDINARY_FOOD_GROWTH
    text: "普通食物 +1 格"
  - order: 2
    code: BOUNDARY_WRAP
    text: "邊界可以穿越"
  - order: 3
    code: SELF_COLLISION_DEATH
    text: "撞到自己的身體會死亡"

excluded_fields:
  - other_level_rules
  - object_effects
  - internal_domain_fields

domain_to_technical_mapping:
  - domain_rules:
      - DOM-FIRST-LEVEL-RULES-OUT-001
      - DOM-FIRST-LEVEL-RULES-OUT-002
      - DOM-FIRST-LEVEL-RULES-OUT-003
      - DOM-FIRST-LEVEL-RULES-OUT-004
    target: ShowFirstLevelRulesResult.Data.RuleHints
    description: "三項 Domain 規則依指定順序各映射為一個 RuleHintDTO。"
  - domain_rules:
      - DOM-FIRST-LEVEL-RULES-OUT-001
      - DOM-FIRST-LEVEL-RULES-OUT-002
      - DOM-FIRST-LEVEL-RULES-OUT-003
    target: "ShowFirstLevelRulesResult.Data.RuleHints[].Code, ShowFirstLevelRulesResult.Data.RuleHints[].Text"
    description: "Code 使用固定、可測試的英文識別碼；Text 使用玩家可見的繁體中文提示。"

state_mappings:
  - mapping_id: TECH-FIRST-LEVEL-RULES-STATE-001
    description: "本操作不得寫入 Game Domain、產生棋盤物件或推進遊戲狀態。"

error_mappings:
  - mapping_id: TECH-FIRST-LEVEL-RULES-ERR-001
    domain_code: INVALID_GAME_PHASE
    technical_type: ShowFirstLevelRulesResult
    result:
      IsSuccess: false
      FailureCode: INVALID_GAME_PHASE
      FailureMessage: "目前不是第一關待開始階段。"
      Data: null
    description: "預期的階段錯誤使用 Result 回傳，不拋出例外，且不得修改狀態。"

no_op_mappings: []
