use_case: show-second-level-rules
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-SHOW-SECOND-LEVEL-RULES-001
    title: "成功顯示：第二關待開始時，顯示普通食物、特殊食物、護盾與火焰的規則提示。"
    description: "依序顯示普通食物 +1、特殊食物 +2、護盾 +1 次保命、火焰 −2 格"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-SECOND-LEVEL-RULES-001
        - IDF-SHOW-SECOND-LEVEL-RULES-002
        - IDF-SHOW-SECOND-LEVEL-RULES-003
        - IDF-SHOW-SECOND-LEVEL-RULES-004
      domain_rules:
        - DOM-SHOW-SECOND-LEVEL-RULES-PRE-001
        - DOM-SHOW-SECOND-LEVEL-RULES-INV-001
        - DOM-SHOW-SECOND-LEVEL-RULES-POST-001
      technical_contracts:
        - ShowSecondLevelRulesResult.Data
        - TECH-SHOW-SECOND-LEVEL-RULES-STATE-001
    given:
      - fact: "game.phase == Ready 且 level.number == 2"
    when:
      action: execute_query
      input:
        type: ShowSecondLevelRulesQuery
        fields: {}
    then:
      output:
        type: ShowSecondLevelRulesResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
          data_expectation: "依序顯示普通食物 +1、特殊食物 +2、護盾 +1 次保命、火焰 −2 格"
      excludes:
        - "炸彈"
        - "牆壁"
        - "門"
        - "第三關規則"
      domain_state:
        unchanged: true

  - id: SCN-SHOW-SECOND-LEVEL-RULES-002
    title: "失敗：目前不是第二關待開始階段。"
    description: "不符合可見條件時拒絕查詢，不得洩漏部分資料。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-SECOND-LEVEL-RULES-003
        - IDF-SHOW-SECOND-LEVEL-RULES-004
      domain_rules:
        - DOM-SHOW-SECOND-LEVEL-RULES-ERR-001
      technical_contracts:
        - TECH-SHOW-SECOND-LEVEL-RULES-ERR-001
    given:
      - fact: "不符合 game.phase == Ready 且 level.number == 2"
    when:
      action: execute_query
      input:
        type: ShowSecondLevelRulesQuery
        fields: {}
    then:
      output:
        type: ShowSecondLevelRulesResult
        fields:
          is_success: false
          failure_code: INVALID_GAME_PHASE
          failure_message: "目前不是第二關待開始階段。"
          data: null
      domain_state:
        unchanged: true

