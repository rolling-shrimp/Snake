use_case: show-first-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  domain: domain_spec.yaml

input:
  type: none
  source: "Game Domain 已擁有的第一關待開始狀態。"
  fields: []

output:
  type: FirstLevelReadyBoardRspDTO
  fields:
    - name: BoardRows
      csharp_type: int
      required: true
      constraints:
        - "固定為 10。"
      domain_rules:
        - DOM-READY-BOARD-OUT-001
    - name: BoardColumns
      csharp_type: int
      required: true
      constraints:
        - "固定為 10。"
      domain_rules:
        - DOM-READY-BOARD-OUT-001
    - name: SnakeCells
      csharp_type: "List<GridPositionDTO>"
      required: true
      constraints:
        - "必須有 3 個合法且不重疊的位置。"
      domain_rules:
        - DOM-READY-BOARD-OUT-002
    - name: IsStartButtonVisible
      csharp_type: bool
      required: true
      constraints:
        - "固定為 true。"
      domain_rules:
        - DOM-READY-BOARD-OUT-003

types:
  - name: FirstLevelReadyBoardRspDTO
    fields:
      - name: BoardRows
        csharp_type: int
      - name: BoardColumns
        csharp_type: int
      - name: SnakeCells
        csharp_type: "List<GridPositionDTO>"
      - name: IsStartButtonVisible
        csharp_type: bool
  - name: GridPositionDTO
    fields:
      - name: X
        csharp_type: int
        constraints:
          - "範圍為 0 至 9。"
      - name: Y
        csharp_type: int
        constraints:
          - "範圍為 0 至 9。"

excluded_fields:
  - Phase
  - movement_state
  - timing
  - other_internal_fields

domain_to_technical_mapping:
  - domain_rules:
      - DOM-READY-BOARD-OUT-001
    target: "FirstLevelReadyBoardRspDTO.BoardRows, FirstLevelReadyBoardRspDTO.BoardColumns"
    description: "Domain 棋盤列數與欄數分別映射至 BoardRows、BoardColumns。"
  - domain_rules:
      - DOM-READY-BOARD-OUT-002
    target: FirstLevelReadyBoardRspDTO.SnakeCells
    description: "Domain 安全起點蛇格逐一映射為 GridPositionDTO，並存入 SnakeCells。"
  - domain_rules:
      - DOM-READY-BOARD-OUT-003
    target: FirstLevelReadyBoardRspDTO.IsStartButtonVisible
    description: "Domain 可用的開始動作映射為 IsStartButtonVisible = true。"

state_mappings:
  - mapping_id: TECH-READY-BOARD-STATE-001
    description: "本操作不得寫入 Game Domain、啟動計時器、移動蛇或產生物件。"

error_mappings:
  - mapping_id: TECH-READY-BOARD-ERR-001
    domain_code: INVALID_GAME_PHASE
    technical_type: InvalidOperationException
    description: "例外必須在產生部分 Output 或修改狀態前發生。"

no_op_mappings: []
