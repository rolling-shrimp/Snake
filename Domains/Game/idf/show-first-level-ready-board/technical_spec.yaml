use_case: show-first-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  domain: domain_spec.yaml

read_port:
  name: IFirstLevelReadPort
  operation: Read
  returns: FirstLevelReadModel
  implementation: SnakeGameSession
  entity_exposure: false

input:
  type: ShowFirstLevelReadyBoardQuery
  source: "Game Domain 已擁有的第一關待開始狀態。"
  fields: []

output:
  type: ShowFirstLevelReadyBoardResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
    - name: Data
      csharp_type: "FirstLevelReadyBoardRspDTO?"
      required: true

data:
  type: FirstLevelReadyBoardRspDTO
  fields:
    - name: BoardRows
      csharp_type: int
      required: true
      constraints:
        - "固定為 10。"
      domain_rules:
        - DOM-READY-BOARD-OUT-001
    - name: BoardColumns
      csharp_type: int
      required: true
      constraints:
        - "固定為 10。"
      domain_rules:
        - DOM-READY-BOARD-OUT-001
    - name: SnakeCells
      csharp_type: "List<GridPositionDTO>"
      required: true
      constraints:
        - "必須有 3 個合法且不重疊的位置。"
      domain_rules:
        - DOM-READY-BOARD-OUT-002
    - name: IsStartButtonVisible
      csharp_type: bool
      required: true
      constraints:
        - "固定為 true。"
      domain_rules:
        - DOM-READY-BOARD-OUT-003

types:
  - name: ShowFirstLevelReadyBoardQuery
    fields: []
  - name: ShowFirstLevelReadyBoardResult
    fields:
      - name: IsSuccess
        csharp_type: bool
      - name: FailureCode
        csharp_type: "string?"
      - name: FailureMessage
        csharp_type: "string?"
      - name: Data
        csharp_type: "FirstLevelReadyBoardRspDTO?"
  - name: FirstLevelReadyBoardRspDTO
    fields:
      - name: BoardRows
        csharp_type: int
      - name: BoardColumns
        csharp_type: int
      - name: SnakeCells
        csharp_type: "List<GridPositionDTO>"
      - name: IsStartButtonVisible
        csharp_type: bool
  - name: GridPositionDTO
    fields:
      - name: X
        csharp_type: int
        constraints:
          - "範圍為 0 至 9。"
      - name: Y
        csharp_type: int
        constraints:
          - "範圍為 0 至 9。"

excluded_fields:
  - Phase
  - movement_state
  - timing
  - other_internal_fields

domain_to_technical_mapping:
  - domain_rules:
      - DOM-READY-BOARD-OUT-001
    target: "ShowFirstLevelReadyBoardResult.Data.BoardRows, ShowFirstLevelReadyBoardResult.Data.BoardColumns"
    description: "Domain 棋盤列數與欄數分別映射至 BoardRows、BoardColumns。"
  - domain_rules:
      - DOM-READY-BOARD-OUT-002
    target: ShowFirstLevelReadyBoardResult.Data.SnakeCells
    description: "Domain 安全起點蛇格逐一映射為 GridPositionDTO，並存入 SnakeCells。"
  - domain_rules:
      - DOM-READY-BOARD-OUT-003
    target: ShowFirstLevelReadyBoardResult.Data.IsStartButtonVisible
    description: "Domain 可用的開始動作映射為 IsStartButtonVisible = true。"

state_mappings:
  - mapping_id: TECH-READY-BOARD-STATE-001
    description: "本操作不得寫入 Game Domain、啟動計時器、移動蛇或產生物件。"

error_mappings:
  - mapping_id: TECH-READY-BOARD-ERR-001
    domain_code: INVALID_GAME_PHASE
    technical_type: ShowFirstLevelReadyBoardResult
    result:
      IsSuccess: false
      FailureCode: INVALID_GAME_PHASE
      FailureMessage: "目前不是第一關待開始階段。"
      Data: null
    description: "預期的階段錯誤使用 Result 回傳，不拋出例外，且不得修改狀態。"

no_op_mappings: []
