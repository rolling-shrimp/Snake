use_case: show-first-level-ready-board
bounded_context: snake-game
aggregate: game
frame_type: IDF

domain_refs:
  - domain: Game
    path: ../../domain_spec.yaml
    aggregate: Game
  - domain: Level
    path: ../../../Level/domain_spec.yaml
    aggregate: Level
  - domain: Board
    path: ../../../Board/domain_spec.yaml
    aggregate: Board
  - domain: Snake
    path: ../../../Snake/domain_spec.yaml
    aggregate: Snake

traceability:
  requirement: "frame.yaml#use_case.requirement"
  frame_checks:
    - IDF-READY-BOARD-001
    - IDF-READY-BOARD-002
    - IDF-READY-BOARD-003
    - IDF-READY-BOARD-004

contract:
  input:
    data: none
    rules:
      - rule_id: DOM-READY-BOARD-IN-001
        description: "沒有外部輸入資料；Game Domain 從目前的第一關待開始狀態讀取棋盤與蛇的位置。"
        domain_field_refs:
          - game.phase
          - level.number
          - snake.body_cells
          - board.object_occupied_cells
        domain_rule_refs:
          - GAME-REL-001

  output:
    data: FirstLevelReadyBoard
    rules:
      - rule_id: DOM-READY-BOARD-OUT-001
        description: "輸出一個 10×10 棋盤的顯示資料。"
        domain_field_refs:
          - board.rows
          - board.columns
        domain_rule_refs:
          - BOARD-INV-001
      - rule_id: DOM-READY-BOARD-OUT-002
        description: "輸出安全起點上的 3 個合法且不重疊蛇格。"
        domain_field_refs:
          - snake.body_cells
          - snake.length
          - board.legal_spawn_cells
        domain_rule_refs:
          - SNAKE-INV-001
          - SNAKE-INV-002
          - SNAKE-RESET-001
          - BOARD-PLACE-003
      - rule_id: DOM-READY-BOARD-OUT-003
        description: "輸出可見的「開始」動作。"
        domain_field_refs:
          - game.can_start
        domain_rule_refs:
          - GAME-REL-002
          - GAME-REL-003

  preconditions:
    - rule_id: DOM-READY-BOARD-PRE-001
      description: "Game 已初始化，關卡為第一關，階段為待開始。"
      domain_field_refs:
        - game.phase
        - level.number
      domain_rule_refs:
        - GAME-INV-001
        - GAME-REL-001

  invariants:
    - rule_id: DOM-READY-BOARD-INV-001
      description: "本 use case 只讀取狀態，不得移動蛇、推進遊戲時間、產生棋盤物件或修改 Game Domain。"
      domain_field_refs: []
      domain_rule_refs: []

  process:
    - order: 1
      action: "讀取第一關待開始狀態中的棋盤尺寸與蛇格。"
    - order: 2
      action: "建立棋盤、蛇與「開始」動作的顯示資料。"
    - order: 3
      action: "回傳顯示資料，不修改來源狀態。"

  postconditions:
    - rule_id: DOM-READY-BOARD-POST-001
      description: "輸出內容與目前第一關待開始狀態一致。"
      domain_field_refs:
        - game.phase
        - level.number
        - snake.body_cells
        - game.can_start
      domain_rule_refs:
        - GAME-REL-001
    - rule_id: DOM-READY-BOARD-POST-002
      description: "完成後蛇仍停止在安全起點，棋盤物件仍為空，遊戲時間與 Domain 狀態均未改變。"
      domain_field_refs:
        - game.phase
        - snake.body_cells
        - board.object_occupied_cells
        - game.movement_active
      domain_rule_refs:
        - GAME-INV-002
        - GAME-REL-001

  contract_violations:
    - rule_id: DOM-READY-BOARD-ERR-001
      condition: "目前不是第一關待開始階段。"
      domain_code: INVALID_GAME_PHASE
      state_guarantee: "不得回傳部分顯示資料，原狀態保持不變。"
      domain_field_refs:
        - game.phase
        - level.number
        - game.can_start
      domain_rule_refs:
        - GAME-REL-003

  not_applicable: []
