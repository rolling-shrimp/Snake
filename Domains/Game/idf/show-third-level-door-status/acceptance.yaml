use_case: show-third-level-door-status
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-SHOW-THIRD-LEVEL-DOOR-STATUS-001
    title: "成功顯示：第三關待開始與遊玩期間，顯示每扇門的目前開關、提醒或延後關閉狀態。"
    description: "每扇門輸出位置與 Open、ClosingWarning、CloseDeferred 或 Closed；提醒與實際通行政策一致"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-THIRD-LEVEL-DOOR-STATUS-001
        - IDF-SHOW-THIRD-LEVEL-DOOR-STATUS-002
        - IDF-SHOW-THIRD-LEVEL-DOOR-STATUS-003
        - IDF-SHOW-THIRD-LEVEL-DOOR-STATUS-004
      domain_rules:
        - DOM-SHOW-THIRD-LEVEL-DOOR-STATUS-PRE-001
        - DOM-SHOW-THIRD-LEVEL-DOOR-STATUS-INV-001
        - DOM-SHOW-THIRD-LEVEL-DOOR-STATUS-POST-001
      technical_contracts:
        - ShowThirdLevelDoorStatusResult.Data
        - TECH-SHOW-THIRD-LEVEL-DOOR-STATUS-STATE-001
    given:
      - fact: "level.number == 3 且 game.phase 為 Ready 或 Playing"
    when:
      action: execute_query
      input:
        type: ShowThirdLevelDoorStatusQuery
        fields: {}
    then:
      output:
        type: ShowThirdLevelDoorStatusResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
          data_expectation: "每扇門輸出位置與 Open、ClosingWarning、CloseDeferred 或 Closed；提醒與實際通行政策一致"
      excludes:
        - "非第三關門資料"
        - "尚未到達的預測狀態"
      domain_state:
        unchanged: true

  - id: SCN-SHOW-THIRD-LEVEL-DOOR-STATUS-002
    title: "失敗：目前沒有可顯示的第三關門狀態。"
    description: "不符合可見條件時拒絕查詢，不得洩漏部分資料。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-THIRD-LEVEL-DOOR-STATUS-003
        - IDF-SHOW-THIRD-LEVEL-DOOR-STATUS-004
      domain_rules:
        - DOM-SHOW-THIRD-LEVEL-DOOR-STATUS-ERR-001
      technical_contracts:
        - TECH-SHOW-THIRD-LEVEL-DOOR-STATUS-ERR-001
    given:
      - fact: "不符合 level.number == 3 且 game.phase 為 Ready 或 Playing"
    when:
      action: execute_query
      input:
        type: ShowThirdLevelDoorStatusQuery
        fields: {}
    then:
      output:
        type: ShowThirdLevelDoorStatusResult
        fields:
          is_success: false
          failure_code: INVALID_GAME_PHASE
          failure_message: "目前沒有可顯示的第三關門狀態。"
          data: null
      domain_state:
        unchanged: true

