use_case: show-second-level-status
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  requirement: "frame.yaml#use_case.requirement"
  domain: domain_spec.yaml
  technical: technical_spec.yaml

scenarios:
  - id: SCN-SHOW-SECOND-LEVEL-STATUS-001
    title: "成功顯示：第二關待開始時，顯示第二關、蛇長 3/20、進度 15% 與護盾剩餘 0 次。"
    description: "LevelName 為第二關，CurrentLength 3、TargetLength 20、ProgressPercent 15、ShieldRemainingCharges 0"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-SECOND-LEVEL-STATUS-001
        - IDF-SHOW-SECOND-LEVEL-STATUS-002
        - IDF-SHOW-SECOND-LEVEL-STATUS-003
        - IDF-SHOW-SECOND-LEVEL-STATUS-004
      domain_rules:
        - DOM-SHOW-SECOND-LEVEL-STATUS-PRE-001
        - DOM-SHOW-SECOND-LEVEL-STATUS-INV-001
        - DOM-SHOW-SECOND-LEVEL-STATUS-POST-001
      technical_contracts:
        - ShowSecondLevelStatusResult.Data
        - TECH-SHOW-SECOND-LEVEL-STATUS-STATE-001
    given:
      - fact: "game.phase == Ready 且 level.number == 2"
    when:
      action: execute_query
      input:
        type: ShowSecondLevelStatusQuery
        fields: {}
    then:
      output:
        type: ShowSecondLevelStatusResult
        fields:
          is_success: true
          failure_code: null
          failure_message: null
          data_expectation: "LevelName 為第二關，CurrentLength 3、TargetLength 20、ProgressPercent 15、ShieldRemainingCharges 0"
      excludes:
        - "第三關目標"
        - "門狀態"
        - "關卡倒數"
      domain_state:
        unchanged: true

  - id: SCN-SHOW-SECOND-LEVEL-STATUS-002
    title: "失敗：目前不是第二關待開始階段。"
    description: "不符合可見條件時拒絕查詢，不得洩漏部分資料。"
    traces:
      requirement: "frame.yaml#use_case.requirement"
      frame_checks:
        - IDF-SHOW-SECOND-LEVEL-STATUS-003
        - IDF-SHOW-SECOND-LEVEL-STATUS-004
      domain_rules:
        - DOM-SHOW-SECOND-LEVEL-STATUS-ERR-001
      technical_contracts:
        - TECH-SHOW-SECOND-LEVEL-STATUS-ERR-001
    given:
      - fact: "不符合 game.phase == Ready 且 level.number == 2"
    when:
      action: execute_query
      input:
        type: ShowSecondLevelStatusQuery
        fields: {}
    then:
      output:
        type: ShowSecondLevelStatusResult
        fields:
          is_success: false
          failure_code: INVALID_GAME_PHASE
          failure_message: "目前不是第二關待開始階段。"
          data: null
      domain_state:
        unchanged: true

