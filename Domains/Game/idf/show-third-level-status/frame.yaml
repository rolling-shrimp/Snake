bounded_context: snake-game
aggregate: game

use_case:
  name: show-third-level-status
  requirement: "第三關待開始時，顯示第三關、蛇長 3/50、進度 6% 與護盾剩餘 0 次。"
frame_type: IDF

world_facts:
  actor: display
  required_state: "game.phase == Ready 且 level.number == 3"
  visibility_scope: "只顯示第三關狀態，不顯示第一、二關狀態"
  side_effect_policy: none

frame_concerns:
  - concern_ref: IDF-CONCERN-001
    check_id: IDF-SHOW-THIRD-LEVEL-STATUS-001
    description: "確保完整輸出 LevelName、CurrentLength、TargetLength、ProgressPercent、ShieldRemainingCharges。"

  - concern_ref: IDF-CONCERN-002
    check_id: IDF-SHOW-THIRD-LEVEL-STATUS-002
    description: "確保 LevelName 為第三關，CurrentLength 3、TargetLength 50、ProgressPercent 6、ShieldRemainingCharges 0，且所有值來自目前 Domain 事實。"

  - concern_ref: IDF-CONCERN-003
    check_id: IDF-SHOW-THIRD-LEVEL-STATUS-003
    description: "確保 只顯示第三關狀態，不顯示第一、二關狀態；排除 第一、二關目標、關卡倒數。"

  - concern_ref: IDF-CONCERN-004
    check_id: IDF-SHOW-THIRD-LEVEL-STATUS-004
    description: "確保查詢不改變任何 Domain、Read Model 版本或遊戲時間。"

