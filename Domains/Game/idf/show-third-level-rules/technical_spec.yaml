use_case: show-third-level-rules
bounded_context: snake-game
aggregate: game
frame_type: IDF

spec_refs:
  domain: domain_spec.yaml

input:
  type: ShowThirdLevelRulesQuery
  source: display_refresh
  fields: []

output:
  type: ShowThirdLevelRulesResult
  fields:
    - name: IsSuccess
      csharp_type: bool
      required: true
    - name: FailureCode
      csharp_type: "string?"
      required: true
    - name: FailureMessage
      csharp_type: "string?"
      required: true
    - name: Data
      csharp_type: "ThirdLevelRulesRspDTO?"
      required: true

data_contract:
  type: ThirdLevelRulesRspDTO
  fields:
    - name: RuleHints
      csharp_type: "List<RuleHintDTO>"
      required: true
      description: "六項有固定 code、text 與順序的第三關提示"

read_port:
  name: IThirdLevelRulesReadPort
  returns: ThirdLevelRulesRspDTO
  side_effect_free: true

domain_to_technical_mapping:
  - domain_rules: [DOM-SHOW-THIRD-LEVEL-RULES-IN-001, DOM-SHOW-THIRD-LEVEL-RULES-PRE-001]
    target: ShowThirdLevelRulesQuery
    description: "無欄位 Query 只辨識本次顯示要求並驗證可見條件。"
  - domain_rules: [DOM-SHOW-THIRD-LEVEL-RULES-POST-001]
    target: ThirdLevelRulesRspDTO
    description: "依序顯示普通食物 +1、特殊食物 +2、護盾 +1、火焰 −2、炸彈致命、不能穿牆"

state_mappings:
  - mapping_id: TECH-SHOW-THIRD-LEVEL-RULES-STATE-001
    description: "Projection 與 Query 都不得呼叫改變 Domain 狀態的方法。"

error_mappings:
  - mapping_id: TECH-SHOW-THIRD-LEVEL-RULES-ERR-001
    condition: "不符合 game.phase == Ready 且 level.number == 3"
    result: ShowThirdLevelRulesResult
    failure_code: INVALID_GAME_PHASE
    failure_message: "目前不是第三關待開始階段。"
    data: null

no_op_mappings: []

