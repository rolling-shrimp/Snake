schema_version: 3
spec_kind: domain_contract
id: V3-DOMAIN-GAME-HANDLE-WALL-COLLISION
domain: HandleWallCollision
frame_ref: V3-FRAME-GAME-HANDLE-WALL-COLLISION
aggregate_refs:
  - V3-AGG-GAME-GAME
  - V3-AGG-SNAKE-SNAKE
  - V3-AGG-BOARD-BOARD
  - V3-AGG-DOORMAZE-DOORMAZE
  - V3-AGG-SHIELD-SHIELD
use_case: HandleWallCollision
input:
  grain: current_tick_state
  owner: GameForm
  type: none
output:
  grain: no_return_value
  owner: HandleWallCollisionUseCase
  type: none
preconditions:
  - id: V3-DOMAIN-HANDLE-WALL-COLLISION-PRE
    rule: "目前為第三關 Playing，且下一個蛇頭格為牆格。"
rules:
  - id: V3-DOMAIN-HANDLE-WALL-COLLISION-RULE
    rule: "第一、二關邊界使用環繞位置；第三關牆格不可提交並記錄牆壁碰撞。"
postconditions:
  - id: V3-DOMAIN-HANDLE-WALL-COLLISION-POST
    rule: "蛇位置未進入牆格，且目前 Tick 存在牆壁碰撞致命事件。"
invariants:
  - id: V3-DOMAIN-HANDLE-WALL-COLLISION-INV
    rule: "致命、保命與通關狀態在同一 Tick 只能產生一個一致結果。"
no_op:
  - "前置條件不成立時不修改遊戲狀態。"
