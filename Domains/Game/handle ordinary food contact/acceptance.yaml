  - id: V3-SCN-HANDLE-ORDINARY-FOOD-CONTACT
    title: "蛇頭接觸普通食物時，普通食物消失且蛇長增加 1 格。"
    given:
      precondition: "目前關卡為 Playing，且蛇頭接觸普通食物。"
    when:
      operation: HandleOrdinaryFoodContact
      call_count: 1
    then:
      postcondition: "蛇長增加 1，食物已移除，進度依新蛇長更新。"
    evidence: [behavioral, invariant]
