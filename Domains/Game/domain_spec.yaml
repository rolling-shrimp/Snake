schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-GAME-GAME
aggregate: Game
state:
  - name: game_id
    type: GameId
    required: true
  - name: phase
    type: GamePhase
    required: true
  - name: last_processed_elapsed_milliseconds
    type: integer
    required: true
    initial_value: 0
value_objects:
  - name: GameId
    kind: opaque_identity
enums:
  - name: GamePhase
    values: [Ready, Playing, GameOver, Completed]
relations:
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-LEVEL-LEVEL
    ownership: reference_only
  - target_ref: V3-AGG-FOOD-FOOD
    ownership: reference_only
  - target_ref: V3-AGG-FIRE-FIRE
    ownership: reference_only
  - target_ref: V3-AGG-SHIELD-SHIELD
    ownership: reference_only
  - target_ref: V3-AGG-BOMB-BOMB
    ownership: reference_only
  - target_ref: V3-AGG-DOORMAZE-DOORMAZE
    ownership: reference_only
  - target_ref: V3-AGG-GAMERESULT-GAMERESULT
    ownership: reference_only
invariants:
  - id: V3-GAME-INV-PHASE
    rule: "phase 只能是 Ready、Playing、GameOver 或 Completed。"
  - id: V3-GAME-INV-ACTIVE-OPERATIONS
    rule: "只有 Playing 允許移動、方向更新、物件觸發、物件補充與門週期更新。"
  - id: V3-GAME-INV-MONOTONIC-TIME
    rule: "last_processed_elapsed_milliseconds 不得為負，且同一關 Playing 期間只能單調增加。"
  - id: V3-GAME-INV-TERMINAL
    rule: "GameOver 與 Completed 不得再接受 Tick 所造成的狀態變更。"
behaviors:
  - id: V3-GAME-BEHAVIOR-START-LEVEL
    name: StartLevel
    input:
      grain: one_start_request_in_ready_phase
    output:
      grain: one_started_or_ignored_result
    rules:
      - "Ready 時可切換為 Playing 並將關卡累積時間基準設為 0。"
      - "非 Ready 或重複開始成功忽略且不改變狀態。"
  - id: V3-GAME-BEHAVIOR-VALIDATE-TICK-TIME
    name: ValidateTickTime
    input:
      grain: one_accumulated_elapsed_milliseconds_value
    output:
      grain: one_valid_or_noop_or_invalid_result
    rules:
      - "負值或小於 last_processed_elapsed_milliseconds 的時間為契約錯誤。"
      - "非 Playing 或時間相同且沒有到期事件時為成功 no-op。"
      - "驗證本身不得更新 last_processed_elapsed_milliseconds。"
  - id: V3-GAME-BEHAVIOR-COMMIT-TICK-TIME
    name: CommitTickTime
    input:
      grain: one_successfully_processed_tick_time
    output:
      grain: one_updated_game_time
    rules:
      - "只能與 ProcessGameTick 的其他 Aggregate 變更一起原子提交。"
  - id: V3-GAME-BEHAVIOR-PREPARE-NEXT-LEVEL
    name: PrepareNextLevel
    input:
      grain: one_passed_level_number
    output:
      grain: one_ready_or_completed_phase
    rules:
      - "第一、二關通過後切換至下一關 Ready。"
      - "第三關通過後切換為 Completed。"
  - id: V3-GAME-BEHAVIOR-END-GAME
    name: EndGame
    input:
      grain: one_unrescued_death_event
    output:
      grain: one_game_over_phase
  - id: V3-GAME-BEHAVIOR-RESTART
    name: Restart
    input:
      grain: one_restart_request
    output:
      grain: one_accepted_or_ignored_result
    rules:
      - "只有 GameOver 或 Completed 接受重玩。"
      - "接受後由 RestartGame Workflow 原子重設所有 Aggregate，Game 直接進入第一關 Playing。"
