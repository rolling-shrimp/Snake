schema_version: 3
spec_kind: presentation_state
id: V3-PRES-STATE-GAME-FIRST-LEVEL-PLAYING
screen: FirstLevelPlaying
grain: atomic_rendered_screen
relations:
  - kind: rendered_by
    target_ref: V3-PRES-WF-GAME-RENDER-SCREEN
  - kind: application_output
    target_ref: V3-DOMAIN-GAME-GET-GAME-SCREEN
visibility:
  required:
    - 10x10-board
    - moving-snake
    - strawberry
    - first-level-name
    - current-snake-length
    - progress-bar-and-percentage
    - strawberry-plus-one-rule
    - wrap-boundary-rule
    - self-collision-death-rule
  forbidden:
    - start-button
    - shield-count
    - special-food
    - fire
    - bomb
    - walls
    - door
    - result-card
    - replay-button
transitions:
  - id: V3-PRES-TRANSITION-FIRST-PLAYING-PASSED
    trigger: LevelPassed
    target_state_ref: V3-PRES-STATE-GAME-SECOND-LEVEL-READY
  - id: V3-PRES-TRANSITION-FIRST-PLAYING-DEATH
    trigger: GameOver
    target_state_ref: V3-PRES-STATE-GAME-GAME-OVER
variants: []
