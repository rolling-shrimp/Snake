schema_version: 3
spec_kind: presentation_state
id: V3-PRES-STATE-GAME-SECOND-LEVEL-PLAYING
screen: SecondLevelPlaying
grain: atomic_rendered_screen
relations:
  - kind: rendered_by
    target_ref: V3-PRES-WF-GAME-RENDER-SCREEN
  - kind: application_output
    target_ref: V3-WF-GAME-PROCESS-TICK
visibility:
  required:
    - 10x10-board
    - moving-snake
    - strawberry
    - blueberry
    - shield
    - fire
    - second-level-name
    - current-snake-length
    - progress-bar-and-percentage
    - current-shield-count
    - second-level-rule-hints
  forbidden:
    - start-button
    - first-level-result-card
    - bomb
    - walls
    - door
    - replay-button
transitions:
  - id: V3-PRES-TRANSITION-SECOND-PLAYING-PASSED
    trigger: LevelPassed
    target_state_ref: V3-PRES-STATE-GAME-THIRD-LEVEL-READY
  - id: V3-PRES-TRANSITION-SECOND-PLAYING-DEATH
    trigger: GameOver
    target_state_ref: V3-PRES-STATE-GAME-GAME-OVER
  - id: V3-PRES-TRANSITION-SECOND-PLAYING-RESCUED
    trigger: ShieldRescued
    target_state_ref: V3-PRES-STATE-GAME-SECOND-LEVEL-PLAYING
variants:
  - id: V3-PRES-VARIANT-SECOND-PLAYING-SHIELD-RESCUE
    trigger: ShieldRescued
    required_effects:
      - shield-count-updated
      - snake-restored-to-safe-start
      - pre-hit-length-and-progress-preserved
      - automatic-movement-resumed
      - no-start-or-result-screen
