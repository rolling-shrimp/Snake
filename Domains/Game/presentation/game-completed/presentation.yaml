schema_version: 3
spec_kind: presentation_state
id: V3-PRES-STATE-GAME-GAME-COMPLETED
screen: GameCompleted
grain: atomic_rendered_screen
relations:
  - kind: rendered_by
    target_ref: V3-PRES-WF-GAME-RENDER-SCREEN
  - kind: application_output
    target_ref: V3-DOMAIN-GAME-GET-GAME-SCREEN
visibility:
  required:
    - frozen-third-level-final-board
    - completed-message
    - final-snake-length
    - progress-100-percent
    - replay-button
  forbidden:
    - moving-snake
    - start-button
    - game-over-message
transitions:
  - id: V3-PRES-TRANSITION-GAME-COMPLETED-RESTART
    trigger: RestartAccepted
    target_state_ref: V3-PRES-STATE-GAME-FIRST-LEVEL-PLAYING
variants: []
