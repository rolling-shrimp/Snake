schema_version: 3
spec_kind: presentation_state
id: V3-PRES-STATE-GAME-THIRD-LEVEL-PLAYING
screen: ThirdLevelPlaying
grain: atomic_rendered_screen
relations:
  - kind: rendered_by
    target_ref: V3-PRES-WF-GAME-RENDER-SCREEN
  - kind: application_output
    target_ref: V3-DOMAIN-GAME-GET-GAME-SCREEN
visibility:
  required:
    - 10x10-maze-board
    - outer-and-inner-walls
    - current-door-state
    - door-closing-warning
    - moving-snake
    - strawberry
    - blueberry
    - shield
    - fire
    - bomb
    - third-level-name
    - current-snake-length
    - progress-bar-and-percentage
    - current-shield-count
    - third-level-rule-hints
  forbidden:
    - start-button
    - second-level-result-card
    - replay-button
transitions:
  - id: V3-PRES-TRANSITION-THIRD-PLAYING-COMPLETED
    trigger: GameCompleted
    target_state_ref: V3-PRES-STATE-GAME-GAME-COMPLETED
  - id: V3-PRES-TRANSITION-THIRD-PLAYING-DEATH
    trigger: GameOver
    target_state_ref: V3-PRES-STATE-GAME-GAME-OVER
  - id: V3-PRES-TRANSITION-THIRD-PLAYING-RESCUED
    trigger: ShieldRescued
    target_state_ref: V3-PRES-STATE-GAME-THIRD-LEVEL-PLAYING
variants:
  - id: V3-PRES-VARIANT-THIRD-PLAYING-SHIELD-RESCUE
    trigger: ShieldRescued
    required_effects:
      - shield-count-updated
      - snake-restored-to-safe-start
      - pre-hit-length-and-progress-preserved
      - automatic-movement-resumed
      - no-start-or-result-screen
  - id: V3-PRES-VARIANT-THIRD-PLAYING-DOOR-WARNING
    trigger: DoorClosingWarning
    required_effects:
      - existing-door-control-retained
      - warning-visual-enabled
      - board-layout-not-rebuilt
