schema_version: 3
spec_kind: presentation_state
id: V3-PRES-STATE-GAME-GAME-OVER
screen: GameOver
grain: atomic_rendered_screen
relations:
  - kind: rendered_by
    target_ref: V3-PRES-WF-GAME-RENDER-SCREEN
  - kind: application_output
    target_ref: V3-DOMAIN-GAME-GET-GAME-SCREEN
visibility:
  required:
    - game-over-message
    - failed-level
    - final-snake-length
    - replay-button
  forbidden:
    - game-board
    - moving-snake
    - board-objects
    - start-button
    - completed-message
transitions:
  - id: V3-PRES-TRANSITION-GAME-OVER-RESTART
    trigger: RestartAccepted
    target_state_ref: V3-PRES-STATE-GAME-FIRST-LEVEL-PLAYING
variants: []
