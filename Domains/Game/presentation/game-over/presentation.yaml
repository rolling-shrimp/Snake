schema_version: 1
screen:
  screen_id: game-over
  bounded_context: snake-game
  aggregate: game
  phase: game_over
  level: failed-level
  board_mode: none
grain:
  input: use_case_results_and_read_models
  output: rendered_screen
  contract_owner: WinForms
presentation_relations:
  - relation_id: PRES-GAME-OVER-RESULT
    target_use_case: show-game-over-result
    ownership: reference_only
    target_specs:
      frame: ../../idf/show-game-over-result/frame.yaml
      domain: ../../idf/show-game-over-result/domain_spec.yaml
      technical: ../../idf/show-game-over-result/technical_spec.yaml
    frame_check_refs: [IDF-SHOW-GAME-OVER-RESULT-001]
    domain_rule_refs: [DOM-SHOW-GAME-OVER-RESULT-IN-001]
    technical_contract_refs: [TECH-SHOW-GAME-OVER-RESULT-STATE-001]
  - relation_id: PRES-GAME-OVER-REPLAY
    target_use_case: reset-game-for-replay
    ownership: reference_only
    target_specs:
      frame: ../../rif/reset-game-for-replay/frame.yaml
      domain: ../../rif/reset-game-for-replay/domain_spec.yaml
      technical: ../../rif/reset-game-for-replay/technical_spec.yaml
    frame_check_refs: [RIF-RESET-GAME-FOR-REPLAY-001]
    domain_rule_refs: [DOM-RESET-GAME-FOR-REPLAY-IN-001]
    technical_contract_refs: [TECH-RESET-GAME-FOR-REPLAY-STATE-001]
visibility:
  required:
    - game-over-message
    - failed-level
    - final-snake-length
    - replay-button
  forbidden:
    - game-board
    - moving-snake
    - board-objects
    - start-button
    - completed-message
transitions:
  - trigger: replay
    relation_ref: PRES-GAME-OVER-REPLAY
    target_screen: first-level-playing
