schema_version: 3
spec_kind: presentation_workflow
id: V3-PRES-WF-GAME-HANDLE-DIRECTION-INPUT
workflow: HandleDirectionInput
technical_ref: V3-TECH-GAME-SET-SNAKE-DIRECTION
input:
  model: WinFormsCommandKeyMessage
  grain: one_direction_key_message
  owner: GameForm
  rules:
    - "Up、Down、Left、Right 由 ProcessCmdKey 在控制項導覽前處理。"
output:
  model: SnakeDirectionDTO
  grain: one_direction_request
  owner: GameForm
  guarantees:
    - "每個方向鍵訊息只呼叫一次 SetSnakeDirectionUseCase。"
runtime_policy:
  delivery_stage: ProcessCmdKey
  focus_independent: true
  dispatch_count: exactly_once
  parallel_key_down_path_allowed: false
  direction_mapping:
    Up: { x: 0, y: -1 }
    Down: { x: 0, y: 1 }
    Left: { x: -1, y: 0 }
    Right: { x: 1, y: 0 }
acceptance_ref: V3-ACCEPT-GAME-HANDLE-DIRECTION-INPUT
