schema_version: 3
spec_kind: presentation_workflow
id: V3-PRES-WF-GAME-RENDER-SCREEN
workflow: RenderGameScreen
technical_ref: V3-TECH-GAME-GET-GAME-SCREEN
input:
  model: GameScreenDTO
  grain: one_complete_game_screen
  owner: GetGameScreenUseCase
  rules:
    - "GameScreenDTO 必須包含棋盤、蛇、物件、關卡、進度、規則、結果與可用操作。"
output:
  grain: changed_ui_controls_and_board_cells
  owner: GameForm
  guarantees:
    - "GameForm 只使用一份 GameScreenDTO 判斷本次需要更新的畫面內容。"
    - "重複套用畫面不清空、不重建未變更控制項，也不讓未變更棋盤格重畫。"
state_refs:
  - V3-PRES-STATE-GAME-FIRST-LEVEL-READY
  - V3-PRES-STATE-GAME-FIRST-LEVEL-PLAYING
  - V3-PRES-STATE-GAME-SECOND-LEVEL-READY
  - V3-PRES-STATE-GAME-SECOND-LEVEL-PLAYING
  - V3-PRES-STATE-GAME-THIRD-LEVEL-READY
  - V3-PRES-STATE-GAME-THIRD-LEVEL-PLAYING
  - V3-PRES-STATE-GAME-GAME-OVER
  - V3-PRES-STATE-GAME-GAME-COMPLETED
render_policy:
  owner: GameForm
  method: ApplyScreen
  board_update: create_once_then_update_changed_cells
  visibility: update_only_when_value_changes
runtime_policy:
  event_owner: GameForm
  use_case_order_owner: GameForm
  timer_interval_ms: 250
  move_calls_per_tick: 1
  accumulated_time_allowed: false
  catch_up_loop_allowed: false
  forbidden_roles: [Presenter, IGameView, Controller, GameExecutor, GameRender, Renderer, ViewModel, Display, custom_Control]
acceptance_ref: V3-ACCEPT-GAME-RENDER-SCREEN
