schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-BOMB-BOMB
aggregate: Bomb
state:
  - name: active_item
    type: BombItem
    required: false
  - name: pending_spawn
    type: boolean
    required: true
value_objects:
  - name: BombItem
    fields:
      - name: position
        type: GridPosition
        required: true
enums: []
relations:
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-SHIELD-SHIELD
    ownership: reference_only
  - target_ref: V3-AGG-GAMERESULT-GAMERESULT
    ownership: reference_only
invariants:
  - id: V3-BOMB-INV-LEVEL
    rule: "Bomb 只允許出現在第三關，且同時最多一個 active item。"
  - id: V3-BOMB-INV-LEGAL-POSITION
    rule: "BombItem 必須位於 Board 合法且未占用的位置。"
behaviors:
  - id: V3-BOMB-BEHAVIOR-INSPECT-HEAD-CONTACT
    name: InspectHeadContact
    input:
      grain: one_candidate_head_position
    output:
      grain: zero_or_one_bomb_death_event
    rules:
      - "只有蛇頭接觸才回傳 Bomb death event，檢查階段不得先移除 BombItem。"
  - id: V3-BOMB-BEHAVIOR-COMMIT-CONTACT
    name: CommitContact
    input:
      grain: one_resolved_bomb_death_branch
    output:
      grain: one_removed_bomb_item
    rules:
      - "死亡事件由 Shield 決定保命或 GameOver 後，才與 Tick 一起提交移除。"
  - id: V3-BOMB-BEHAVIOR-SPAWN
    name: Spawn
    input:
      grain: one_third_level_startup_request_and_zero_or_one_legal_position
    output:
      grain: one_spawned_or_pending_result
    rules:
      - "只允許第三關的 StartCurrentLevel 工作快照，且不得已有 active BombItem。"
      - "有合法格位時建立一個 BombItem，並清除 pending_spawn。"
      - "沒有合法格位時不得製造預設座標或重疊物件，只將 pending_spawn 保持為 true。"
  - id: V3-BOMB-BEHAVIOR-REPLENISH
    name: Replenish
    input:
      grain: one_final_tick_outcome
    output:
      grain: one_spawned_or_pending_or_stopped_result
    rules:
      - "只有保命完成且 Game 仍為第三關 Playing 時才在其他合法格補充。"
      - "GameOver 或 Completed 不得補充；沒有合法格位時保留 pending_spawn。"
  - id: V3-BOMB-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_restart_request
    output:
      grain: one_empty_bomb_state
    rules:
      - "清除 active_item 並將 pending_spawn 設為 false。"
