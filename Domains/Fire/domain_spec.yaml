schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-FIRE-FIRE
aggregate: Fire
state:
  - name: active_item
    type: FireItem
    required: false
  - name: pending_spawn
    type: boolean
    required: true
value_objects:
  - name: FireItem
    fields:
      - name: position
        type: GridPosition
        required: true
  - name: FireContact
    fields:
      - name: length_delta
        type: integer
        required: true
        fixed_value: -2
enums:
  - name: FireOutcome
    values: [NonFatal, FatalFire]
relations:
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
  - target_ref: V3-AGG-SHIELD-SHIELD
    ownership: reference_only
invariants:
  - id: V3-FIRE-INV-LEVEL
    rule: "Fire 只允許出現在第二、三關，且同時最多一個 active item。"
  - id: V3-FIRE-INV-LEGAL-POSITION
    rule: "FireItem 必須位於 Board 合法且未占用的位置。"
behaviors:
  - id: V3-FIRE-BEHAVIOR-INSPECT-HEAD-CONTACT
    name: InspectHeadContact
    input:
      grain: one_candidate_head_position
    output:
      grain: zero_or_one_fire_contact
    rules:
      - "檢查階段不得移除 FireItem 或改變 Snake。"
  - id: V3-FIRE-BEHAVIOR-EVALUATE-EFFECT
    name: EvaluateEffect
    input:
      grain: one_previous_snake_length
    output:
      grain: one_nonfatal_or_fatal_fire_result
    rules:
      - "減 2 後至少一格時為 NonFatal。"
      - "減 2 後為 0 或以下時為 FatalFire，致死減長等待護盾決策。"
  - id: V3-FIRE-BEHAVIOR-COMMIT-EFFECT
    name: CommitEffect
    input:
      grain: one_resolved_fire_branch
    output:
      grain: one_removed_fire_item_and_effect_result
    rules:
      - "NonFatal 才提交縮短且不得消耗 Shield。"
      - "FatalFire 被 Shield 保命時不提交致死減長並保留受擊前長度。"
      - "FatalFire 未保命時有效長度為 0。"
  - id: V3-FIRE-BEHAVIOR-SPAWN
    name: Spawn
    input:
      grain: one_level_startup_request_and_zero_or_one_legal_position
    output:
      grain: one_spawned_or_pending_result
    rules:
      - "只允許第二、三關的 StartCurrentLevel 工作快照，且不得已有 active FireItem。"
      - "有合法格位時建立一個 FireItem，並清除 pending_spawn。"
      - "沒有合法格位時不得製造預設座標或重疊物件，只將 pending_spawn 保持為 true。"
  - id: V3-FIRE-BEHAVIOR-REPLENISH
    name: Replenish
    input:
      grain: one_final_tick_outcome
    output:
      grain: one_spawned_or_pending_or_stopped_result
    rules:
      - "只有完成效果、護盾、死亡與通關判定後，Game 仍為 Playing 才補充。"
      - "沒有合法格位時保留 pending_spawn；關卡結束時清除。"
  - id: V3-FIRE-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_restart_request
    output:
      grain: one_empty_fire_state
    rules:
      - "清除 active_item 並將 pending_spawn 設為 false。"
