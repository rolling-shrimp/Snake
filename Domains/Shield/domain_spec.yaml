schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-SHIELD-SHIELD
aggregate: Shield
state:
  - name: active_item
    type: ShieldItem
    required: false
  - name: pending_spawn
    type: boolean
    required: true
  - name: remaining_charges
    type: integer
    required: true
  - name: spawned_count
    type: integer
    required: true
value_objects:
  - name: ShieldItem
    fields:
      - name: position
        type: GridPosition
        required: true
  - name: RescueDecision
    fields:
      - name: is_rescued
        type: boolean
        required: true
      - name: remaining_charges_after_commit
        type: integer
        required: true
enums:
  - name: ProtectedDeathCause
    values: [SelfCollision, BoundaryCollision, WallCollision, ClosedDoorCollision, Bomb, FatalFire]
relations:
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
  - target_ref: V3-AGG-GAMERESULT-GAMERESULT
    ownership: reference_only
invariants:
  - id: V3-SHIELD-INV-CHARGES
    rule: "remaining_charges 不得小於 0；護盾採次數制且沒有時間倒數。"
  - id: V3-SHIELD-INV-SPAWN-COUNT
    rule: "第二、三關每關 spawned_count 介於 0 至 2，且同時最多一個 ShieldItem。"
  - id: V3-SHIELD-INV-LEGAL-POSITION
    rule: "活動 ShieldItem 必須位於 Board 合法且未占用的位置。"
behaviors:
  - id: V3-SHIELD-BEHAVIOR-INSPECT-HEAD-CONTACT
    name: InspectHeadContact
    input:
      grain: one_candidate_head_position
    output:
      grain: zero_or_one_shield_collection
    rules:
      - "檢查階段不得移除 ShieldItem 或增加次數。"
  - id: V3-SHIELD-BEHAVIOR-COMMIT-COLLECTION
    name: CommitCollection
    input:
      grain: one_successfully_processed_shield_collection
    output:
      grain: one_incremented_charge_and_spawn_state
    rules:
      - "提交時 active item 消失、remaining_charges 加 1。"
      - "第一個被吃後可安排第二個；第二個之後不得再產生。"
  - id: V3-SHIELD-BEHAVIOR-DECIDE-RESCUE
    name: DecideRescue
    input:
      grain: one_protected_death_event
    output:
      grain: one_rescue_decision
    rules:
      - "remaining_charges 大於 0 時接受保命，否則拒絕。"
      - "決策階段不得先扣除 remaining_charges。"
      - "非致死 Fire 不屬於死亡事件且不得消耗護盾。"
  - id: V3-SHIELD-BEHAVIOR-COMMIT-RESCUE
    name: CommitRescue
    input:
      grain: one_accepted_rescue_with_safe_body
    output:
      grain: one_consumed_charge_and_preserved_level_state
    rules:
      - "只在 Snake 安全身體與衝突物件搬移都可提交時扣除一次。"
      - "保命保留受擊前完整蛇長；FatalFire 不提交致死減長。"
      - "保命不重設 spawned_count，也不補發已使用的 ShieldItem。"
  - id: V3-SHIELD-BEHAVIOR-SPAWN
    name: Spawn
    input:
      grain: one_legal_position_and_remaining_spawn_quota
    output:
      grain: one_spawned_or_pending_result
    rules:
      - "只允許第二、三關且 spawned_count 小於 2。"
      - "沒有合法格位時保留 pending_spawn，不得重疊產生。"
  - id: V3-SHIELD-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_new_level_or_restart_request
    output:
      grain: one_zeroed_shield_state
    rules:
      - "清除 active item、pending_spawn、remaining_charges 與 spawned_count。"
