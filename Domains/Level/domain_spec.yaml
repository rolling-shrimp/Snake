schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-LEVEL-LEVEL
aggregate: Level
state:
  - name: level_id
    type: LevelId
    required: true
  - name: number
    type: LevelNumber
    required: true
value_objects:
  - name: LevelId
    kind: opaque_identity
  - name: LevelPolicy
    fields:
      - name: target_length
        type: integer
        required: true
      - name: boundary_policy
        type: BoundaryPolicy
        required: true
      - name: allowed_object_types
        type: List<ObjectType>
        required: true
  - name: LevelProgress
    fields:
      - name: current_length
        type: integer
        required: true
      - name: target_length
        type: integer
        required: true
      - name: percentage
        type: integer
        required: true
      - name: is_complete
        type: boolean
        required: true
enums:
  - name: LevelNumber
    values: [1, 2, 3]
  - name: BoundaryPolicy
    values: [Wrap, Blocked]
  - name: ObjectType
    values: [OrdinaryFood, SpecialFood, Shield, Fire, Bomb, DoorAndMaze]
relations:
  - target_ref: V3-AGG-SNAKE-SNAKE
    ownership: reference_only
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
invariants:
  - id: V3-LEVEL-INV-NUMBER
    rule: "關卡編號只能是 1、2、3。"
  - id: V3-LEVEL-INV-SEQUENCE
    rule: "關卡只能依 1→2→3 前進，不得跳關或倒退。"
  - id: V3-LEVEL-INV-POLICY
    rule: "第一、二關目標長度為 20 且使用 Wrap；第三關目標長度為 50 且使用 Blocked。"
behaviors:
  - id: V3-LEVEL-BEHAVIOR-GET-POLICY
    name: GetPolicy
    input:
      grain: current_level
    output:
      grain: one_level_policy
    rules:
      - "第一關只允許 OrdinaryFood。"
      - "第二關允許 OrdinaryFood、SpecialFood、Shield、Fire。"
      - "第三關允許第二關物件以及 Bomb、DoorAndMaze。"
  - id: V3-LEVEL-BEHAVIOR-CALCULATE-PROGRESS
    name: CalculateProgress
    input:
      grain: one_non_negative_snake_length
    output:
      grain: one_level_progress
    rules:
      - "percentage 為 current_length / target_length，限制於 0 至 100。"
      - "實際蛇長不得因顯示上限而截斷。"
      - "第一、二關長度 3 為 15%；第三關長度 3 為 6%。"
  - id: V3-LEVEL-BEHAVIOR-EVALUATE-COMPLETION
    name: EvaluateCompletion
    input:
      grain: one_post_effect_snake_length
    output:
      grain: one_completed_or_incomplete_result
    rules:
      - "長度達到或超過目標即完成。"
      - "第三關 49 加 2 後以實際長度 51 完成，不截斷為 50。"
      - "此行為只判定結果，不自行準備下一關或結束 Game。"
  - id: V3-LEVEL-BEHAVIOR-ADVANCE
    name: Advance
    input:
      grain: one_passed_current_level
    output:
      grain: one_next_level_or_game_completed_result
    rules:
      - "第一、二關回傳下一關編號。"
      - "第三關回傳 GameCompleted，不產生第四關。"
  - id: V3-LEVEL-BEHAVIOR-RESET
    name: Reset
    input:
      grain: one_restart_request
    output:
      grain: first_level
