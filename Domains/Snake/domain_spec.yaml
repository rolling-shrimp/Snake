schema_version: 3
spec_kind: aggregate_contract
id: V3-AGG-SNAKE-SNAKE
aggregate: Snake
state:
  - name: body_cells
    type: List<GridPosition>
    required: true
    ordering: head_to_tail
  - name: current_direction
    type: Direction
    required: true
  - name: queued_direction
    type: Direction
    required: false
value_objects:
  - name: SnakeMovementPlan
    fields:
      - name: next_head
        type: GridPosition
        required: true
      - name: growth_delta
        type: integer
        required: true
        allowed_values: [0, 1, 2]
      - name: tail_will_leave
        type: boolean
        required: true
      - name: self_collision_cells
        type: List<GridPosition>
        required: true
      - name: resulting_body_cells
        type: List<GridPosition>
        required: true
  - name: LengthChangeResult
    fields:
      - name: previous_length
        type: integer
        required: true
      - name: requested_delta
        type: integer
        required: true
      - name: effective_length
        type: integer
        required: true
      - name: is_depleted
        type: boolean
        required: true
enums:
  - name: Direction
    values: [Up, Down, Left, Right]
relations:
  - target_ref: V3-AGG-BOARD-BOARD
    ownership: reference_only
  - target_ref: V3-AGG-LEVEL-LEVEL
    ownership: reference_only
invariants:
  - id: V3-SNAKE-INV-BODY-LENGTH
    rule: "蛇長必須等於 body_cells 數量；非終局有效蛇身至少包含一格。"
  - id: V3-SNAKE-INV-BODY-ORDER
    rule: "body_cells 必須由蛇頭到蛇尾排列，順序不得反轉或省略中間格。"
  - id: V3-SNAKE-INV-BODY-UNIQUE
    rule: "body_cells 中每個 GridPosition 必須唯一。"
  - id: V3-SNAKE-INV-BODY-CONTIGUOUS
    rule: "每對相鄰 body_cells 必須依目前 Level 的 Board adjacency policy 連續。"
  - id: V3-SNAKE-INV-DIRECTION
    rule: "方向只能是 Up、Down、Left、Right，且下一方向不得與目前方向直接相反。"
  - id: V3-SNAKE-INV-ALL-MUTATIONS
    rule: "移動、成長、縮短、護盾重設與關卡重設後都必須重新滿足身體順序、唯一及連續不變式。"
behaviors:
  - id: V3-SNAKE-BEHAVIOR-QUEUE-DIRECTION
    name: QueueDirection
    input:
      grain: one_direction
    output:
      grain: one_accepted_or_ignored_result
    rules:
      - "只有四個 Direction enum 值可進入此行為。"
      - "直接反向時成功忽略且不改變 queued_direction。"
  - id: V3-SNAKE-BEHAVIOR-PLAN-MOVEMENT
    name: PlanMovement
    input:
      grain: one_resolved_next_head_and_growth_delta
      fields: [next_head, growth_delta, board_policy, blocked_cells]
    output:
      grain: one_snake_movement_plan_or_failure
    rules:
      - "必須先知道下一格物件效果所決定的 growth_delta，再計算尾巴是否離開。"
      - "growth_delta 為 0 時 tail_will_leave 為 true，自撞集合排除本次會離開的舊尾格。"
      - "growth_delta 為 1 或 2 時舊尾格保留，自撞集合包含完整既有蛇身。"
      - "growth_delta 為 0 時 resulting_body_cells 為新頭加上移除舊尾後的身體。"
      - "growth_delta 為 1 時 resulting_body_cells 為新頭加上完整舊蛇身。"
      - "growth_delta 為 2 時先保留舊尾，再依 Board 提供的直後、左側、右側候選順序附加第一個合法尾端格。"
      - "growth_delta 為 2 且三個尾端候選都不合法時回傳失敗，不得產生不連續或重疊蛇身。"
      - "計畫只計算結果，不得在成功提交前修改 Snake 狀態。"
  - id: V3-SNAKE-BEHAVIOR-COMMIT-MOVEMENT
    name: CommitMovement
    input:
      grain: one_validated_snake_movement_plan
    output:
      grain: one_committed_snake_state
    rules:
      - "只有通過碰撞、物件效果與 Workflow 原子提交條件的計畫可以提交。"
      - "提交後 body_cells 必須等於 plan.resulting_body_cells 並滿足全部不變式。"
      - "提交使用 queued_direction ?? current_direction 作為本次 effective_direction。"
      - "提交後 current_direction 必須等於 effective_direction，queued_direction 必須清空。"
  - id: V3-SNAKE-BEHAVIOR-CHANGE-LENGTH
    name: ChangeLength
    input:
      grain: one_negative_length_delta
    output:
      grain: one_length_change_result
    rules:
      - "負值先計算 max(0, previous_length + requested_delta)。"
      - "結果至少為 1 時從尾端縮短；結果為 0 時只回報 depleted，是否提交由死亡與護盾分支決定。"
  - id: V3-SNAKE-BEHAVIOR-RESET-SAFELY
    name: ResetSafely
    input:
      grain: one_head_to_tail_safe_body
    output:
      grain: one_reset_snake_state
    rules:
      - "新關卡或重玩使用長度 3、方向 Right。"
      - "護盾保命使用受擊前完整長度，不提交致死減長。"
      - "安全身體必須由 Board 提供並滿足全部 Snake 不變式。"
